<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألعاب حاتم</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0b1a33,#241046);color:#fff;font-family:Tahoma,Arial,sans-serif;padding:24px 16px}
h1{text-align:center;margin:10px 0 4px;font-size:clamp(28px,6vw,44px);color:#ffd23c}
p.sub{text-align:center;margin:0 0 26px;color:#bfd2f0}
.grid{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
a.card{display:block;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:18px;text-decoration:none;color:#fff}
a.card:hover{border-color:#ffd23c;transform:translateY(-2px)}
.card h2{margin:0 0 6px;font-size:22px}
.card span{color:#9fd0ff;font-size:14px;line-height:1.7}
.soon{opacity:.5;border-style:dashed}
footer{max-width:900px;margin:30px auto 0;text-align:center;color:#8fa3c8;font-size:12px;line-height:1.8}
</style>
</head>
<body>
<h1>🎮 ألعاب حاتم</h1>
<p class="sub">العب مباشرة من الموبايل أو الآيباد أو اللاب توب — بدون تحميل</p>
<div class="grid">
  <a class="card" href="sonic/">
    <h2>🦔 سونيك – مغامرة الفيلم</h2>
    <span>5 فصول: أنقذ تيلز وناكلز وشادو واهزم الدكتور روبوتنيك. تشجيع بصوت مصري وحفظ للتقدم.</span>
  </a>
  <div class="card soon"><h2>🚀 قريبًا</h2><span>لعبة جديدة قيد التجهيز…</span></div>
</div>
<footer>لعبة سونيك لعبة معجبين غير رسمية وغير تجارية — الشخصيات ملك SEGA / Paramount.</footer>
</body>
</html>
