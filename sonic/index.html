<style>
:root{--u:min(16vmin,84px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;touch-action:none}
.tb{position:fixed;width:var(--u);height:var(--u);border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.65);color:#fff;font:bold calc(var(--u)*.28) Tahoma,Arial,sans-serif;display:none;align-items:center;justify-content:center;touch-action:none;text-shadow:0 1px 3px #000;z-index:5}
.tb.on{background:rgba(255,255,255,.5)}
body.touch .tb{display:flex}
body.inmenu .tb{display:none!important}
#bl{left:calc(env(safe-area-inset-left) + 2vmin);bottom:calc(env(safe-area-inset-bottom) + 3vmin)}
#br{left:calc(env(safe-area-inset-left) + 2vmin + var(--u)*1.15);bottom:calc(env(safe-area-inset-bottom) + 3vmin)}
#bd{left:calc(env(safe-area-inset-left) + 2vmin + var(--u)*.58);bottom:calc(env(safe-area-inset-bottom) + 3vmin + var(--u)*1.1);width:calc(var(--u)*.8);height:calc(var(--u)*.8)}
#bj{right:calc(env(safe-area-inset-right) + 2vmin);bottom:calc(env(safe-area-inset-bottom) + 3vmin);width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);background:rgba(60,160,255,.35)}
#ba{right:calc(env(safe-area-inset-right) + 2vmin + var(--u)*1.35);bottom:calc(env(safe-area-inset-bottom) + 3vmin);background:rgba(255,90,60,.35)}
#bs{right:calc(env(safe-area-inset-right) + 2vmin + var(--u)*.1);bottom:calc(env(safe-area-inset-bottom) + 3vmin + var(--u)*1.35);width:calc(var(--u)*.8);height:calc(var(--u)*.8);background:rgba(255,220,60,.35)}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;font-family:Tahoma,Arial,sans-serif;padding:10px;overflow:auto}
#menu .box{background:rgb(8,18,48);border:3px solid #ffd23c;border-radius:18px;padding:16px 22px;width:min(92vw,460px);max-height:96vh;overflow:auto;color:#fff;text-align:center}

#pz .box{background:rgb(8,18,48);border:3px solid #35d6ff;border-radius:18px;padding:16px 20px;width:min(94vw,440px);max-height:96vh;overflow:auto;color:#fff;text-align:center}

#pm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:12;background:rgba(0,0,0,.6);font-family:Tahoma,Arial,sans-serif}
#pm .box{background:rgba(8,18,48,.96);border:3px solid #ffd23c;border-radius:18px;padding:18px 22px;width:min(88vw,380px);text-align:center;color:#fff}
#pm h2{margin:0 0 10px;color:#ffd23c}
#pm button{display:block;width:100%;margin:9px 0;font:bold 20px Tahoma,Arial,sans-serif;padding:12px;border-radius:12px;border:0;color:#fff;background:#1f4aa8}
#pm #px{background:#a3202a}
#bmX{right:calc(env(safe-area-inset-right) + 2vmin);top:calc(env(safe-area-inset-top) + 2vmin);width:calc(var(--u)*.55);height:calc(var(--u)*.55);bottom:auto;background:rgba(0,0,0,.35)}
@media (max-height:520px){
#dfs button,#vsel button#fs{font-size:12px;padding:4px 10px}
#chs{gap:4px;margin:2px 0}#chs button{width:56px;font-size:11px;padding:2px}#chs button img{width:36px;height:36px;margin-bottom:1px}
#menu{padding:4px}
#menu .box{padding:8px 14px;width:min(96vw,720px);max-height:98vh}
#menu h1{font-size:26px}#menu h2{font-size:15px;margin:0 0 2px}
#menu label{margin:4px 0 2px;font-size:13px}
#nm{font-size:18px;padding:5px}
#lv{gap:4px;margin:3px 0}#lv button{font-size:12px;padding:5px 7px}
#vsel button{font-size:12px;padding:5px 8px}
#go{font-size:19px;padding:8px;margin-top:6px}
#menu small{font-size:10px;margin-top:3px;line-height:1.4}
#menu .ck{font-size:12px}
#pz .box{padding:8px 14px}#pzq{font-size:17px;margin:2px 0 6px}#pzo button{padding:9px 6px;font-size:18px}#pzo button.sm{height:56px}
#pm .box{padding:10px 16px}#pm button{padding:8px;margin:5px 0;font-size:17px}
}
#rot{position:fixed;inset:0;background:#0b1a33;color:#fff;font:bold 22px Tahoma,Arial,sans-serif;display:none;align-items:center;justify-content:center;text-align:center;z-index:20;padding:30px;line-height:1.8}
</style>

<script>
'use strict';
const BUILD=16;
(function(){try{fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.v>BUILD&&!sessionStorage.getItem('rl'+j.v)){sessionStorage.setItem('rl'+j.v,'1');location.replace(location.pathname+'?v='+j.v+'&t='+Date.now());}}).catch(()=>{});}catch(e){}})();
const W=960,H=540,GR=.6,FONT='Tahoma, Arial, sans-serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');

/* ---------- responsive: laptop / phone / iPad ---------- */
const isTouch=(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches)||'ontouchstart' in window&&matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*s*dpr);
  const nw=Math.max(W,Math.min(pw,1920));
  if(cv.width!==nw){cv.width=nw;cv.height=Math.round(nw*H/W);}
  document.getElementById('rot').style.display=(isTouch&&vh>vw)?'flex':'none';
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#menu,#pz,#pm,#rs'))return;e.preventDefault();},{passive:false});

/* ---------- input ---------- */
const held={},once={};
function press(a){if(!held[a])once[a]=true;held[a]=true;audioInit();}
function release(a){held[a]=false;}
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowDown:'down',s:'down',S:'down',
 ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',z:'jump',Z:'jump',x:'att',X:'att',j:'att',J:'att',k:'att',K:'att',
 q:'sw',Q:'sw',Tab:'sw',Enter:'confirm','1':'c1','2':'c2','3':'c3','4':'c4','5':'c5','6':'c6'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();else if(state==='puzzle')$('pzx').click();return;}const a=KM[e.key];if(a){e.preventDefault();if(!e.repeat)press(a);if(a==='jump'||a==='att')held[a]=true;}});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const a=KM[e.key];if(a)release(a);});
function bindBtn(id,act){const el=document.getElementById(id),ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);ids.add(e.pointerId);el.classList.add('on');press(act);});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){el.classList.remove('on');release(act);}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
[['bl','left'],['br','right'],['bd','down'],['bj','jump'],['ba','att'],['bs','sw']].forEach(a=>bindBtn(a[0],a[1]));
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)*W/r.width,gy=(e.clientY-r.top)*H/r.height;
  if(state==='play'&&Math.hypot(gx-(W/2+70),gy-24)<30){pauseGame();return;}once.confirm=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});

/* ---------- audio ---------- */
let AC;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
const SFX={ring:[1200,1800,.12,'square'],jump:[300,700,.15,'square'],hit:[400,80,.3,'sawtooth'],kill:[500,200,.15,'triangle'],
 spring:[300,900,.25,'square'],free:[500,1500,.45,'triangle'],boom:[200,40,.5,'sawtooth'],dash:[200,900,.2,'sawtooth'],bonk:[250,120,.1,'square']};
function sfx(n){if(!AC)return;const S=SFX[n],t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();
  o.type=S[3];o.connect(v);v.connect(AC.destination);o.frequency.setValueAtTime(S[0],t);o.frequency.exponentialRampToValueAtTime(S[1],t+S[2]);
  v.gain.setValueAtTime(.07,t);v.gain.exponentialRampToValueAtTime(.001,t+S[2]);o.start(t);o.stop(t+S[2]);}

/* ---------- image assets (portraits + sprites) ---------- */
const IMG={};['p_sonic.jpg','p_tails.jpg','p_knuckles.jpg','p_super.jpg','p_silver.jpg','p_amy.jpg'].forEach(n=>{const i=new Image();i.src='assets/'+n+'?v=16';IMG[n.replace(/\.[a-z]+$/,'')]=i;});
const imgOK=i=>!!(i&&i.complete&&i.naturalWidth>0);
const PORT=['p_sonic','p_tails','p_knuckles',null,'p_amy','p_silver'];
let SUPERDRAW=false;
function portrait(ch,cx,cy,r,sup){const nm=sup?'p_super':PORT[ch],im=nm&&IMG[nm];
  if(imgOK(im)){g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();g.drawImage(im,cx-r,cy-r,r*2,r*2);g.restore();
    g.strokeStyle=sup?'#fff27a':'#ffd23c';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();}
  else{g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle='rgba(255,255,255,.12)';g.fill();g.clip();drawChar(ch,cx,cy+r*.9,1,0,'idle',r/44);g.restore();g.strokeStyle='#ffd23c';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();}}
/* ---------- characters ---------- */
const NAMES=['سونيك','تيلز','ناكلز','شادو','إيمي','سيلفر'];
const CH=[
 {k:'sonic',max:8.5,acc:.42,jump:13.6},{k:'tails',max:7,acc:.36,jump:12.6},
 {k:'knuckles',max:7,acc:.36,jump:12.8},{k:'shadow',max:8,acc:.4,jump:13},{k:'amy',max:7.4,acc:.38,jump:13.2},{k:'silver',max:7.6,acc:.4,jump:13.4}];
const DEF={
 sonic:{b1:'#3a8bff',b2:'#0a38b8',skin:'#f8d6ac',shoe:'#e8262d'},
 tails:{b1:'#ffbe55',b2:'#e8700a',skin:'#fff3da',shoe:'#e8262d'},
 knuckles:{b1:'#ff5547',b2:'#a50f1a',skin:'#f3c08e',shoe:'#c8d82a'},
 shadow:{b1:'#4a4a5c',b2:'#08080e',skin:'#e8b88a',shoe:'#e8262d'}};
function tri(a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill();}
function ell(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function LG(y0,y1,a,b){const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q;}
function RG(x,y,r,a,b){const q=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);q.addColorStop(0,a);q.addColorStop(1,b);return q;}
function E(x,y,rx,ry,f,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fillStyle=f;g.fill();g.strokeStyle='rgba(0,0,20,.55)';g.lineWidth=1.3;g.stroke();}
function PG(pts,f){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='rgba(0,0,20,.55)';g.lineWidth=1.2;g.stroke();}
const PAL={
 sonic:{f1:'#3d7bff',f2:'#1236a8',skin:'#f6d3a8',shoe:'#e5262c',shoe2:'#8f1118',eye:'#2fbf6b',line:'#08164f'},
 tails:{f1:'#ffb347',f2:'#e3700c',skin:'#fff2d8',shoe:'#e5262c',shoe2:'#8f1118',eye:'#3fa0ff',line:'#6a3004'},
 knuckles:{f1:'#f04a3e',f2:'#a30f1a',skin:'#f1b88a',shoe:'#b9d12a',shoe2:'#6f7f10',eye:'#7b45b5',line:'#3f060c'},
 shadow:{f1:'#555566',f2:'#0b0b11',skin:'#e8b88a',shoe:'#e5262c',shoe2:'#8f1118',eye:'#e11d27',line:'#000'},
 amy:{f1:'#ff8cc6',f2:'#d4488f',skin:'#fbdcc0',shoe:'#e8334a',shoe2:'#8f1330',eye:'#2fbf6b',line:'#6b1038'},
 silver:{f1:'#e9eef3',f2:'#9eacbb',skin:'#f6efe6',shoe:'#f3f6fa',shoe2:'#7a93b8',eye:'#e6b422',line:'#3a4656'}};
const SUPERPAL={f1:'#fff07a',f2:'#f2a300',skin:'#fff8d2',shoe:'#ffb000',shoe2:'#b87400',eye:'#e11d27',line:'#7a4a00'};

}

function say(key,force){
  const arr=CHEER[key];if(!arr)return;const now=performance.now();

/* ---------- state ---------- */
let state='title',lvl=0,L=null,P=null,B=null,cam=0,frame=0,story=null,banner=0,shake=0;

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function newPlayer(x,y){return{x,y,vx:0,vy:0,w:26,h:38,face:1,onGround:false,rolling:false,ch:run.ch,rings:0,dashT:0,attackT:0,cd:0,invT:0,flyT:130,jumpsLeft:1,
  glide:false,fly:false,jumping:false,dead:false,deadT:0,spawn:{x,y},superT:0,trail:[],weapon:null,wT:0,swing:0};}

const dIdx=()=>SAVE.diff===undefined?1:SAVE.diff,DM=()=>[.8,1,1.25][dIdx()],LIVES=()=>[7,5,3][dIdx()],BHP=()=>Math.round((lvl===7?18:lvl===3?10:12)*[.75,1,1.3][dIdx()]);

/* ---------- helpers ---------- */
function part(x,y,c,n,sp){for(let i=0;i<n;i++)L.parts.push({x,y,vx:(Math.random()-.5)*(sp||8),vy:-Math.random()*(sp||8)*.8,life:30+Math.random()*20,c,r:2+Math.random()*3});}
function canAtk(p){return p.rolling||p.dashT>0||p.attackT>0||(!p.onGround&&!p.glide&&!p.fly);}
function hurt(){
  const p=P;if(p.invT>0||p.dead||p.superT>0)return;
  if(p.rings>0){const c=Math.min(p.rings,10);for(let i=0;i<c;i++)L.drops.push({x:p.x+13,y:p.y+10,vx:(Math.random()-.5)*8,vy:-Math.random()*8-2,life:260,t:0});
    p.rings=0;if(Math.random()<.5)say('hurt');p.invT=120;p.vy=-8;p.vx=-p.face*4;p.rolling=false;p.dashT=0;sfx('hit');shake=10;}
  else die();
}
function die(){const p=P;if(p.dead)return;L.deaths=(L.deaths||0)+1;say('die',true);p.dead=true;p.deadT=90;p.vy=-11;p.vx=0;sfx('hit');}
function respawn(){

  if(run.lives<0){state='over';return;}
  const s=P.spawn;P=newPlayer(s.x,s.y);P.spawn=s;P.invT=90;cam=Math.max(0,Math.min(s.x-W*.4,L.len-W));
}
function switchTo(i){if(!run.unlocked[i]||P.ch===i||P.dead)return;P.ch=i;run.ch=i;P.glide=P.fly=false;P.flyT=130;P.rolling=false;P.dashT=0;part(P.x+13,P.y+19,'#fff',12,6);sfx('free');}
function kill(e){run.kills=(run.kills||0)+1;if(run.kills%6===0)say('kill');e.alive=false;run.combo=(run.comboT>0?run.combo:0)+1;run.comboT=130;const pts=100+(run.combo-1)*50;run.score+=pts;L.kills=(L.kills||0)+1;
  L.pops.push({x:e.x+e.w/2,y:e.y,t:'+'+pts+(run.combo>1?'  كومبو ×'+run.combo:''),life:75});part(e.x+e.w/2,e.y+e.h/2,'#ffd23c',14,9);sfx('kill');}

/* ---------- physics ---------- */
function collideX(p){
  const ps=L.plats;
  for(let i=ps.length-1;i>=0;i--){const s=ps[i];if(s.t==='p'||!ov(p,s))continue;
    if(s.t==='w'){const br=p.dashT>0||p.attackT>0||(p.rolling&&Math.abs(p.vx)>4)||(!p.onGround&&Math.abs(p.vx)>7.5);
      if(br){ps.splice(i,1);part(s.x+17,s.y+70,'#a8895f',24,10);sfx('boom');shake=8;run.score+=50;continue;}}
    const over=p.y+p.h-s.y;
    if(over>0&&over<=24&&s.t!=='w'){p.y=s.y-p.h;continue;}
    if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;else p.x=p.x+p.w/2<s.x+s.w/2?s.x-p.w:s.x+s.w;
    if(Math.abs(p.vx)>5)sfx('bonk');
    p.vx=0;p.dashT=0;
  }
}
function collideY(p,pb){
  p.onGround=false;
  for(const s of L.plats){if(!ov(p,s))continue;
    if(s.t==='p'){if(p.vy>=0&&pb<=s.y+4&&!held.down){p.y=s.y-p.h;p.vy=0;p.onGround=true;}continue;}
    if(p.vy>=0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}else{p.y=s.y+s.h;p.vy=0;}
  }
}

/* ---------- update ---------- */
function update(){
  frame++;if(run.comboT>0)run.comboT--;L.time=(L.time||0)+1;const p=P,c=CH[p.ch];const sp=p.superT>0;if(sp)p.superT--;const cm=c.max*(sp?1.55:1),ca=c.acc*(sp?1.4:1);
  if(banner>0)banner--;
  if(shake>0)shake--;
  if(++idle>2400){idle=0;say('idle');}
  // particles & drops always
  for(let i=L.parts.length-1;i>=0;i--){const q=L.parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.4;if(--q.life<=0)L.parts.splice(i,1);}
  for(let i=L.pops.length-1;i>=0;i--){const q=L.pops[i];q.y-=.6;if(--q.life<=0)L.pops.splice(i,1);}
  if(p.dead){
    p.y+=p.vy;p.vy+=GR;if(--p.deadT<=0)respawn();
    return;
  }
  // character switch
  for(let i=0;i<6;i++)if(once['c'+(i+1)])switchTo(i);
  if(once.sw){let i=p.ch;for(let k=0;k<6;k++){i=(i+1)%6;if(run.unlocked[i]){switchTo(i);break;}}}
  const ax=(held.right?1:0)-(held.left?1:0);
  if(p.invT>0)p.invT--;if(p.cd>0)p.cd--;if(p.attackT>0)p.attackT--;if(p.swing>0)p.swing--;
  if(p.weapon&&--p.wT<=0){p.weapon=null;toast={t:'انتهى وقت السلاح! دوّر على غيره',n:150};sfx('hit');}
  // horizontal
  if(p.dashT>0){p.dashT--;p.vx=p.face*(sp?17:13);p.vy=0;}
  else if(p.rolling){
    if(p.onGround){p.vx-=Math.sign(p.vx)*.05;if(Math.abs(p.vx)<1.5||once.jump)p.rolling=false;}
    if(ax&&Math.sign(p.vx)!==ax)p.vx+=ax*.15;
  }else{
    if(ax){let a=p.onGround?ca:ca*.75;if(p.onGround&&Math.sign(p.vx)!==ax&&p.vx!==0)a*=3;
      let nv=p.vx+ax*a;if(Math.abs(nv)>cm&&Math.abs(nv)>Math.abs(p.vx))nv=p.vx;p.vx=nv;p.face=ax;}
    else p.vx*=p.onGround?.82:.985;
    if(Math.abs(p.vx)>cm)p.vx*=.95;
    if(Math.abs(p.vx)<.1)p.vx=0;
    if(held.down&&p.onGround&&Math.abs(p.vx)>2.5){p.rolling=true;sfx('dash');}
  }
  // jump
  if(once.jump){
    if(p.onGround){p.vy=-(c.jump+(sp?1.5:0));p.onGround=false;p.jumping=true;p.jumpsLeft=1;if(!p.rolling)p.rolling=false;sfx('jump');}
    else if(c.k==='shadow'&&p.jumpsLeft>0){p.vy=-12;p.jumpsLeft--;sfx('jump');part(p.x+13,p.y+38,'#e11',8,5);}
  }
  p.glide=p.fly=false;
  if(!p.onGround){
    if(!held.jump&&p.vy<-5&&p.jumping&&c.k!=='shadow')p.vy=-5;
    if(held.jump){
      if(c.k==='tails'&&p.vy>-3&&p.flyT>0){p.vy-=.95;if(p.vy<-3)p.vy=-3;p.flyT--;p.fly=true;}
      else if(c.k==='silver'&&p.vy>-2&&p.flyT>0){p.vy-=.7;if(p.vy<-1.2)p.vy=-1.2;p.flyT--;p.fly=true;}
      else if(c.k==='knuckles'&&p.vy>1.5){p.glide=true;}
    }
  }
  // attack
  if((once.att||(p.weapon==='gun'&&held.att))&&p.cd<=0){
    if(p.weapon==='gun'){L.shots.push({x:p.x+13+p.face*24,y:p.y+16,vx:p.face*15,life:60,gun:true});p.cd=11;sfx('dash');}
    else if(p.weapon==='hammer'||c.k==='amy'){p.attackT=20;p.swing=20;p.cd=26;sfx('boom');shake=4;}
    else if(c.k==='sonic'){p.dashT=14;p.cd=40;sfx('dash');part(p.x+13,p.y+20,'#7fc4ff',10,6);}
    else if(c.k==='tails'){p.attackT=16;p.cd=24;sfx('dash');}
    else if(c.k==='silver'){L.shots.push({x:p.x+13+p.face*20,y:p.y+14,vx:p.face*8.5,vy:0,life:110,psi:true});p.cd=20;sfx('dash');}
    else if(c.k==='knuckles'){p.attackT=14;p.cd=20;p.vx+=p.face*3;sfx('dash');}
    else{L.shots.push({x:p.x+13+p.face*18,y:p.y+14,vx:p.face*13,life:70});p.cd=18;sfx('dash');}
  }
  // gravity
  if(p.glide)p.vy=Math.min(p.vy,1.5)>p.vy?p.vy:1.5;
  else p.vy=Math.min(p.vy+GR,16);
  if(p.glide){p.vx=p.face*6.5+ (ax? ax*.8:0);}
  // move
  p.x+=p.vx;collideX(p);
  const pb=p.y+p.h;p.y+=p.vy;collideY(p,pb);
  if(p.onGround){const was=p.jumping;p.jumping=false;p.flyT=130;p.jumpsLeft=1;p.glide=false;}
  if(p.x<0)p.x=0;
  if(L.bossOn&&!L.bossDone){const a=L.arena.x0;if(p.x<a)p.x=a;if(p.x>a+W-p.w)p.x=a+W-p.w;}
  if(p.y>H+80){die();return;}
  // sprint into level end bounds
  if(p.x>L.len-p.w)p.x=L.len-p.w;

  const body={x:p.x,y:p.y,w:p.w,h:p.h};

  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=gp.axes[0]||0,ay=gp.axes[1]||0;

    b.textContent=((i<rd||(SAVE.done&&i===LV.length-1))?'✓ ':(i>=5?'⭐ ':''))+(i+1)+'. '+LV[i].name.split(': ')[1]+(((SAVE.stars||{})[i])?' '+'★'.repeat(SAVE.stars[i]):'');
    if(i===selLv)b.className='sel';b.onclick=()=>{selLv=i;buildLevels();};box.appendChild(b);}
  $('lvl').style.display='block';box.style.display='flex';
  $('go').textContent=(rd>0||selLv>0)?'▶ ابدأ من الفصل '+(selLv+1):'ابدأ اللعب';}
$('vt').onclick=()=>{stopVoice();VA.muted=false;VA.src=vurl('ring2');VA.volume=1;const pr=VA.play();
  const st=$('vst');st.textContent='جارٍ تشغيل عبارة تجريبية…';
  if(pr&&pr.then)pr.then(()=>{st.textContent='إن سمعت صوتك يقول «كمل كمل!» أو ما يشبهها فالصوت يعمل. إن لم تسمع شيئًا: ارفع صوت الجهاز وألغِ وضع الصامت.';}).catch(()=>{st.textContent='تعذّر تشغيل الصوت. اضغط الزر مرة أخرى أو تأكد من إعدادات الصوت في المتصفح.';});};
function showMenu(){state='title';stopVoice();
  $('nm').value=SAVE.name||'';selLv=Math.min(LV.length-1,SAVE.reached||0);$('vc').checked=voiceOn;$('mc').checked=musicOn;
  $('ctl').textContent=isTouch?'الأزرار على الشاشة: ◀ ▶ حركة · قفز · هجوم · تبديل · ☰ قائمة':'الأسهم/WASD حركة · المسافة قفز · X هجوم · ↓ دوران · 1-4 أو Q تبديل · Esc قائمة';
  $('vst').textContent='';buildChars();buildDiff();buildLevels();$('menu').style.display='flex';document.body.classList.add('inmenu');}
$('go').onclick=()=>{audioInit();const nm=$('nm').value.trim();if(!nm){$('nm').focus();$('nm').style.background='#ffd6d6';$('nm').placeholder='من فضلك اكتب اسمك';return;}
  SAVE.name=nm;voiceOn=$('vc').checked;SAVE.voice=voiceOn;musicOn=$('mc').checked;SAVE.music=musicOn;writeSave();$('menu').style.display='none';document.body.classList.remove('inmenu');
  run.score=(SAVE.scores&&SAVE.scores[selLv])||0;run.lives=LIVES();run.unlocked=unlockedFor(selLv);run.unlocked[selCh]=1;run.ch=selCh;SAVE.ch=selCh;try{localStorage.setItem('hubPlayerName',nm);}catch(e){}run.kills=0;
  unlockVoice();beginLevel(selLv);};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('nm').addEventListener('input',()=>{$('nm').style.background='#fff';});
/* ---------- puzzles (doors) ---------- */
const RIDDLES=[
 {q:'شيء كلما أخذت منه زاد، ما هو؟',a:'الحفرة',w:['الفلوس','الشجرة','الكتاب']},
 {q:'له عين ولا يرى، ما هو؟',a:'الإبرة',w:['الباب','الشباك','القلم']},
 {q:'يمشي بلا أرجل ويبكي بلا عيون، ما هو؟',a:'السحاب',w:['النهر','الريح','الليل']},
 {q:'شيء يكتب ولا يقرأ، ما هو؟',a:'القلم',w:['الكتاب','الورقة','الحبر']},
 {q:'شيء كلما زاد نقص، ما هو؟',a:'العمر',w:['المال','الطول','الوزن']},
 {q:'له أسنان ولا يعضّ، ما هو؟',a:'المشط',w:['الكلب','القطة','الحصان']}];
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function makePuzzle(seed){
  const r=mulberry(seed),kind=['math','seq','riddle','simon'][Math.floor(r()*4)];
  if(kind==='math'){const a=2+Math.floor(r()*8),b=3+Math.floor(r()*7),c=Math.floor(r()*20),ans=a*b+c;
    const o=new Set([ans]);while(o.size<4)o.add(ans+[-10,-3,-1,2,5,10,12][Math.floor(r()*7)]);
    return{kind,q:'<span dir="ltr">'+a+' × '+b+' + '+c+' = ?</span>',opts:shuf([...o].map(String),r),ans:String(ans)};}
  if(kind==='seq'){const geo=r()<.5;let sq,ans;
    if(geo){const st=1+Math.floor(r()*3);sq=[st,st*2,st*4,st*8];ans=st*16;}else{const st=2+Math.floor(r()*8),d=2+Math.floor(r()*6);sq=[st,st+d,st+2*d,st+3*d];ans=st+4*d;}
    const o=new Set([ans]);while(o.size<4)o.add(ans+[-4,-2,-1,1,2,4,6][Math.floor(r()*7)]);
    return{kind,q:'ما الرقم التالي؟<br><span dir="ltr">'+sq.join(' , ')+' , ?</span>',opts:shuf([...o].map(String),r),ans:String(ans)};}
  if(kind==='riddle'){const rd=RIDDLES[Math.floor(r()*RIDDLES.length)];return{kind,q:rd.q,opts:shuf([rd.a,...rd.w],r),ans:rd.a};}
  return{kind:'simon',len:4+(lvl>=6?1:0)};}
let pzT=[],pzTerm=null;
function pzClear(){pzT.forEach(clearTimeout);pzT=[];}
function openPuzzle(tm){
  if(state!=='play')return;state='puzzle';pzTerm=tm;for(const k in held)held[k]=false;
  document.body.classList.add('inmenu');$('pz').style.display='flex';tm.tries++;
  const pz=makePuzzle(tm.seed+(tm.tries>1?tm.tries*97:0)),q=$('pzq'),o=$('pzo'),st=$('pzs');o.innerHTML='';st.textContent='';
  if(pz.kind!=='simon'){q.innerHTML=pz.q;
    pz.opts.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(t===pz.ans)solvePuzzle();else{b.className='bad';st.textContent='إجابة غير صحيحة، جرّب غيرها';sfx('hit');}};o.appendChild(b);});}
  else{q.innerHTML='احفظ ترتيب الألوان ثم كرّره';const cols=['#e5262c','#2fbf6b','#3d7bff','#ffd23c'],btn=[];
    cols.forEach((c,i)=>{const b=document.createElement('button');b.className='sm';b.style.background=c;b.style.opacity='.55';b.style.borderColor='#fff';btn.push(b);o.appendChild(b);});
    const r=mulberry(tm.seed+tm.tries*13),seq=Array.from({length:pz.len},()=>Math.floor(r()*4));let inp=0,locked=true;
    const flash=(i,ms)=>{btn[i].style.opacity='1';btn[i].style.transform='scale(1.06)';pzT.push(setTimeout(()=>{btn[i].style.opacity='.55';btn[i].style.transform='';},ms));};
    const show=()=>{locked=true;inp=0;st.textContent='شاهد…';seq.forEach((v,k)=>{pzT.push(setTimeout(()=>{flash(v,420);sfx('ring');},700+k*750));});pzT.push(setTimeout(()=>{locked=false;st.textContent='دورك! كرّر الترتيب';},700+seq.length*750));};
    btn.forEach((b,i)=>{b.onclick=()=>{if(locked)return;flash(i,200);if(i===seq[inp]){sfx('ring');if(++inp>=seq.length)solvePuzzle();}else{sfx('hit');st.textContent='غلط! شاهد الترتيب مرة أخرى';show();}};});
    show();}}
function closePuzzle(){pzClear();$('pz').style.display='none';document.body.classList.remove('inmenu');state='play';}
function solvePuzzle(){const tm=pzTerm;tm.done=true;const i=L.plats.indexOf(tm.door);if(i>=0)L.plats.splice(i,1);
  part(tm.door.x+18,300,'#35d6ff',40,12);sfx('free');say('cp',true);run.score+=200;shake=8;closePuzzle();toast={t:'انفتح الباب! عبقري',n:150};}
$('pzx').onclick=()=>{const tm=pzTerm;closePuzzle();if(tm){tm.cool=150;P.x=Math.min(P.x,tm.x-70);P.vx=0;}};
function levelDone(after){
  const secs=Math.round((L.time||0)/60),par=(lvl===3||lvl===4||lvl===7)?100:Math.round(L.len/2.2/60+10),tr=L.rings.length||1,rp=(L.gotRings||0)/tr;
  const c1=rp>=.6,c2=(L.deaths||0)===0,c3=secs<=par,stars=Math.max(1,(c1?1:0)+(c2?1:0)+(c3?1:0));
  SAVE.stars=SAVE.stars||{};SAVE.stars[lvl]=Math.max(SAVE.stars[lvl]||0,stars);writeSave();
  state='results';for(const k in held)held[k]=false;document.body.classList.add('inmenu');
  $('rsst').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  const mm=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  $('rsb').innerHTML=(c3?'✅':'⬜')+' الوقت: '+mm+' <small>(المطلوب أقل من '+Math.floor(par/60)+':'+String(par%60).padStart(2,'0')+')</small><br>'+(c1?'✅':'⬜')+' الحلقات: '+(L.gotRings||0)+' <small>(60% من '+tr+')</small><br>'+(c2?'✅':'⬜')+' بدون سقوط: '+(L.deaths||0)+' مرة<br>⚔ الروبوتات المهزومة: '+(L.kills||0)+'<br>النقاط: <b>'+run.score+'</b>';
  sfx('free');$('rs').style.display='flex';
  $('rsn').onclick=()=>{$('rs').style.display='none';document.body.classList.remove('inmenu');startStory(LV[lvl].outro,after);};}
function pauseGame(){if(state!=='play')return;state='pause';for(const k in held)held[k]=false;$('pm').style.display='flex';document.body.classList.add('inmenu');stopVoice();}
function resumeGame(){$('pm').style.display='none';document.body.classList.remove('inmenu');state='play';}
$('pr').onclick=resumeGame;
$('prs').onclick=()=>{$('pm').style.display='none';document.body.classList.remove('inmenu');run.lives=LIVES();run.score=(SAVE.scores&&SAVE.scores[lvl])||0;run.unlocked=unlockedFor(lvl);beginLevel(lvl);};
const toggleFS=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}};
if(!document.documentElement.requestFullscreen){$('fs').style.display='none';$('pfs').style.display='none';}
$('fs').onclick=toggleFS;$('pfs').onclick=toggleFS;
$('ph').onclick=()=>{location.href='../';};
$('px').onclick=()=>{$('pm').style.display='none';showMenu();};
SHADOW_ICON=makeShadowIcon();
showMenu();
requestAnimationFrame(loop);
</script>
