<script>
'use strict';
const W=960,H=540,GR=.6,FONT='Tahoma, Arial, sans-serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');

/* ---------- responsive: laptop / phone / iPad ---------- */
const isTouch=(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches)||'ontouchstart' in window&&matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*s*dpr);
  const nw=Math.max(W,Math.min(pw,1920));
  if(cv.width!==nw){cv.width=nw;cv.height=Math.round(nw*H/W);}
  document.getElementById('rot').style.display=(isTouch&&vh>vw)?'flex':'none';
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- input ---------- */
const held={},once={};
function press(a){if(!held[a])once[a]=true;held[a]=true;audioInit();}
function release(a){held[a]=false;}
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowDown:'down',s:'down',S:'down',
 ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',z:'jump',Z:'jump',x:'att',X:'att',j:'att',J:'att',k:'att',K:'att',
 q:'sw',Q:'sw',Tab:'sw',Enter:'confirm','1':'c1','2':'c2','3':'c3','4':'c4'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();return;}const a=KM[e.key];if(a){e.preventDefault();if(!e.repeat)press(a);if(a==='jump'||a==='att')held[a]=true;}});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const a=KM[e.key];if(a)release(a);});
function bindBtn(id,act){const el=document.getElementById(id),ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);ids.add(e.pointerId);el.classList.add('on');press(act);});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){el.classList.remove('on');release(act);}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
[['bl','left'],['br','right'],['bd','down'],['bj','jump'],['ba','att'],['bs','sw']].forEach(a=>bindBtn(a[0],a[1]));
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)*W/r.width,gy=(e.clientY-r.top)*H/r.height;
  if(state==='play'&&Math.hypot(gx-(W/2+110),gy-24)<30){pauseGame();return;}once.confirm=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});

/* ---------- audio ---------- */
let AC;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
const SFX={ring:[1200,1800,.12,'square'],jump:[300,700,.15,'square'],hit:[400,80,.3,'sawtooth'],kill:[500,200,.15,'triangle'],
 spring:[300,900,.25,'square'],free:[500,1500,.45,'triangle'],boom:[200,40,.5,'sawtooth'],dash:[200,900,.2,'sawtooth'],bonk:[250,120,.1,'square']};
function sfx(n){if(!AC)return;const S=SFX[n],t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();
  o.type=S[3];o.connect(v);v.connect(AC.destination);o.frequency.setValueAtTime(S[0],t);o.frequency.exponentialRampToValueAtTime(S[1],t+S[2]);
  v.gain.setValueAtTime(.07,t);v.gain.exponentialRampToValueAtTime(.001,t+S[2]);o.start(t);o.stop(t+S[2]);}

/* ---------- image assets (portraits + sprites) ---------- */
const IMG={};['p_sonic.jpg','p_tails.jpg','p_knuckles.jpg','p_super.jpg','p_silver.jpg','p_amy.jpg'].forEach(n=>{const i=new Image();i.src='assets/'+n+'?v=8';IMG[n.replace(/\.[a-z]+$/,'')]=i;});
const imgOK=i=>!!(i&&i.complete&&i.naturalWidth>0);
const PORT=['p_sonic','p_tails','p_knuckles',null];
let SUPERDRAW=false;
function portrait(ch,cx,cy,r,sup){const nm=sup?'p_super':PORT[ch],im=nm&&IMG[nm];
  if(imgOK(im)){g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();g.drawImage(im,cx-r,cy-r,r*2,r*2);g.restore();
    g.strokeStyle=sup?'#fff27a':'#ffd23c';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();}
  else{g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle='rgba(255,255,255,.12)';g.fill();g.clip();drawChar(ch,cx,cy+r*.9,1,0,'idle',r/44);g.restore();g.strokeStyle='#ffd23c';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();}}
/* ---------- characters ---------- */
const NAMES=['سونيك','تيلز','ناكلز','شادو'];
const CH=[
 {k:'sonic',max:8.5,acc:.42,jump:13.6},{k:'tails',max:7,acc:.36,jump:12.6},
 {k:'knuckles',max:7,acc:.36,jump:12.8},{k:'shadow',max:8,acc:.4,jump:13}];
const DEF={
 sonic:{b1:'#3a8bff',b2:'#0a38b8',skin:'#f8d6ac',shoe:'#e8262d'},
 tails:{b1:'#ffbe55',b2:'#e8700a',skin:'#fff3da',shoe:'#e8262d'},
 knuckles:{b1:'#ff5547',b2:'#a50f1a',skin:'#f3c08e',shoe:'#c8d82a'},
 shadow:{b1:'#4a4a5c',b2:'#08080e',skin:'#e8b88a',shoe:'#e8262d'}};
function tri(a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill();}
function ell(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function LG(y0,y1,a,b){const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q;}
function RG(x,y,r,a,b){const q=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);q.addColorStop(0,a);q.addColorStop(1,b);return q;}
function E(x,y,rx,ry,f,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fillStyle=f;g.fill();g.strokeStyle='rgba(0,0,20,.55)';g.lineWidth=1.3;g.stroke();}
function PG(pts,f){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='rgba(0,0,20,.55)';g.lineWidth=1.2;g.stroke();}
const PAL={
 sonic:{f1:'#3d7bff',f2:'#1236a8',skin:'#f6d3a8',shoe:'#e5262c',shoe2:'#8f1118',eye:'#2fbf6b',line:'#08164f'},
 tails:{f1:'#ffb347',f2:'#e3700c',skin:'#fff2d8',shoe:'#e5262c',shoe2:'#8f1118',eye:'#3fa0ff',line:'#6a3004'},
 knuckles:{f1:'#f04a3e',f2:'#a30f1a',skin:'#f1b88a',shoe:'#b9d12a',shoe2:'#6f7f10',eye:'#7b45b5',line:'#3f060c'},
 shadow:{f1:'#555566',f2:'#0b0b11',skin:'#e8b88a',shoe:'#e5262c',shoe2:'#8f1118',eye:'#e11d27',line:'#000'}};
const SUPERPAL={f1:'#fff07a',f2:'#f2a300',skin:'#fff8d2',shoe:'#ffb000',shoe2:'#b87400',eye:'#e11d27',line:'#7a4a00'};
function limb(x0,y0,a0,l0,a1,l1,w,col,line){
  const x1=x0+Math.sin(a0)*l0,y1=y0+Math.cos(a0)*l0,x2=x1+Math.sin(a1)*l1,y2=y1+Math.cos(a1)*l1;
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);
  g.strokeStyle=line;g.lineWidth=w+2.2;g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke();return[x2,y2];}
function drawChar(ch,x,y,face,t,pose,s){
  const k=CH[ch].k,sup=SUPERDRAW,c=sup?SUPERPAL:PAL[k];
  g.save();g.translate(x,y);g.scale(face*(s||1),s||1);g.lineJoin='round';g.lineCap='round';
  if(pose==='ball'){
    g.translate(0,-15);g.rotate(t*.6);
    PG([[-4,-14],[-27,-11],[-8,-2]],c.f2);PG([[-4,4],[-27,11],[-8,-4]],c.f2);
    E(0,0,15.5,15.5,RG(0,0,18,c.f1,c.f2));
    g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;g.beginPath();g.arc(0,0,9,0,3.4);g.stroke();
    if(k==='shadow'&&!sup){g.strokeStyle='#e8262d';g.beginPath();g.arc(0,0,12.5,.5,1.8);g.stroke();}
    g.restore();return;}
  const run=pose==='run',fly=pose==='fly',gl=pose==='glide',ph=t*.6,s1=Math.sin(ph),c1=Math.cos(ph);
  const bob=gl?0:run?-Math.abs(s1)*3:Math.sin(t*.12)*.7,HY=-19,wide=k==='knuckles'?1.15:1;
  const lean=gl?1.25:run?.22:0;
  g.translate(0,bob);if(k==='tails')g.scale(.92,.92);
  // ---- Tails' two tails
  if(k==='tails'){for(let i=0;i<2;i++){g.save();g.translate(-6,-17);g.rotate(fly?t*.9+i*Math.PI:.3+i*.55+Math.sin(t*.25+i)*.15+(run?s1*.12:0));
    PG([[0,-5],[-16,-11],[-33,-4],[-35,3],[-16,10],[0,5]],LG(-10,10,'#ffc45e','#e3700c'));E(-34,0,7,6.5,'#fff');g.restore();}}
  // ---- legs
  const aA=run?s1*.95:fly?.2:gl?.5:0,aB=run?-s1*.95:fly?-.15:gl?.15:0;
  const bA=run?Math.max(0,-c1)*1.5:fly?.5:0,bB=run?Math.max(0,c1)*1.5:fly?.7:0;
  const shoe=(fx,fy,ang)=>{g.save();g.translate(fx,fy);g.rotate(-ang*.45);
    if(k==='shadow'&&!sup){E(4,1,10,5,LG(-4,6,'#fafafa','#9a9aa8'));g.fillStyle='#e5262c';g.fillRect(0,-3.5,8,2.4);ell(3,7,6,2.6,'rgba(255,160,40,.85)');}
    else{E(4,1,10.5,5.6,LG(-5,6,c.shoe,c.shoe2));g.fillStyle='#f6f6f6';g.fillRect(1.5,-4.4,4.2,9);
      if(k==='sonic'&&!sup){g.fillStyle='#ffd23c';g.fillRect(2.4,-1,2.4,3);}
      E(4,5.6,10.5,1.9,'#f0f0f0');}
    g.restore();};
  const legB=()=>{const p=limb(-1,HY,aB,9.5,aB-bB,9.5,6.4,c.f2,c.line);shoe(p[0],p[1],aB-bB);};
  const legA=()=>{const p=limb(-1,HY,aA,9.5,aA-bA,9.5,6.6,k==='shadow'&&!sup?'#2a2a38':c.f1,c.line);shoe(p[0],p[1],aA-bA);};
  legB();
  // ---- upper body (leans forward when running)
  g.save();g.translate(0,HY);g.rotate(lean);g.translate(0,-HY);
  const sw=run?s1:0,aF=run?-sw*1.0:fly?.5:gl?1.4:.25,aBk=run?sw*1.0:fly?-.2:gl?1.6:-.12;
  // back arm
  {const p=limb(-1,-36,aBk,8,aBk+.7,8,5,c.f2,c.line);E(p[0],p[1],4.6*wide,4.6*wide,'#e8e8ee');}
  // quills
  const qc=LG(-80,-34,c.f1,c.f2),qs=sup?'up':{sonic:'back',tails:'none',knuckles:'knux',shadow:'up'}[k];
  if(qs==='back'){PG([[-7,-55],[-33,-58],[-8,-45]],qc);PG([[-8,-48],[-38,-46],[-9,-38]],qc);PG([[-7,-42],[-33,-34],[-7,-33]],qc);PG([[-3,-37],[-19,-26],[-4,-29]],qc);}
  else if(qs==='up'){PG([[-6,-56],[-28,-73],[-8,-45]],qc);PG([[-8,-50],[-39,-58],[-9,-40]],qc);PG([[-7,-43],[-35,-38],[-7,-33]],qc);PG([[1,-60],[5,-80],[12,-59]],qc);
    if(k==='shadow'&&!sup){g.fillStyle='#e5262c';tri(-24,-69,-28,-73,-19,-65);tri(-33,-56,-39,-58,-28,-54);}}
  else if(qs==='knux'){PG([[-6,-55],[-21,-59],[-8,-46]],qc);PG([[-7,-48],[-23,-44],[-8,-38]],qc);PG([[-5,-42],[-18,-34],[-5,-34]],qc);}
  // torso
  g.save();g.translate(1,-30);g.rotate(.1);E(0,0,8.8*wide,11.5,LG(-12,12,c.f1,c.f2));g.restore();
  if(k==='knuckles'&&!sup){ell(5,-29,5.5,8.4,'#e8493d');g.fillStyle='#fff';PG([[1,-39],[11,-39],[6,-30]],'#fff');}
  else if(k==='shadow'&&!sup){PG([[3,-39],[11,-33],[6,-23],[2,-31]],'#f2f2f2');}
  else ell(5,-29,5.4,8.4,c.skin);
  // tails / shadow ears
  if(k==='tails'&&!sup){PG([[-4,-58],[-9,-77],[6,-60]],c.f1);PG([[-3,-60],[-7,-72],[2,-61]],'#ffc7cf');PG([[7,-60],[15,-77],[17,-56]],c.f1);PG([[9,-60],[14,-71],[15,-58]],'#ffc7cf');PG([[-1,-61],[3,-72],[9,-61]],c.f1);}
  // head
  E(3,-47,14.6,14,RG(3,-47,17,c.f1,c.f2));
  if(k==='sonic'&&!sup)PG([[-3,-59],[0,-70],[7,-60]],c.f1);
  E(14.5,-42,9.2,6.6,LG(-49,-35,c.skin,'#e2b684'));

}

function kill(e){run.kills=(run.kills||0)+1;if(run.kills%6===0)say('kill');e.alive=false;run.score+=100;part(e.x+e.w/2,e.y+e.h/2,'#ffd23c',14,9);sfx('kill');}

/* ---------- physics ---------- */
function collideX(p){
  const ps=L.plats;
  for(let i=ps.length-1;i>=0;i--){const s=ps[i];if(s.t==='p'||!ov(p,s))continue;
    if(s.t==='w'){const br=p.dashT>0||p.attackT>0||(p.rolling&&Math.abs(p.vx)>4)||(!p.onGround&&Math.abs(p.vx)>7.5);
      if(br){ps.splice(i,1);part(s.x+17,s.y+70,'#a8895f',24,10);sfx('boom');shake=8;run.score+=50;continue;}}
    const over=p.y+p.h-s.y;
    if(over>0&&over<=24&&s.t!=='w'){p.y=s.y-p.h;continue;}
    if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;else p.x=p.x+p.w/2<s.x+s.w/2?s.x-p.w:s.x+s.w;
    if(Math.abs(p.vx)>5)sfx('bonk');
    p.vx=0;p.dashT=0;
  }
}
function collideY(p,pb){
  p.onGround=false;
  for(const s of L.plats){if(!ov(p,s))continue;
    if(s.t==='p'){if(p.vy>=0&&pb<=s.y+4&&!held.down){p.y=s.y-p.h;p.vy=0;p.onGround=true;}continue;}
    if(p.vy>=0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}else{p.y=s.y+s.h;p.vy=0;}
  }
}

/* ---------- update ---------- */
function update(){
  frame++;const p=P,c=CH[p.ch];const sp=p.superT>0;if(sp)p.superT--;const cm=c.max*(sp?1.55:1),ca=c.acc*(sp?1.4:1);
  if(banner>0)banner--;
  if(shake>0)shake--;
  if(++idle>2400){idle=0;say('idle');}
  // particles & drops always
  for(let i=L.parts.length-1;i>=0;i--){const q=L.parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.4;if(--q.life<=0)L.parts.splice(i,1);}
  if(p.dead){
    p.y+=p.vy;p.vy+=GR;if(--p.deadT<=0)respawn();
    return;
  }
  // character switch
  for(let i=0;i<4;i++)if(once['c'+(i+1)])switchTo(i);
  if(once.sw){let i=p.ch;for(let k=0;k<4;k++){i=(i+1)%4;if(run.unlocked[i]){switchTo(i);break;}}}
  const ax=(held.right?1:0)-(held.left?1:0);
  if(p.invT>0)p.invT--;if(p.cd>0)p.cd--;if(p.attackT>0)p.attackT--;
  // horizontal
  if(p.dashT>0){p.dashT--;p.vx=p.face*(sp?17:13);p.vy=0;}
  else if(p.rolling){
    if(p.onGround){p.vx-=Math.sign(p.vx)*.05;if(Math.abs(p.vx)<1.5||once.jump)p.rolling=false;}
    if(ax&&Math.sign(p.vx)!==ax)p.vx+=ax*.15;
  }else{
    if(ax){let a=p.onGround?ca:ca*.75;if(p.onGround&&Math.sign(p.vx)!==ax&&p.vx!==0)a*=3;
      let nv=p.vx+ax*a;if(Math.abs(nv)>cm&&Math.abs(nv)>Math.abs(p.vx))nv=p.vx;p.vx=nv;p.face=ax;}
    else p.vx*=p.onGround?.82:.985;
    if(Math.abs(p.vx)>cm)p.vx*=.95;
    if(Math.abs(p.vx)<.1)p.vx=0;

  }
  // jump

    else if(c.k==='shadow'&&p.jumpsLeft>0){p.vy=-12;p.jumpsLeft--;sfx('jump');part(p.x+13,p.y+38,'#e11',8,5);}
  }
  p.glide=p.fly=false;
  if(!p.onGround){
    if(!held.jump&&p.vy<-5&&p.jumping&&c.k!=='shadow')p.vy=-5;
    if(held.jump){
      if(c.k==='tails'&&p.vy>-3&&p.flyT>0){p.vy-=.95;if(p.vy<-3)p.vy=-3;p.flyT--;p.fly=true;}
      else if(c.k==='knuckles'&&p.vy>1.5){p.glide=true;}
    }
  }
  // attack
  if(once.att&&p.cd<=0){
    if(c.k==='sonic'){p.dashT=14;p.cd=40;sfx('dash');part(p.x+13,p.y+20,'#7fc4ff',10,6);}
    else if(c.k==='tails'){p.attackT=16;p.cd=24;sfx('dash');}
    else if(c.k==='knuckles'){p.attackT=14;p.cd=20;p.vx+=p.face*3;sfx('dash');}
    else{L.shots.push({x:p.x+13+p.face*18,y:p.y+14,vx:p.face*13,life:70});p.cd=18;sfx('dash');}
  }
  // gravity
  if(p.glide)p.vy=Math.min(p.vy,1.5)>p.vy?p.vy:1.5;
  else p.vy=Math.min(p.vy+GR,16);
  if(p.glide){p.vx=p.face*6.5+ (ax? ax*.8:0);}
  // move
  p.x+=p.vx;collideX(p);
  const pb=p.y+p.h;p.y+=p.vy;collideY(p,pb);
  if(p.onGround){const was=p.jumping;p.jumping=false;p.flyT=130;p.jumpsLeft=1;p.glide=false;}
  if(p.x<0)p.x=0;
  if(L.bossOn&&!L.bossDone){const a=L.arena.x0;if(p.x<a)p.x=a;if(p.x>a+W-p.w)p.x=a+W-p.w;}
  if(p.y>H+80){die();return;}
  // sprint into level end bounds
  if(p.x>L.len-p.w)p.x=L.len-p.w;

  const body={x:p.x,y:p.y,w:p.w,h:p.h};
  // attack hitbox
  let atk=null;
  if(p.attackT>0){atk=CH[p.ch].k==='tails'?{x:p.x-34,y:p.y-8,w:p.w+68,h:p.h+16}:{x:p.face>0?p.x+p.w:p.x-48,y:p.y-4,w:48,h:p.h};}
  // rings
  for(const r of L.rings){if(r.got)continue;if(Math.abs(r.x-(p.x+13))<24&&Math.abs(r.y-(p.y+19))<30){r.got=true;getRing();}}
  for(let i=L.drops.length-1;i>=0;i--){const d=L.drops[i];d.t++;d.x+=d.vx;d.vy+=.35;d.y+=d.vy;
    for(const s of L.plats){if(s.t!=='p'&&d.x>s.x&&d.x<s.x+s.w&&d.y>s.y&&d.y<s.y+20&&d.vy>0){d.y=s.y;d.vy*=-.6;}}
    if(--d.life<=0){L.drops.splice(i,1);continue;}
    if(d.t>40&&Math.abs(d.x-(p.x+13))<26&&Math.abs(d.y-(p.y+19))<32){L.drops.splice(i,1);getRing();}}
  for(let i=L.orbs.length-1;i>=0;i--){const ob=L.orbs[i];if(Math.abs(ob.x-(p.x+13))<26&&Math.abs(ob.y-(p.y+19))<34){L.orbs.splice(i,1);activateSuper();}}
  if(sp){p.trail.push({x:p.x,y:p.y,face:p.face});if(p.trail.length>6)p.trail.shift();if(frame%2===0)part(p.x+13+(Math.random()-.5)*20,p.y+10+Math.random()*28,'#ffe680',1,3);}else p.trail.length=0;
  // springs
  for(const s of L.springs){if(ov(body,s)&&p.vy>0){p.vy=-18;p.onGround=false;p.jumping=true;s.a=12;sfx('spring');}if(s.a>0)s.a--;}
  // spikes
  for(const s of L.spikes)if(ov(body,s)&&p.invT<=0)hurt();
  // checkpoints
  for(const cp of L.cps)if(!cp.on&&p.x>cp.x){cp.on=true;p.spawn={x:cp.x,y:cp.y-38};sfx('free');say('cp');}
  // enemies
  for(const e of L.en){if(!e.alive)continue;
    if(e.t==='w'){e.x+=e.dir*1.3;if(e.x<e.x0||e.x+e.w>e.x1)e.dir*=-1;}
    else{e.ph+=.05;e.x+=e.dir*1.1;if(e.x<e.x0||e.x>e.x1)e.dir*=-1;e.y=e.by+Math.sin(e.ph)*30;
      if(lvl>=2&&Math.abs(e.x-p.x)<420&&++e.sh>150){e.sh=0;const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;L.bul.push({x:e.x+17,y:e.y+15,vx:dx/l*3.4,vy:dy/l*3.4,life:200,r:7});}}
    if(atk&&ov(atk,e)){kill(e);continue;}
    if(ov(body,e)){
      if(canAtk(p)||(p.vy>1&&p.y+p.h-e.y<24)){kill(e);if(!p.onGround)p.vy=held.jump?-11:-7;}
      else hurt();}
  }
  // bullets
  for(let i=L.bul.length-1;i>=0;i--){const b=L.bul[i];b.x+=b.vx;b.y+=b.vy;if(--b.life<=0){L.bul.splice(i,1);continue;}
    if(Math.abs(b.x-(p.x+13))<b.r+13&&Math.abs(b.y-(p.y+19))<b.r+19){
      if(canAtk(p)||atk){L.bul.splice(i,1);part(b.x,b.y,'#ffd23c',6,5);sfx('kill');run.score+=20;}else{L.bul.splice(i,1);hurt();}}}
  // shadow spears
  for(let i=L.shots.length-1;i>=0;i--){const s=L.shots[i];s.x+=s.vx;let rm=--s.life<=0;
    for(const e of L.en)if(e.alive&&!rm&&Math.abs(s.x-(e.x+e.w/2))<e.w/2+8&&Math.abs(s.y-(e.y+e.h/2))<e.h/2+8){kill(e);rm=true;}
    for(let j=L.plats.length-1;j>=0;j--){const w=L.plats[j];if(w.t==='w'&&s.x>w.x&&s.x<w.x+w.w&&s.y>w.y&&s.y<w.y+w.h){L.plats.splice(j,1);part(w.x+17,w.y+70,'#a8895f',24,10);sfx('boom');rm=true;}}
    if(B&&B.hp>0&&B.inv<=0&&Math.abs(s.x-B.x)<46&&Math.abs(s.y-B.y)<40){hitBoss();rm=true;}
    if(rm)L.shots.splice(i,1);}
  // goal sign
  if(L.goal){const gl=L.goal;if(!gl.hit&&Math.abs(p.x-gl.x)<40&&p.y+p.h>=gl.y-110){gl.hit=true;sfx('free');say('done',true);saveProgress(lvl+1);}
    if(gl.hit){gl.spin+=.4;if(!gl.done&&gl.spin>16){gl.done=true;run.score+=500;startStory(LV[lvl].outro,()=>beginLevel(lvl+1));}}}
  // cage
  if(L.cage&&!L.cage.freed){const cg=L.cage;
    if(ov(body,cg)&&(canAtk(p)||atk)){cg.freed=true;run.unlocked[cg.who]=1;say('free',true);saveProgress(lvl+1);part(cg.x+28,cg.y+30,'#ccc',26,10);sfx('free');run.score+=500;
      setTimeout(()=>{if(state==='play')startStory(LV[lvl].outro,()=>beginLevel(lvl+1));},500);}
    else if(ov(body,cg)){p.x=p.x<cg.x?cg.x-p.w:cg.x+cg.w;p.vx=0;}}
  // boss
  if(L.arena&&!L.bossDone){
    if(!L.bossOn&&p.x>L.arena.x0+90){L.bossOn=true;B={x:L.arena.x0+480,y:150,hp:12,max:12,t:0,st:'hover',inv:0,fire:0,spawned:[0,0],dead:0,cx:L.arena.x0+480};}
    if(B)updateBoss(body,atk);
  }
  // camera
  const tg=(L.bossOn&&!L.bossDone)?L.arena.x0:p.x-W*.4+p.face*40;
  cam+=(tg-cam)*.12;cam=Math.max(0,Math.min(cam,L.len-W));
}
function activateSuper(){P.superT=600;say('super',true);sfx('free');part(P.x+13,P.y+19,'#fff27a',30,10);shake=8;}
function getRing(){P.rings++;if(P.rings%50===0)activateSuper();run.score+=10;sfx('ring');if(P.rings%25===0)say('ring');if(P.rings%100===0){run.lives++;sfx('free');}}
function hitBoss(){B.hp--;say(B.hp===6?'half':'boss',B.hp===6);B.inv=50;sfx('boom');shake=10;part(B.x,B.y,'#ffd23c',20,10);run.score+=300;
  if(B.hp===8&&!B.spawned[0]){B.spawned[0]=1;spawnMinions();}if(B.hp===4&&!B.spawned[1]){B.spawned[1]=1;spawnMinions();}
  if(B.hp<=0){B.dead=1;B.st='dying';B.t=0;L.bul.length=0;}}
function spawnMinions(){const a=L.arena.x0;for(const dx of[200,760])L.en.push({t:'f',x:a+dx,y:200,by:200,w:34,h:30,x0:a+dx-90,x1:a+dx+90,dir:1,alive:true,ph:0,sh:0});
  for(let i=0;i<4;i++)L.rings.push({x:a+380+i*60,y:300,got:false});}
function updateBoss(body,atk){
  const b=B,p=P,a=L.arena.x0;b.t++;if(b.inv>0)b.inv--;
  if(b.st==='dying'){b.y+=1.2;if(b.t%6===0)part(b.x+(Math.random()-.5)*80,b.y+(Math.random()-.5)*60,'#ff8a1a',10,8);
    if(b.t%15===0)sfx('boom');
    if(b.t>150){B=null;L.bossDone=true;run.score+=3000;SAVE.reached=4;SAVE.done=true;SAVE.best=Math.max(SAVE.best||0,run.score);writeSave();say('win',true);startStory(LV[4].outro,()=>{state='win';});}return;}
  const fast=b.hp<=6;
  if(b.st==='hover'){b.x=b.cx+Math.sin(b.t/(fast?55:75))*340;b.y=150+Math.sin(b.t/38)*28;
    if(b.t%(fast?75:105)===0){const dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy)||1;L.bul.push({x:b.x,y:b.y+30,vx:dx/l*4,vy:dy/l*4,life:220,r:11});}
    if(b.t>(fast?260:340)){b.st='dive';b.t=0;b.tx=Math.max(a+80,Math.min(p.x,a+W-80));}}
  else if(b.st==='dive'){b.x+=(b.tx-b.x)*.12;b.y+=7;if(b.y>=372){b.y=372;b.st='rest';b.t=0;shake=12;sfx('boom');}}

  const bb={x:b.x-40,y:b.y-28,w:80,h:60};
  if(b.inv<=0&&(ov(body,bb)||(atk&&ov(atk,bb)))){
    if(canAtk(p)||atk){hitBoss();p.vx=-p.face*6;p.vy=-9;p.dashT=0;}else hurt();}
  else if(b.inv>0&&ov(body,bb)&&!canAtk(p)&&!atk)hurt();
}

      g.strokeStyle='#bbb';g.lineWidth=3;g.strokeRect(cg.x,cg.y,cg.w,cg.h);for(let i=1;i<6;i++){g.beginPath();g.moveTo(cg.x+i*9.3,cg.y);g.lineTo(cg.x+i*9.3,cg.y+cg.h);g.stroke();}
      g.fillStyle='#888';g.fillRect(cg.x-3,cg.y-6,cg.w+6,8);
      if(Math.abs(P.x-cg.x)<260)T('اقفز عليه أو اضغط هجوم!',cg.x+28,cg.y-30,16,'#fff','center',true,'#000');}
    else drawChar(cg.who,cg.x+28,cg.y+cg.h,-1,frame*.1,'idle',.8);}
  // enemies
  for(const e of L.en){if(!e.alive)continue;
    if(e.t==='w'){ell(e.x+17,e.y+22,17,12,'#8a8f99');g.fillStyle='#c0392b';g.beginPath();g.arc(e.x+17,e.y+18,15,Math.PI,0);g.fill();
      ell(e.x+17+e.dir*5,e.y+13,5,5,'#ffe24a');ell(e.x+17+e.dir*6,e.y+13,2,2,'#000');ell(e.x+9,e.y+28,6,4,'#333');ell(e.x+25,e.y+28,6,4,'#333');}
    else{ell(e.x+17,e.y+17,16,13,'#c0392b');ell(e.x+17+e.dir*5,e.y+14,5,5,'#ffe24a');ell(e.x+17+e.dir*6,e.y+14,2,2,'#000');
      g.strokeStyle='#333';g.lineWidth=3;g.beginPath();const pr=Math.sin(frame*1.2)*18;g.moveTo(e.x+17-pr,e.y+2);g.lineTo(e.x+17+pr,e.y+2);g.stroke();}}
  for(const b of L.bul){ell(b.x,b.y,b.r,b.r,'#ff5a1a');ell(b.x,b.y,b.r*.5,b.r*.5,'#ffe24a');}
  for(const s of L.shots){g.fillStyle='#ff2a2a';tri(s.x+s.vx*1.2,s.y,s.x-s.vx*.5,s.y-5,s.x-s.vx*.5,s.y+5);}
  // boss
  if(B&&!(B.inv>0&&frame%6<3))drawRobotnik(B.x,B.y,1.25,frame);
  // player
  const p=P;
  if(p.superT>0){for(let i=0;i<p.trail.length;i++){const tr=p.trail[i];g.globalAlpha=.08+i*.05;SUPERDRAW=true;drawChar(p.ch,tr.x+13,tr.y+p.h,tr.face,frame*.4,'run',.82);SUPERDRAW=false;}g.globalAlpha=1;
    const ar=40+Math.sin(frame*.4)*5,ag=g.createRadialGradient(p.x+13,p.y+20,4,p.x+13,p.y+20,ar);ag.addColorStop(0,'rgba(255,240,120,.55)');ag.addColorStop(1,'rgba(255,190,30,0)');g.fillStyle=ag;g.beginPath();g.arc(p.x+13,p.y+20,ar,0,7);g.fill();}
  if(!(p.invT>0&&frame%6<3)){
    const spd=Math.abs(p.vx);let pose='idle';
    if(p.dead)pose='idle';else if(p.rolling||p.dashT>0||(!p.onGround&&!p.glide&&!p.fly&&!(p.attackT>0&&CH[p.ch].k==='tails')))pose='ball';
    else if(p.attackT>0&&CH[p.ch].k==='tails')pose='ball';
    else if(p.glide)pose='glide';else if(p.fly)pose='fly';else if(spd>.5&&p.onGround)pose='run';
    SUPERDRAW=p.superT>0;drawChar(p.ch,p.x+13,p.y+p.h,p.face,frame*(pose==='run'?Math.max(.6,spd/8):.5),pose,.82);SUPERDRAW=false;
    if(p.attackT>0&&CH[p.ch].k==='knuckles')drawFist(p.x+13,p.y+p.h,p.face,frame);
  }
  for(const q of L.parts){g.fillStyle=q.c;g.globalAlpha=Math.min(1,q.life/20);g.fillRect(q.x,q.y,q.r,q.r);}g.globalAlpha=1;
  g.restore();
}
function drawHUD(){
  const rtl=false;
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(8,8,250,66);
  g.strokeStyle='#ffd23c';g.lineWidth=4;g.beginPath();g.ellipse(26,26,8,11,0,0,7);g.stroke();
  T(String(P.rings),48,26,24,'#fff','left',false,'#000');
  T('♥ x'+Math.max(0,run.lives),150,26,22,'#ff6b8a','left',false,'#000');
  T('النقاط: '+run.score,246,54,17,'#fff','right',true);
  T(SAVE.name||'',W/2,20,18,'#fff','center',true,'#000');
  g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.arc(W/2+110,24,18,0,7);g.fill();g.fillStyle='#fff';g.fillRect(W/2+103,15,5,18);g.fillRect(W/2+112,15,5,18);
  if(P.superT>0){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(8,78,250,22);g.fillStyle='#ffd23c';g.fillRect(10,80,246*P.superT/600,18);T('⚡ طاقة خارقة',133,89,14,'#5a3800','center',true);}
  if(toast.n>0){toast.n--;g.globalAlpha=Math.min(1,toast.n/25);g.font=`bold 24px ${FONT}`;g.direction='rtl';const w2=g.measureText(toast.t).width+60;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(W/2-w2/2,H-112,w2,40);T('🗣 '+toast.t,W/2,H-92,24,'#ffe680','center',true);g.globalAlpha=1;}
  // chars
  for(let i=0;i<4;i++){const x=W-66-i*58+0,act=i===P.ch,un=run.unlocked[i];
    g.fillStyle=act?'rgba(255,220,60,.8)':'rgba(0,0,0,.45)';g.fillRect(x-24,8,52,58);
    g.save();g.globalAlpha=un?1:.3;portrait(i,x+2,38,22,i===0&&P.superT>0);g.restore();
    T(String(i+1),x-16,16,14,'#fff','center',false);}
  if(banner>0){g.globalAlpha=Math.min(1,banner/40);T(LV[lvl].name,W/2,H/2-110,34,'#fff','center',true,'#000');g.globalAlpha=1;}
  if(B&&B.hp>0){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(W/2-160,H-34,320,20);g.fillStyle='#d22';g.fillRect(W/2-158,H-32,316*B.hp/B.max,16);T('الدكتور روبوتنيك',W/2,H-44,15,'#fff','center',true,'#000');}
}
function wrap(txt,maxW,size){g.font=`bold ${size}px ${FONT}`;g.direction='rtl';const ws=txt.split(' '),ls=[];let cur='';
  for(const w of ws){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){ls.push(cur);cur=w;}else cur=t;}ls.push(cur);return ls;}
function drawStory(){
  const s=story,ln=s.lines[s.i];s.t++;
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);
  const bx=40,by=H-200,bw=W-80,bh=170;
  g.fillStyle='rgba(10,20,50,.95)';g.fillRect(bx,by,bw,bh);g.strokeStyle='#ffd23c';g.lineWidth=4;g.strokeRect(bx,by,bw,bh);
  const wh=WHO[ln.w];
  // portrait (right side)
  const px=bx+bw-90,py=by+bh-20;
  g.save();g.beginPath();g.rect(px-70,by-70,140,bh+50);g.restore();
  if(ln.w==='r')drawRobotnik(px,py-55,1.7,s.t);
  else if(ln.w==='t')drawTom(px,py,1.6);
  else if(wh.ch!==undefined)portrait(wh.ch,px,by+bh/2,66);
  const tx=ln.w==='n'?bx+bw-30:bx+bw-190;
  if(wh.name)T(wh.name,tx,by+26,24,'#ffd23c','right',true);
  const lines=wrap(ln.t,tx-bx-30,24);
  lines.forEach((l,i)=>T(l,tx,by+(wh.name?66:60)+i*34,24,'#fff','right',true));
  if(s.t%60<40)T(isTouch?'اضغط للمتابعة ▶':'اضغط Enter أو المسافة ▶',bx+110,by+bh-20,16,'#9fd0ff','center',true);
}
function drawTitle(){
  frame++;bg();
  g.fillStyle='#46b84a';g.fillRect(0,470,W,70);g.fillStyle='#8a5a2b';g.fillRect(0,482,W,60);
  const x=((frame*4)%1100)-70;drawChar(0,x,470,1,frame*.4,'run',2.4);
  drawChar(1,x-120,470,1,frame*.4,'run',1.8);drawChar(2,x-220,470,1,frame*.4,'run',1.8);drawChar(3,x-320,470,1,frame*.4,'run',1.8);
}
function overlay(title,sub,col){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,W,H);T(title,W/2,H/2-40,60,col,'center',true,'#000');
  if(frame%70<45)T(sub,W/2,H/2+40,28,'#fff','center',true);}

/* ---------- main loop ---------- */
let last=performance.now(),acc=0;
function clearOnce(){for(const k in once)once[k]=false;}
function tick(){
  const conf=once.confirm||once.jump||once.att;
  if(state==='title'){}
  else if(state==='story'){if(conf&&story.t>8){story.i++;story.t=0;if(story.i>=story.lines.length){const f=story.after;story=null;f();}}}
  else if(state==='play'){update();}
  else if(state==='over'||state==='win'){frame++;if(conf&&frame>30){if(state==='over'){run.lives=5;beginLevel(lvl);}else{showMenu();}}}
}
function render(){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  if(state==='title'){drawTitle();return;}
  bg();if(L)drawWorld();
  if(state==='play'||state==='over'||state==='win')drawHUD();
  if(state==='story'){drawHUD();drawStory();}
  if(state==='pause')drawHUD();
  if(state==='over')overlay('انتهت المحاولات','اضغط للمحاولة من جديد','#ff5a5a');
  if(state==='win')overlay('🏆 انتصرت!','شكرًا للعب — اضغط للعودة للقائمة','#ffd23c');
}
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){tick();clearOnce();acc-=1000/60;}
  render();requestAnimationFrame(loop);
}
/* ---------- menu ---------- */
const $=id=>document.getElementById(id);
let selLv=0;
function buildLevels(){const r=Math.min(4,SAVE.reached||0),box=$('lv');box.innerHTML='';
  if(selLv>r)selLv=r;
  for(let i=0;i<=r;i++){const b=document.createElement('button');b.textContent=(i<r||(SAVE.done&&i===4)?'✓ ':'')+(i+1)+'. '+LV[i].name.split(': ')[1];
    if(i===selLv)b.className='sel';b.onclick=()=>{selLv=i;buildLevels();};box.appendChild(b);}
  $('lvl').style.display=r>0?'block':'none';box.style.display=r>0?'flex':'none';
  $('go').textContent=r>0?'▶ ابدأ من الفصل '+(selLv+1):'ابدأ اللعب';}
$('vt').onclick=()=>{stopVoice();VA.muted=false;VA.src=vurl('ring2');VA.volume=1;const pr=VA.play();
  const st=$('vst');st.textContent='جارٍ تشغيل عبارة تجريبية…';
  if(pr&&pr.then)pr.then(()=>{st.textContent='إن سمعت صوتك يقول «كمل كمل!» أو ما يشبهها فالصوت يعمل. إن لم تسمع شيئًا: ارفع صوت الجهاز وألغِ وضع الصامت.';}).catch(()=>{st.textContent='تعذّر تشغيل الصوت. اضغط الزر مرة أخرى أو تأكد من إعدادات الصوت في المتصفح.';});};
function showMenu(){state='title';stopVoice();
  $('nm').value=SAVE.name||'';selLv=Math.min(4,SAVE.reached||0);$('vc').checked=voiceOn;
  $('ctl').textContent=isTouch?'الأزرار على الشاشة: ◀ ▶ حركة · قفز · هجوم · تبديل · ☰ قائمة':'الأسهم/WASD حركة · المسافة قفز · X هجوم · ↓ دوران · 1-4 أو Q تبديل · Esc قائمة';
  $('vst').textContent='';buildLevels();$('menu').style.display='flex';document.body.classList.add('inmenu');}
$('go').onclick=()=>{audioInit();const nm=$('nm').value.trim();if(!nm){$('nm').focus();$('nm').style.background='#ffd6d6';$('nm').placeholder='من فضلك اكتب اسمك';return;}
  SAVE.name=nm;voiceOn=$('vc').checked;SAVE.voice=voiceOn;writeSave();$('menu').style.display='none';document.body.classList.remove('inmenu');
  run.score=(SAVE.scores&&SAVE.scores[selLv])||0;run.lives=5;run.unlocked=unlockedFor(selLv);run.ch=0;run.kills=0;
  unlockVoice();beginLevel(selLv);};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('nm').addEventListener('input',()=>{$('nm').style.background='#fff';});
function pauseGame(){if(state!=='play')return;state='pause';for(const k in held)held[k]=false;$('pm').style.display='flex';document.body.classList.add('inmenu');stopVoice();}
function resumeGame(){$('pm').style.display='none';document.body.classList.remove('inmenu');state='play';}
$('pr').onclick=resumeGame;
$('prs').onclick=()=>{$('pm').style.display='none';document.body.classList.remove('inmenu');run.lives=5;run.score=(SAVE.scores&&SAVE.scores[lvl])||0;run.unlocked=unlockedFor(lvl);beginLevel(lvl);};
$('px').onclick=()=>{$('pm').style.display='none';showMenu();};
showMenu();
requestAnimationFrame(loop);
</script>
