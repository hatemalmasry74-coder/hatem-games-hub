<script>
'use strict';
/* =========================================================
   الصقر المقاتل — Falcon Fighter  (v1)  single-file canvas shooter
   ========================================================= */
const W=960,H=540,TAU=Math.PI*2,FONT='Tahoma, Arial, sans-serif',S=2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('c'),g=cv.getContext('2d');
const isTouch=(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&matchMedia('(pointer:coarse)').matches);
if(isTouch)document.body.classList.add('touch');
let K=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*s*dpr);
  const nw=Math.max(W,Math.min(pw,1920));
  if(cv.width!==nw){cv.width=nw;cv.height=Math.round(nw*H/W);}
  K=cv.width/W;
  $('rot').style.display=(isTouch&&vh>vw)?'flex':'none';
  if(isTouch&&vh>vw&&state==='play')pauseGame();
}
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#menu,.ovl'))return;e.preventDefault();},{passive:false});

/* ---------- save ---------- */
const SK='hub_jet_v1';
const NST=12;
const SAVE={best:0,stars:new Array(NST).fill(0),unlocked:1,jet:0,diff:1,stage:0,auto:null,mute:false,snd:true,cheer:true,bestStage:new Array(NST).fill(0)};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SK)||'{}');if(s&&typeof s==='object'){for(const k in SAVE)if(s[k]!==undefined)SAVE[k]=s[k];}}catch(e){}
  for(const k of ['stars','bestStage']){if(!Array.isArray(SAVE[k]))SAVE[k]=[];while(SAVE[k].length<NST)SAVE[k].push(0);SAVE[k]=SAVE[k].slice(0,NST).map(v=>+v||0);}
  SAVE.unlocked=clamp(+SAVE.unlocked||1,1,NST);SAVE.jet=clamp(+SAVE.jet||0,0,2);SAVE.diff=clamp(+SAVE.diff||0,0,2);SAVE.best=+SAVE.best||0;}
function store(){try{localStorage.setItem(SK,JSON.stringify(SAVE));}catch(e){}}
const totalStars=()=>SAVE.stars.reduce((a,b)=>a+(+b||0),0);

/* ---------- audio ---------- */
let AC=null,master=null,NB=null,comp=null,muted=false,sndOn=true,cheerOn=true,voices=0,OFF=false,LP=null;const MAXV=22,lastSfx={};
const rr=(a,b)=>a+Math.random()*(b-a);
function mkNoise(ctx){const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*2),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function buildChain(ctx){const m=ctx.createGain(),cp=ctx.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=20;cp.ratio.value=8;cp.attack.value=.003;cp.release.value=.2;
  const ws=ctx.createWaveShaper(),cv=new Float32Array(1024);for(let i=0;i<1024;i++){cv[i]=Math.tanh((i/511.5-1)*1.2)*.97;}ws.curve=cv;m.connect(cp);cp.connect(ws);ws.connect(ctx.destination);return {m:m,cp:cp};}
function applyVol(){if(master)master.gain.value=(muted||!sndOn)?0:.55;}
function audioInit(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();const ch=buildChain(AC);master=ch.m;comp=ch.cp;applyVol();NB=mkNoise(AC);initLoops();}
  if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function tone(f,f2,d,type,v,delay,att){if(!AC||voices>=MAXV)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2!==f)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+(att||.004));gn.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(gn);gn.connect(master);voices++;o.onended=()=>{voices=Math.max(0,voices-1);try{gn.disconnect();}catch(e){}};o.start(t);o.stop(t+d+.03);}
function noise(d,v,f0,f1,type,delay,q){if(!AC||!NB||voices>=MAXV)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NB;s.loop=true;fl.type=type||'lowpass';fl.Q.value=q||.7;fl.frequency.setValueAtTime(f0,t);if(f1!==f0)fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+.004);gn.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(fl);fl.connect(gn);gn.connect(master);voices++;s.onended=()=>{voices=Math.max(0,voices-1);try{gn.disconnect();}catch(e){}};s.start(t,Math.random()*1.5);s.stop(t+d+.03);}
const GAP={shoot:55,spread:80,laser:110,hit:40,boomS:40,boom:60,big:150,huge:300,missile:100,hurt:100,pick:30,tele:200,shield:80,combo:150};
const SFX={
  shoot:()=>{const f=rr(780,1080);tone(f,f*.42,.07,'square',.14);tone(f*1.5,f*.7,.04,'triangle',.07);noise(.025,.05,6000,3000,'highpass');},
  spread:()=>{const f=rr(500,700);tone(f,f*.4,.09,'sawtooth',.11);tone(f*1.25,f*.5,.09,'square',.07);noise(.05,.08,4000,1500,'bandpass');},
  laser:()=>{tone(rr(1700,2000),900,.05,'sawtooth',.09);},
  missile:()=>{noise(.45,.2,500,3200,'bandpass',0,1.2);noise(.5,.12,3000,400,'lowpass',.1);tone(240,90,.3,'sawtooth',.1);},
  hit:()=>{tone(rr(260,340),150,.035,'square',.1);},
  boomS:()=>{noise(.22,.2,2800,200);tone(130,45,.2,'sine',.22);},
  boom:()=>{noise(.45,.3,2400,120);tone(110,32,.45,'sine',.32);for(let i=0;i<4;i++)noise(.05,.07,5000,2000,'highpass',.08+i*.06+rr(0,.04));},
  big:()=>{noise(.9,.42,2000,70);tone(100,26,.9,'sine',.45);tone(55,25,.8,'triangle',.3,.03);for(let i=0;i<6;i++)noise(.07,.08,5000,1800,'highpass',.12+i*.09+rr(0,.05));},
  huge:()=>{noise(1.3,.5,1800,50);tone(80,22,1.3,'sine',.5);tone(46,20,1.2,'triangle',.35,.05);for(let i=0;i<7;i++)noise(.08,.09,5000,1500,'highpass',.15+i*.1+rr(0,.06));},
  bossdie:()=>{for(let i=0;i<7;i++){const d=i*.34;noise(.6,.32,2200,90,'lowpass',d);tone(100,30,.6,'sine',.33,d);}noise(1.6,.5,1800,40,'lowpass',2.5);tone(60,18,1.6,'sine',.5,2.5);},
  hurt:()=>{noise(.35,.4,900,100);tone(200,60,.3,'sawtooth',.25);},
  pick:(k)=>{const T={P:[523,659,784,1047],S:[392,523,392,523],L:[1200,1800,2400],M:[330,392,494],D:[880,1175,1320,1760],H:[300,450,680,900],B:[110,220,330],R:[523,659,784,988],X:[1568,2093,2637]}[k]||[600,900,1400];
    T.forEach((f,i)=>tone(f,f*(k==='H'?1.1:1),.11,k==='S'||k==='L'?'sawtooth':k==='H'||k==='D'?'sine':'triangle',.13,i*.055));noise(.12,.04,9000,6000,'highpass',.05);},
  bomb:()=>{noise(1.4,.6,3000,50);tone(90,22,1.2,'sine',.55);tone(900,60,1,'sine',.22);tone(45,20,1.3,'triangle',.3,.05);for(let i=0;i<6;i++)noise(.08,.08,5000,1500,'highpass',.2+i*.12);},
  warn:()=>{for(let i=0;i<6;i++)tone(i%2?392:523,i%2?392:523,.3,'square',.06,i*.34);},
  tele:()=>{tone(1000,1000,.07,'square',.1);tone(1000,1000,.07,'square',.1,.11);},
  roar:()=>{tone(95,38,1.1,'sawtooth',.22);tone(110,45,.8,'square',.1,.05);noise(1.1,.28,600,150,'bandpass',0,2);},
  lowhp:()=>{tone(880,880,.09,'square',.12);tone(880,880,.09,'square',.12,.16);},
  combo:()=>{tone(700,1100,.1,'triangle',.16);tone(1000,1600,.14,'triangle',.16,.09);},click:()=>tone(620,880,.05,'square',.12),
  clear:()=>{[[523,0],[659,.14],[784,.28],[1047,.42],[784,.62],[1047,.76],[1319,.95]].forEach(a=>{tone(a[0],a[0],.3,'triangle',.12,a[1]);tone(a[0]/2,a[0]/2,.3,'square',.03,a[1]);});},
  ding:(d)=>{tone(1568,1568,.35,'sine',.12,d||0);tone(2349,2349,.25,'sine',.06,d||0);},
  over:()=>{[400,330,260,180].forEach((f,i)=>{tone(f,f*.9,.32,'sawtooth',.1,i*.24);});noise(.8,.1,1200,100,'lowpass',.7);},
  shield:()=>{tone(1300,650,.13,'sine',.18);tone(1950,900,.1,'triangle',.1);},
  thunder:(d)=>{noise(1.7,.35,500,50,'lowpass',d||0);tone(50,22,1.4,'sine',.3,d||0);}};
function sfx(n,a){if(!AC||muted||!sndOn||OFF)return;const now=performance.now();if(GAP[n]&&now-(lastSfx[n]||0)<GAP[n])return;lastSfx[n]=now;try{SFX[n](a);}catch(e){}}
/* ----- persistent loops: engine / laser beam / drone / ambient ----- */

const keys={};let touchFire=false,autoFire=false,joy={x:0,y:0},mouse={on:false,x:480,y:270};
function weaponName(w){return {bolt:'رشاش',spread:'انتشار',laser:'ليزر',missile:'صواريخ'}[w];}
function shootMain(){
  const d=JT.dmg,x=P.x+36,y=P.y+2,l=P.lvl,fr=JT.fire;
  if(P.wt==='bolt'||P.wt==='missile'){
    const nn=P.wt==='bolt'?l:Math.min(l,2)+(l>=4?1:0);
    const off=[[0],[-6,6],[-9,0,9],[-12,-4,4,12]][nn-1];
    off.forEach((o,i)=>{const sl=(nn>=3&&(i===0||i===nn-1))?(i===0?-.06:.06):0;pshot(x,y+o,Math.cos(sl)*13,Math.sin(sl)*13,d,0);});
    P.fcd=Math.round(8/fr);sfx('shoot');
    if(P.wt==='missile'&&--P.mcd<=0){P.mcd=Math.round(2.4/fr)*1;const n=[1,2,3,4][l-1];for(let i=0;i<n;i++){const m=pshot(P.x-6,P.y+(i%2?14:-8),3+i*.4,(i%2?1:-1)*(1.5+i*.6),2.4*d,2);m.life=140;}sfx('missile');}
  }else if(P.wt==='spread'){
    const n=[3,4,5,7][l-1],sp=[.34,.44,.52,.7][l-1];
    for(let i=0;i<n;i++){const a=(i/(n-1)-.5)*sp*2;pshot(x,y,Math.cos(a)*12,Math.sin(a)*12,.75*d,0).v=1;}
    P.fcd=Math.round(10/fr);sfx('spread');
  }else if(P.wt==='laser'){
    const off=[[0],[-5,5],[-8,0,8],[-12,-4,4,12]][l-1];
    for(const o of off)pshot(x+10,y+o,19,0,.8*d,1);
    P.fcd=Math.round(6/fr);sfx('laser');
  }
}
function hitP(d){
  if(P.inv>0||P.dead||state!=='play')return false;
  if(P.shield>0){P.shield=Math.max(0,P.shield-240);P.inv=40;sfx('shield');FX.push({t:'ring',x:P.x,y:P.y,r:20,mx:50,life:14,max:14});spark(P.x,P.y,10,'#7ab8ff');return true;}
  P.hp-=d;R.hits++;R.chain=0;R.mult=1;P.inv=110;P.fl=18;R.shake=Math.max(R.shake,10);R.flash=.35;R.flashC='#ff2a2a';sfx('hurt');spark(P.x,P.y,14,'#ff8a5a');if(P.hp<=1||Math.random()<.3)cheer('hurt');
  if(P.hp<=0)die();return true;
}
function die(){
  boom(P.x,P.y,56);P.dead=true;P.rt=80;R.lives--;P.lvl=Math.max(1,P.lvl-1);P.drones=0;P.shield=0;R.chain=0;R.mult=1;
  if(R.lives<=0){gameOver();}
}
function respawn(){P.dead=false;P.hp=P.maxhp;P.x=70;P.y=H/2;P.vx=0;P.inv=170;P.fcd=0;R.bombs=Math.max(R.bombs,1);R.flash=0;}
function useBomb(){
  if(state!=='play'||P.dead||R.bombs<=0||R.bombCd>0)return;
  R.bombs--;R.bombCd=40;P.inv=Math.max(P.inv,140);R.flash=1;R.flashC='#fff';R.shake=22;sfx('bomb');
  FX.push({t:'ring',x:P.x,y:P.y,r:10,mx:1000,life:44,max:44,thick:1});
  for(let i=EB.length-1;i>=0;i--){const b=EB[i];spark(b.x,b.y,2,'#ffe9a0');addScore(8);POOL.eb.push(b);EB.splice(i,1);}
  for(const e of EN){if(e.dead||e.x>W+20)continue;if(e.k==='boss'){if(!e.inv)dmgE(e,Math.min(50,e.mh*.07+8),e.x,e.y);}else{const sh=e.shield;e.shield=0;dmgE(e,30,e.x,e.y);if(sh>0&&!e.dead){}}}
  HZ.length=0;
}
function updPlayer(){
  if(R.bombCd>0)R.bombCd--;
  if(P.dead){if(--P.rt<=0&&R.lives>0&&state==='play')respawn();return;}
  if(P.inv>0)P.inv--;if(P.shield>0)P.shield--;if(P.fl>0)P.fl--;
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.KeyA)ix-=1;if(keys.ArrowRight||keys.KeyD)ix+=1;if(keys.ArrowUp||keys.KeyW)iy-=1;if(keys.ArrowDown||keys.KeyS)iy+=1;
  ix+=joy.x;iy+=joy.y;
  let tvx,tvy;
  if(mouse.on){const dx=mouse.x-P.x,dy=mouse.y-P.y,dd=Math.hypot(dx,dy),sp=Math.min(JT.spd*1.6,dd*.25);tvx=dd>1?dx/dd*sp:0;tvy=dd>1?dy/dd*sp:0;}
  else{const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}tvx=ix*JT.spd;tvy=iy*JT.spd;}
  P.vx+=(tvx-P.vx)*.3;P.vy+=(tvy-P.vy)*.3;
  P.x=clamp(P.x+P.vx,34,W-40);P.y=clamp(P.y+P.vy,40,H-30);
  P.tilt+=(clamp(P.vy*.035,-.22,.22)-P.tilt)*.2;
  const firing=keys.Space||touchFire||autoFire||mouse.on;P.fire=!!firing;
  if(P.fcd>0)P.fcd--;
  if(firing&&P.fcd<=0&&P.x>0)shootMain();
  for(let i=0;i<P.drones;i++){const d=P.dr[i],tx=P.x-6,ty=P.y+(i?44:-44);d.x+=(tx-d.x)*.14;d.y+=(ty-d.y)*.14;if(firing&&(gt+i*7)%15===0&&P.x>0)pshot(d.x+14,d.y,12,0,.45*JT.dmg,0);}
  for(let i=P.drones;i<2;i++){P.dr[i].x=P.x;P.dr[i].y=P.y;}
  if(gt%2===0)part(P.x-40,P.y+1+rnd(-1.5,1.5),-rnd(2,4)+P.vx*.3,rnd(-.4,.4),rnd(8,14),rnd(2,3.5),['#ffb347','#ff7a1a','#fff3a0'][ri(0,2)],0);
}
function gameOver(){
  state='over';R.overT=0;SAVE.best=Math.max(SAVE.best,R.score);store();sfx('over');cheer('die',true);
}

/* ----- bullets & collisions ----- */
function updBullets(){
  for(let i=PB.length-1;i>=0;i--){const b=PB[i];
    if(b.ty===2){ // homing missile
      if(!b.tg||b.tg.dead||b.tg.x<-20||b.tg.x>W){b.tg=null;let bd=1e9;for(const e of EN){if(e.dead||e.x>W-10||e.x<b.x-20||e.inv)continue;const dd=(e.x-b.x)**2+(e.y-b.y)**2;if(dd<bd){bd=dd;b.tg=e;}}}
      if(b.tg){const want=Math.atan2(b.tg.y-b.y,b.tg.x-b.x);let cur=Math.atan2(b.vy,b.vx),df=want-cur;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;cur+=clamp(df,-.11,.11);b.sp=Math.min(9.5,b.sp+.25);b.vx=Math.cos(cur)*b.sp;b.vy=Math.sin(cur)*b.sp;}
      else{b.sp=Math.min(9.5,b.sp+.25);const c=Math.atan2(b.vy,b.vx);b.vx=Math.cos(c)*b.sp;b.vy=Math.sin(c)*b.sp*0.9;}
      if(gt%2===0)part(b.x-6,b.y,rnd(-1,0),rnd(-.4,.4),10,2.4,'#ffd0a0',1);
    }
    b.x+=b.vx;b.y+=b.vy;
    if(--b.life<=0||b.x>W+40||b.x<-40||b.y<-40||b.y>H+40){POOL.pb.push(b);PB.splice(i,1);continue;}
    // hit enemies
    let used=false;
    for(let j=0;j<EN.length;j++){const e=EN[j];if(e.dead)continue;
      if(Math.abs(b.x+(b.ty===1?b.hl*.6:0)-(e.x+e.ox))<e.hw+(b.ty===1?b.hl*.5:b.r)&&Math.abs(b.y-(e.y+e.oy))<e.hh+b.r){
        if(e.x>W-8&&e.k!=='boss')continue;
        if(b.hit){if(b.hit.indexOf(e.id)>=0)continue;b.hit.push(e.id);}
        dmgE(e,b.dmg,b.x+8,b.y);
        if(b.ty===2){boom(b.x,b.y,18);}
        else spark(b.x+6,b.y,2,'#fff2a0');
        if(b.ty!==1){used=true;break;}
      }
    }
    if(used){POOL.pb.push(b);PB.splice(i,1);}
  }
  for(let i=EB.length-1;i>=0;i--){const b=EB[i];b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.t++;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+40){POOL.eb.push(b);EB.splice(i,1);continue;}
    if(!P.dead){const dx=b.x-P.x,dy=b.y-P.y,rr=b.r*.7+P.hr;if(dx*dx+dy*dy<rr*rr){if(hitP(1)){POOL.eb.push(b);EB.splice(i,1);}}}
  }
  // body contact
  if(!P.dead&&P.inv<=0){for(const e of EN){if(e.dead||e.x>W)continue;if(Math.abs(P.x-(e.x+e.ox))<e.hw*.8+8&&Math.abs(P.y-(e.y+e.oy))<e.hh*.8+4){
    if(hitP(e.k==='kami'?2:1)){if(e.k!=='boss'&&e.k!=='bomber'&&e.k!=='elite'){e.hp=0;killE(e);}}break;}}}
}
function updPU(){
  for(let i=PU.length-1;i>=0;i--){const u=PU[i];u.t++;
    if(u.k==='X'){const dx=P.x-u.x,dy=P.y-u.y,dd=Math.hypot(dx,dy);if(dd<160&&!P.dead){u.x+=dx/dd*5;u.y+=dy/dd*5;}else u.x+=u.vx;u.y0+=0;}
    else{u.x+=u.vx;u.y=u.y0+Math.sin(u.t*.06)*18;}
    if(u.x<-30){PU.splice(i,1);continue;}
    if(!P.dead&&Math.abs(u.x-P.x)<30&&Math.abs(u.y-P.y)<28){collect(u);PU.splice(i,1);}
  }
}

let gating=false;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none';},4500);}
function gateRun(idx,go){
  const N=idx+1;
  if(N<5||!window.HubPay||typeof HubPay.gate!=='function'){go();return;}
  if(gating)return;gating=true;releaseInputs();
  try{HubPay.gate(N,'jet',ok=>{gating=false;if(ok)go();else{openMenu();toast('وصلت للمرحلة الخامسة — اشترك لتكمل!');}});}catch(e){gating=false;go();}
}
function pauseGame(){if(state!=='play')return;state='pause';releaseInputs();stopCheer();audioTick();show('pm',1);setMuteUI();}
function resumeGame(){if(state!=='pause')return;state='play';show('pm',0);cheer('idle');}
function restartStage(){gateRun(R.stage,()=>{show('pm',0);show('end',0);D=DIFF[SAVE.diff];JT=JETS[SAVE.jet];beginStage(R.stage,R.snap);});}
function releaseInputs(){for(const k in keys)keys[k]=false;touchFire=false;mouse.on=false;joy.x=joy.y=0;document.querySelectorAll('.tb.on').forEach(e=>e.classList.remove('on'));}
function showEnd(){
  show('end',1);const r=R.res;

    $('et').textContent=r.last?'🏆 خلّصت اللعبة يا أسطورة!':'🎉 المرحلة '+(R.stage+1)+' خلصت يا بطل!';
    $('es').innerHTML='<p>النتيجة: <b style="color:#ffd23c">'+fmt(R.score)+'</b> (مكافأة '+fmt(r.bonus)+')</p><p>الدقة: '+Math.round(r.acc*100)+'٪ · أطول سلسلة: '+R.maxChain+'</p><p>النجوم اللي كسبتها: '+'⭐'.repeat(r.gain)+'</p>'+(r.newJet?'<p style="color:#7aff9a">🔓 فتحت طيارة جديدة: '+r.newJet+'!</p>':'');

    $('e1').style.display='block';$('e1').textContent=r.last?'🏠 القائمة':'المرحلة اللي بعدها ▶';
    $('e1').onclick=()=>{sfx('click');if(r.last){openMenu();}else{gateRun(R.stage+1,()=>{show('end',0);SAVE.stage=Math.max(SAVE.stage,R.stage+1);store();beginStage(R.stage+1,{score:R.score,lives:R.lives,bombs:R.bombs,wt:P.wt,lvl:P.lvl,drones:P.drones});});}};
    $('e2').style.display='block';$('e2').textContent='🔄 إعادة المرحلة';$('e2').onclick=()=>{sfx('click');restartStage();};
  }else{

    $('es').innerHTML='<p>النتيجة: <b style="color:#ffd23c">'+fmt(R.score)+'</b></p><p>أعلى نتيجة: '+fmt(SAVE.best)+'</p><p>وصلت للمرحلة '+(R.stage+1)+' — حاول تاني وإنت قدها!</p>';
    $('em').innerHTML='';
    $('e1').style.display='block';$('e1').textContent='حاول تاني ▶';$('e1').onclick=()=>{sfx('click');restartStage();};

}
function toggleAuto(){autoFire=!autoFire;SAVE.auto=autoFire;$('af').checked=autoFire;$('ba').classList.toggle('act',autoFire);}

/* input */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&state==='menu'&&e.target.id==='nm'&&!gating)startGame();return;}
  if(gating)return;
  const c=e.code;if(c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown'||c==='Space')e.preventDefault();
  if(c==='Escape'||c==='KeyP'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();return;}
  if(state==='menu'&&c==='Enter'){startGame();return;}
  if(c==='KeyB'&&!e.repeat)useBomb();else if(c==='KeyF'&&!e.repeat)toggleAuto();else if(c==='KeyM'&&!e.repeat)toggleMute();
  keys[c]=true;audioInit();
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=false;});
addEventListener('blur',()=>{releaseInputs();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});
function bindBtn(id,down,up){const el=$(id),ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}ids.add(e.pointerId);el.classList.add('on');audioInit();down();});
  const u=e=>{ids.delete(e.pointerId);if(!ids.size){el.classList.remove('on');if(up)up();}};
  el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('lostpointercapture',u);}
bindBtn('bf',()=>{touchFire=true;},()=>{touchFire=false;});
bindBtn('bb',()=>{useBomb();},null);
$('ba').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();toggleAuto();});
$('bp').addEventListener('click',()=>{audioInit();if(state==='play')pauseGame();});
$('bp').addEventListener('pointerdown',e=>e.stopPropagation());
/* joystick */
const jz=$('joyz'),jb=$('joyb'),jk=$('joyk');let jid=null,jo={x:0,y:0};
function joyIdle(){const x=Math.max(80,innerWidth*.09),y=innerHeight-Math.max(80,innerHeight*.22);jb.style.left=x+'px';jb.style.top=y+'px';jk.style.left=x+'px';jk.style.top=y+'px';jb.classList.add('idle');jk.classList.add('idle');}
jz.addEventListener('pointerdown',e=>{if(jid!==null)return;e.preventDefault();try{jz.setPointerCapture(e.pointerId);}catch(_){}jid=e.pointerId;jo.x=e.clientX;jo.y=e.clientY;jb.style.left=jk.style.left=jo.x+'px';jb.style.top=jk.style.top=jo.y+'px';jb.classList.remove('idle');jk.classList.remove('idle');audioInit();});
jz.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;e.preventDefault();const dx=e.clientX-jo.x,dy=e.clientY-jo.y,d=Math.hypot(dx,dy),R_=46,m=Math.min(1,d/R_);
  if(d>R_){jo.x=e.clientX-dx/d*R_;jo.y=e.clientY-dy/d*R_;jb.style.left=jo.x+'px';jb.style.top=jo.y+'px';}
  const ndx=e.clientX-jo.x,ndy=e.clientY-jo.y,nd=Math.hypot(ndx,ndy);const mm=Math.min(1,nd/R_);
  if(mm<.14){joy.x=joy.y=0;}else{joy.x=ndx/nd*mm;joy.y=ndy/nd*mm;}
  jk.style.left=(jo.x+ndx)+'px';jk.style.top=(jo.y+ndy)+'px';});
const jup=e=>{if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;joyIdle();};
jz.addEventListener('pointerup',jup);jz.addEventListener('pointercancel',jup);jz.addEventListener('lostpointercapture',jup);
/* mouse follow */
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;}
cv.addEventListener('pointerdown',e=>{audioInit();if(e.pointerType==='mouse'&&e.button===0&&state==='play'){e.preventDefault();mouse.on=true;mpos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(mouse.on&&e.pointerType==='mouse')mpos(e);});
const mup=e=>{if(e.pointerType==='mouse')mouse.on=false;};
cv.addEventListener('pointerup',mup);cv.addEventListener('pointercancel',mup);
/* buttons */
$('go').onclick=startGame;
$('mt').onclick=toggleMute;$('pmt').onclick=toggleMute;$('sn').onclick=toggleSnd;$('chb').onclick=toggleCheer;
$('pr').onclick=()=>{sfx('click');resumeGame();};
$('prs').onclick=()=>{sfx('click');restartStage();};
$('af').onchange=()=>{autoFire=$('af').checked;SAVE.auto=autoFire;store();};

/* loop */
function step(){
  if((step.n=(step.n||0)+1)%3===0)audioTick();
  if(state==='play')update();
  else if(state==='clear'||state==='over'){gt++;R.scroll+=1;updFx();if(state==='over'){R.overT++;if(R.overT===70)showEnd();}if(R.disp<R.score)R.disp=R.score;}
  else if(state==='menu'){menuScroll+=1.3;gt++;}
}
let lastTs=0,acc=0,slow=16;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTs)lastTs=ts;let dt=ts-lastTs;lastTs=ts;if(dt>100)dt=100;acc+=dt;
  slow=slow*.97+dt*.03;if(slow>25&&pq>.5){pq=.5;MAXP=Math.min(MAXP,100);}
  let n=0;while(acc>=16.6&&n<4){step();acc-=16.667;n++;}if(n>=4)acc=0;
  render();
}
/* init */
function init(){
  loadSave();muted=!!SAVE.mute;sndOn=SAVE.snd!==false;cheerOn=SAVE.cheer!==false;
  buildSprites();
  let nm='';try{nm=localStorage.getItem('hubPlayerName')||'';if(!nm)nm=(JSON.parse(localStorage.getItem('sonicMovieSave')||'{}').name)||'';}catch(e){}
  $('nm').value=nm;
  autoFire=SAVE.auto===null?isTouch:!!SAVE.auto;$('af').checked=autoFire;$('ba').classList.toggle('act',autoFire);
  D=DIFF[SAVE.diff];JT=JETS[SAVE.jet];
  if(SAVE.stage>=SAVE.unlocked)SAVE.stage=0;
  $('ctl').textContent=isTouch?'العصا على الشمال للحركة · زر «نار» و«قنبلة» على اليمين · «تلقائي» للإطلاق المتواصل':'الأسهم أو WASD للحركة · مسطرة = نار · B قنبلة · P إيقاف · F إطلاق تلقائي · أو اضغط بالماوس عشان تتبعه';
  addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
  resize();joyIdle();openMenu();
  requestAnimationFrame(frame);
}
window.__j={SFX,renderSfx,cheer,CH,get voices(){return voices;},get AC(){return AC;},get master(){return master;},get LP(){return LP;},SPR,JSPR,render,boom,eshot,pshot,R,P,EN,EB,PB,PU,PT,HZ,SAVE,keys,update,step,beginStage,startGame,pauseGame,resumeGame,useBomb,restartStage,STAGES,BOSSDEF,DIFF,get state(){return state;},set state(v){state=v;},set autoFire(v){autoFire=v;},get pq(){return pq;},JETS};
