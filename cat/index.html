<script>
'use strict';
const W=960,H=540,GY=478,CX=170,PXM=50,STAGE_M=300,FONT='Tahoma, Arial, sans-serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const pvc=$('pv'),pg=pvc.getContext('2d');

/* ---------- responsive ---------- */
const isTouch=(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&matchMedia('(pointer:coarse)').matches);
if(isTouch)document.body.classList.add('touch');
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*s*dpr);
  const nw=Math.max(W,Math.min(pw,1920));
  if(cv.width!==nw){cv.width=nw;cv.height=Math.round(nw*H/W);}
  $('rot').style.display=(isTouch&&vh>vw)?'flex':'none';
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#menu,#pm,#ov'))return;e.preventDefault();},{passive:false});

/* ---------- storage ---------- */
const KEY='hub_cat_v1';
let SAVE={best:0,fish:0,bestM:0,runs:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
let playerName='';
try{playerName=localStorage.getItem('hubPlayerName')||'';}catch(e){}
if(!playerName){try{playerName=(JSON.parse(localStorage.getItem('sonicMovieSave')||'{}')||{}).name||'';}catch(e){}}
$('nm').value=playerName;

/* ---------- audio ---------- */
/* Every synthesized sound is a function (ctx,dest,t,arg)=>durationSeconds, so it can run on a live
   AudioContext or on an OfflineAudioContext (used for QA). One shared noise buffer per sample rate. */
let AC=null,MG=null,muted=false,voiceOn=true,voices=0,purrN=null,ambN=null,birdT=500,purrV=0,purrR=0,ambV=0,lastStepI=0,idleT=0;
const NBC={};
function getNB(ctx){const k=ctx.sampleRate|0;if(!NBC[k]){const b=ctx.createBuffer(1,k,k),d=b.getChannelData(0);for(let i=0;i<k;i++)d[i]=Math.random()*2-1;NBC[k]=b;}return NBC[k];}
function audioInit(){
  try{
    if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
      MG=AC.createGain();MG.gain.value=muted?0:.8;MG.connect(comp);comp.connect(AC.destination);
      purrN=purr(AC,MG,AC.currentTime,0,24);ambN=murmur(AC,MG,AC.currentTime,0);}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function env(ctx,dest,t,dur,vol,att,hold){const g=ctx.createGain();att=att||.004;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);
  if(hold)g.gain.setValueAtTime(vol,t+Math.max(att,dur*hold));g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(dest);return g;}
function osc(ctx,dest,type,t,dur,f0,f1,vol,att){const o=ctx.createOscillator(),g=env(ctx,dest,t,dur,vol,att);o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);o.connect(g);o.start(t);o.stop(t+dur+.02);}
function nz(ctx,dest,t,dur,vol,ft,f0,f1,q,att){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=env(ctx,dest,t,dur,vol,att);s.buffer=getNB(ctx);s.loop=true;
  f.type=ft;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  s.connect(f);f.connect(g);s.start(t,Math.random()*.4);s.stop(t+dur+.02);}
/* animal voice: sawtooth glottal source + vibrato -> two sweeping band-pass formants (+ breath noise) */
function voice(ctx,dest,t,o){
  const dur=o.dur,s=ctx.createOscillator();s.type='sawtooth';
  s.frequency.setValueAtTime(o.p[0][1],t);for(let i=1;i<o.p.length;i++)s.frequency.linearRampToValueAtTime(o.p[i][1],t+o.p[i][0]*dur);
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=o.vr||6;lg.gain.value=o.vib||0;lfo.connect(lg);lg.connect(s.frequency);lfo.start(t);lfo.stop(t+dur+.05);
  const g=env(ctx,dest,t,dur,o.vol,.03,o.hold||0);
  [[o.f1,5,1],[o.f2,7,.7]].forEach(a=>{const b=ctx.createBiquadFilter(),gg=ctx.createGain();b.type='bandpass';b.Q.value=a[1];
    b.frequency.setValueAtTime(a[0][0],t);b.frequency.linearRampToValueAtTime(a[0][1],t+dur*.8);gg.gain.value=a[2];s.connect(b);b.connect(gg);gg.connect(g);});
  s.start(t);s.stop(t+dur+.05);
  if(o.breath)nz(ctx,dest,t,dur,o.breath,'bandpass',3500,2500,1,.02);
  return dur;
}
/* looping noise bed with slow amplitude modulation (purr = ~25 Hz AM of low noise; murmur = slow AM of mid noise) */
function loopNoise(ctx,dest,t,dur,f,q,lpf,rate,depth,mk){
  const s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),mg=ctx.createGain(),am=ctx.createGain(),lfo=ctx.createOscillator(),ld=ctx.createGain(),out=ctx.createGain();
  s.buffer=getNB(ctx);s.loop=true;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;lp.type='lowpass';lp.frequency.value=lpf;mg.gain.value=mk;
  am.gain.value=1-depth;lfo.frequency.value=rate;ld.gain.value=depth;lfo.connect(ld);ld.connect(am.gain);
  out.gain.value=dur?1:0;s.connect(bp);bp.connect(lp);lp.connect(mg);mg.connect(am);am.connect(out);out.connect(dest);
  s.start(t);lfo.start(t);if(dur){s.stop(t+dur);lfo.stop(t+dur);}
  return {out,lfo};
}
function purr(ctx,dest,t,dur,rate){return loopNoise(ctx,dest,t,dur,130,.9,420,rate,.5,3.5);}
function murmur(ctx,dest,t,dur){return loopNoise(ctx,dest,t,dur,380,.5,900,.23,.4,2.5);}
const rr1=()=>.88+Math.random()*.3;
const SND={
  meow:(c,d,t,a)=>{const r=a||rr1();return voice(c,d,t,{dur:.4,p:[[0,380*r],[.3,660*r],[.65,580*r],[1,360*r]],f1:[550,880],f2:[2300,1200],vol:.8,vib:9,vr:7,breath:.03,hold:.5});},
  jump:(c,d,t,a)=>SND.meow(c,d,t,a),
  djump:(c,d,t)=>{const r=rr1();return voice(c,d,t,{dur:.27,p:[[0,620*r],[.4,1050*r],[1,800*r]],f1:[500,720],f2:[2500,1800],vol:1.3,vib:45,vr:24,breath:.02,hold:.4});},
  mew:(c,d,t)=>voice(c,d,t,{dur:.2,p:[[0,820],[.4,1150],[1,920]],f1:[600,820],f2:[2700,2000],vol:1.1,vib:10,vr:8,hold:.4}),
  yelp:(c,d,t)=>{nz(c,d,t,.35,.22,'highpass',4200,3000,.8,.01);return voice(c,d,t,{dur:.28,p:[[0,900],[.2,1350],[1,420]],f1:[850,600],f2:[1900,1400],vol:1.4,vib:12,vr:9,hold:.3});},
  sadMeow:(c,d,t)=>voice(c,d,t,{dur:.9,p:[[0,500],[.25,640],[1,230]],f1:[600,480],f2:[1900,850],vol:.8,vib:14,vr:5,breath:.03,hold:.4}),
  hit:(c,d,t)=>{SND.yelp(c,d,t);osc(c,d,'sine',t,.2,160,60,.35,.003);return .5;},
  crunch:(c,d,t,a)=>{const k=Math.min(a||0,15),f=2000+k*110;for(let i=0;i<3;i++)nz(c,d,t+i*.05,.035,.5,'bandpass',f*(1+i*.12),f*.8,2.2,.002);nz(c,d,t,.1,.25,'lowpass',500,200,.7,.003);return .22;},
  fish:(c,d,t,a)=>SND.crunch(c,d,t,a),
  gulp:(c,d,t)=>{osc(c,d,'sine',t,.1,300,120,.4,.005);osc(c,d,'sine',t+.12,.1,340,130,.35,.005);nz(c,d,t,.2,.08,'lowpass',700,300,.7,.01);return .3;},
  milk:(c,d,t)=>{SND.gulp(c,d,t);SND.mew(c,d,t+.28);return .55;},
  step:(c,d,t)=>{nz(c,d,t,.04,.1,'highpass',1800+Math.random()*400,1200,.7,.002);osc(c,d,'sine',t,.05,150,90,.08,.002);return .08;},
  land:(c,d,t)=>{osc(c,d,'sine',t,.16,140,45,.55,.003);nz(c,d,t,.13,.3,'lowpass',600,150,.7,.002);return .2;},
  slide:(c,d,t)=>{nz(c,d,t,.28,.35,'bandpass',3200,1200,.8,.05);return .3;},
  bark:(c,d,t)=>{[0,.17].forEach(o=>{voice(c,d,t+o,{dur:.13,p:[[0,430],[1,230]],f1:[850,520],f2:[1500,900],vol:1.3,breath:.1,hold:.2});nz(c,d,t+o,.08,.18,'bandpass',1800,900,1,.002);});return .4;},
  crash:(c,d,t)=>{nz(c,d,t,.4,.3,'highpass',2500,1500,.8,.003);nz(c,d,t,.14,.3,'lowpass',900,200,.7,.003);
    for(let i=0;i<6;i++)osc(c,d,'sine',t+i*.035,.14,1800+i*230,1500+i*200,.12,.002);return .55;},
  pot:(c,d,t)=>SND.crash(c,d,t),
  clang:(c,d,t)=>{[520,832,1330,1900].forEach((f,i)=>osc(c,d,'triangle',t,.5-i*.07,f,f*.99,.14,.002));nz(c,d,t,.06,.25,'bandpass',3000,2500,1,.002);return .6;},
  knock:(c,d,t)=>{osc(c,d,'triangle',t,.12,230,110,.5,.002);nz(c,d,t,.09,.3,'lowpass',1000,300,.7,.002);return .15;},
  splash:(c,d,t)=>{nz(c,d,t,.35,.35,'bandpass',1200,3000,.8,.01);nz(c,d,t+.05,.25,.2,'highpass',4000,3000,.8,.01);osc(c,d,'sine',t+.12,.1,400,900,.12,.005);return .45;},
  flap:(c,d,t)=>{nz(c,d,t,.2,.3,'lowpass',700,250,.7,.02);return .25;},
  smash:(c,d,t)=>{nz(c,d,t,.22,.4,'lowpass',3000,300,.7,.002);osc(c,d,'square',t,.12,240,100,.15,.002);return .3;},
  shield:(c,d,t)=>{nz(c,d,t,.22,.2,'highpass',5000,4000,.8,.005);[2000,2600,3200].forEach((f,i)=>osc(c,d,'sine',t+i*.04,.16,f,f*.97,.13,.002));osc(c,d,'triangle',t,.22,900,300,.15,.005);return .35;},
  powMag:(c,d,t)=>{osc(c,d,'sawtooth',t,.25,200,1200,.12,.01);[660,880,1320].forEach((f,i)=>osc(c,d,'sine',t+.1+i*.08,.16,f,f,.18,.005));return .5;},
  powShield:(c,d,t)=>{[784,988,1175,1568].forEach((f,i)=>osc(c,d,'sine',t+i*.06,.55,f,f,.16,.004));return .8;},
  powBoost:(c,d,t)=>{nz(c,d,t,.55,.4,'bandpass',400,3500,1.2,.12);osc(c,d,'sawtooth',t,.5,150,700,.1,.1);osc(c,d,'sine',t+.35,.15,1200,2400,.15,.005);return .7;},
  stage:(c,d,t)=>{[523,659,784,1047,1319].forEach((f,i)=>{osc(c,d,'triangle',t+i*.09,.2,f,f,.2,.004);osc(c,d,'square',t+i*.09,.14,f*2,f*2,.03,.004);});return .7;},
  fanfare:(c,d,t)=>{[523,659,784,1047].forEach((f,i)=>{osc(c,d,'triangle',t+i*.11,.2,f,f,.2,.004);osc(c,d,'square',t+i*.11,.14,f,f,.04,.004);});

  pill(c,W/2-120,12,240,40);txt(c,String(score()),W/2,33,26,'#ffd35a',null,4);
  /* fish + distance (left of center) */
  pill(c,W/2+130,12,100,40);c.save();c.translate(W/2+156,32);c.scale(.55,.55);drawPick(c,{k:'fish',x:0,y:0,t:0});c.restore();txt(c,String(fishN),W/2+205,33,22,'#fff',null,3);
  pill(c,W/2-232,12,100,40);txt(c,Math.floor(dist/PXM)+' م',W/2-182,33,22,'#fff',null,3);
  /* power bars */
  let by=62;
  const bars=[['mag',magT,520,'#ff6a6a'],['shield',shT,720,'#5fc8ff'],['boost',boostT,260,'#ffc23c']];
  for(const b of bars){if(b[1]<=0)continue;
    pill(c,W/2-90,by,180,26);drawIcon(c,b[0],W/2-72,by+13,.62);c.fillStyle='rgba(0,0,0,.35)';rr(c,W/2-50,by+8,126,10,5);c.fill();
    c.fillStyle=b[3];rr(c,W/2-50,by+8,Math.max(6,126*Math.min(1,b[1]/b[2])),10,5);c.fill();by+=30;}
  pill(c,W-150,56,138,28);txt(c,'المرحلة '+(stageIdx+1),W-81,71,18,'#fff',null,3);
  if(combo>=3){txt(c,'x'+combo,W-81,106,26,'#ffd35a',null,4);}
}
function drawTexts(c){
  for(const t of texts){c.globalAlpha=Math.min(1,t.l/20);txt(c,t.s,t.x,t.y,24,t.col,null,5);}
  c.globalAlpha=1;
  if(banner){const k=banner.t,a=Math.min(1,k/20,(150-k)/12),y=H/2-100-(1-Math.min(1,(150-k)/14))*30;
    c.globalAlpha=Math.max(0,a);txt(c,banner.s,W/2,y,46,'#ffd35a',null,8);txt(c,banner.sub,W/2,y+40,26,'#fff',null,5);c.globalAlpha=1;}
}

/* ---------- render ---------- */
let bgT=0,menuDist=0;
function render(){
  const c=g,k=cv.width/W;
  c.setTransform(k,0,0,k,0,0);
  c.save();
  if(shake>0)c.translate(rnd(-shake,shake),rnd(-shake,shake)*.6);
  const d=state==='menu'?menuDist:dist;
  drawBG(c,d,bgT);
  if(state!=='menu'){
    for(const o of obs)drawObs(c,o);
    for(const p of pick)drawPick(c,p);
  }
  const cs=state==='menu'?{state:'run',ph:bgT*.2,sx:1,sy:1,rot:0,h:0,blink:0}:null;
  if(cs)drawCat(c,CX,GY,cs);
  else{
    const ct=cat;let vis=true;if(ct.hurtT>0&&!ct.dead&&(ct.hurtT>>2)%2===0&&ct.hurtT<80)vis=false;
    if(vis){
      if(shT>0){c.fillStyle='rgba(120,210,255,'+(.18+.1*Math.sin(bgT*.2))+')';c.strokeStyle='rgba(180,240,255,.9)';c.lineWidth=3;c.beginPath();c.arc(CX+4,ct.y-30,52,0,TAU);c.fill();c.stroke();}
      if(boostT>0){c.globalAlpha=.4;drawCat(c,CX-30,ct.y,{state:catState(),ph:ct.ph-.5,sx:ct.sx,sy:ct.sy,rot:ct.rot,h:GY-ct.y,blink:0});c.globalAlpha=1;}
      drawCat(c,CX,ct.y,{state:catState(),ph:ct.ph,sx:ct.sx,sy:ct.sy,rot:ct.rot,h:GY-ct.y,blink:(bgT%200)<6?1:0});
    }
  }
  /* particles */
  for(const p of parts){if(!p.a)continue;const a=p.l/p.m;c.globalAlpha=Math.min(1,a*1.5);c.fillStyle=p.col;
    if(p.t===2||p.t===1){c.save();c.translate(p.x,p.y);c.rotate(p.rot+p.l*.1);const r=p.r*(p.t===2?1.6:1);c.beginPath();
      for(let i=0;i<8;i++){const rr_=i%2?r*.45:r,an=i*Math.PI/4;c.lineTo(Math.cos(an)*rr_,Math.sin(an)*rr_);}c.closePath();c.fill();c.restore();}
    else{c.beginPath();c.arc(p.x,p.y,p.r*(p.t===0?(1.6-a*.6):1),0,TAU);c.fill();}}
  c.globalAlpha=1;
  c.restore();
  if(state!=='menu'){drawTexts(c);drawHUD(c);}
  if(flash>0){c.fillStyle='rgba(255,60,60,'+(flash/8*.25)+')';c.fillRect(0,0,W,H);}
  if(boostT>0){c.strokeStyle='rgba(255,220,100,.35)';c.lineWidth=2;for(let i=0;i<8;i++){const y=rnd(40,H-40);c.beginPath();c.moveTo(W,y);c.lineTo(W-rnd(80,200),y);c.stroke();}}
}
function renderPreview(){
  const c=pg,k=pvc.width/230;c.setTransform(k,0,0,k,0,0);
  const gr=c.createLinearGradient(0,0,0,150);gr.addColorStop(0,'#ffcf8a');gr.addColorStop(1,'#fff0cf');c.fillStyle=gr;c.fillRect(0,0,230,150);
  c.fillStyle='#e59f77';c.fillRect(0,40,70,80);c.fillRect(150,20,80,100);c.fillStyle='#4a2c10';c.fillRect(20,60,16,24);c.fillRect(170,40,16,24);c.fillRect(200,70,16,24);
  c.fillStyle='#dcba88';c.fillRect(0,112,230,38);c.fillStyle='#bd9160';c.fillRect(0,122,230,28);
  c.save();c.translate(0,0);drawCat(c,100,128,{state:'run',ph:bgT*.2,sx:1,sy:1,rot:0,h:0,blink:(bgT%200)<6?1:0,scale:1.25});c.restore();
  c.fillStyle='#ffd23c';c.beginPath();c.arc(30,28,12,0,TAU);c.fill();
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=now-last;last=now;if(dt>100)dt=100;if(dt<0)dt=0;
  acc+=dt;let n=0;
  while(acc>=1000/60&&n<5){acc-=1000/60;n++;
    bgT++;
    if(state==='play')step();
    else if(state==='menu'){menuDist+=3.2;if(++idleT>900){idleT=0;cheer('idle');}}
    else if(state==='over'){for(const p of parts){if(!p.a)continue;p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;p.l--;if(p.l<=0)p.a=false;}}
  }
  if(n===5)acc=0;
  try{render();if(state==='menu')renderPreview();}catch(e){console.warn(e);}
  try{audioTick();}catch(e){}
}
setPal(0,0,0);
$('menu').style.display='flex';
requestAnimationFrame(t=>{last=t;loop(t);});
</script>
