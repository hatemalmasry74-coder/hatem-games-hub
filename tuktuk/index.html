<script>

/* ---------- save ---------- */
const KEY='hub_tuktuk_v1';
function loadSave(){
  let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){s={};}
  const d={coins:0,best:0,owned:{tuk0:1},sel:'tuk0',up:{eng:0,str:0,nit:0,tank:0},mute:false,runs:0,trips:0};
  const o=Object.assign({},d,s);
  o.owned=Object.assign({tuk0:1},(s.owned&&typeof s.owned==='object')?s.owned:{});
  o.up=Object.assign({},d.up,(s.up&&typeof s.up==='object')?s.up:{});
  ['coins','best','runs','trips'].forEach(k=>{o[k]=Number(o[k])||0;});
  return o;
}
let SAVE=loadSave();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
function getName(){
  let n='';try{n=localStorage.getItem('hubPlayerName')||'';}catch(e){}
  if(!n){try{n=(JSON.parse(localStorage.getItem('sonicMovieSave')||'{}')||{}).name||'';}catch(e){}}
  return String(n||'').slice(0,14);
}

/* ---------- responsive ---------- */
const isTouch=(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&matchMedia('(pointer:coarse)').matches);

  const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*s*dpr);
  const nw=Math.max(W,Math.min(pw,1920));

  $('rot').style.display=(isTouch&&vh>vw)?'flex':'none';

addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#c,.tb,.sb'))e.preventDefault();},{passive:false});

/* ---------- audio ---------- */
let AC=null,master=null,comp=null,sfxBus=null,engBus=null,ambBus=null,EN=null,AMB=null,muted=!!SAVE.mute,SNDHOOK=null,voices=0;
if(SAVE.sfx===undefined)SAVE.sfx=true;
if(SAVE.cheer===undefined)SAVE.cheer=true;
/* Every synthesized sound is S[name](ctx,dest,t,opts) -> duration, so it can run on an OfflineAudioContext too. */
const NBUF=new WeakMap();
function noiseBuf(c){let b=NBUF.get(c);if(!b){const n=c.sampleRate|0;b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);let s=12345;for(let i=0;i<n;i++){s=(Math.imul(s,1664525)+1013904223)>>>0;d[i]=s/2147483648-1;}NBUF.set(c,b);}return b;}
function osc(c,type,f0,f1,t,dur,vol,d){
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(d);o.start(t);o.stop(t+dur+.02);
}
function nz(c,t,dur,vol,ft,f0,f1,q,d,off){
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf(c);s.loop=true;
  f.type=ft;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(d);s.start(t,(off||0)%.9);s.stop(t+dur+.02);
}

function hornTone(c,d,t,dur,fs,vol,lpf){
  const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=lpf||2400;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+Math.max(.013,dur-.04));g.gain.linearRampToValueAtTime(.0001,t+dur);

const S={
  horn(c,d,t,o){const k=o.kind||'ego',p=o.pitch||1,v=o.vol||1,lp=o.dist?900:2600;
    if(k==='ego'){hornTone(c,d,t,.16,[400*p,500*p],.3*v,lp);hornTone(c,d,t+.22,.2,[400*p,500*p],.3*v,lp);return .5;}

  coin(c,d,t){osc(c,'square',1318,1318,t,.09,.1,d);osc(c,'square',1760,1760,t+.07,.2,.1,d);osc(c,'sine',3520,3520,t+.07,.15,.04,d);return .3;},
  fuel(c,d,t){for(let i=0;i<3;i++){osc(c,'sine',280+i*40,520-i*60,t+i*.11,.1,.22,d);nz(c,t+i*.11,.08,.1,'bandpass',900,500,3,d,i*.2);}return .45;},
  nitro(c,d,t){nz(c,t,.7,.3,'bandpass',400,3500,.9,d,.1);const w=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();w.type='sawtooth';w.frequency.setValueAtTime(300,t);w.frequency.exponentialRampToValueAtTime(1500,t+.8);lp.type='lowpass';lp.frequency.value=1800;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.07,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.85);w.connect(lp);lp.connect(g);g.connect(d);w.start(t);w.stop(t+.9);return .9;},

  const run=async(name,len,build)=>{const c=new OfflineAudioContext(1,Math.ceil(SR*len),SR);const du=build(c,c.destination)||len;const b=await c.startRendering(),x=b.getChannelData(0),n=Math.min(x.length,Math.ceil(SR*Math.min(du,len)));let pk=0,s=0;for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>pk)pk=a;if(i<n)s+=x[i]*x[i];}R.push({name,peak:+pk.toFixed(3),rms:+Math.sqrt(s/n).toFixed(4)});};
  for(const n of Object.keys(S)){
    if(n==='horn'){for(const k of['ego','car','bus','truck','bike','angry'])await run('horn:'+k,2.2,(c,d)=>S.horn(c,d,0,{kind:k}));await run('horn:dist',2.2,(c,d)=>S.horn(c,d,0,{kind:'car',dist:1,vol:.5}));}
    else await run(n,2.4,(c,d)=>S[n](c,d,0,{}));
  }
  for(const k of Object.keys(ENG))for(const m of[[.1,0,0],[.9,1,1]])await run('engine:'+k+':'+m[0],1.2,(c,d)=>{const e=buildEngine(c,d,k);e.set(c,m[0],true,m[1],m[2]);return 1.2;});
  for(const n of Object.keys(AK))await run('amb:'+n,2.5,(c,d)=>{const a=buildAmb(c,d),tg={};tg[n]=1;a.set(c,tg,.01);return 2.5;});
  await run('amb:all',2.5,(c,d)=>{const a=buildAmb(c,d),tg={};for(const n in AK)tg[n]=1;a.set(c,tg,.01);return 2.5;});
  return R;
}

let state='menu';

function release(a){if(a!=='horn')held[a]=0;}
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',' ':'nitro',h:'horn',H:'horn'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  audioInit();
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();return;}
  if((e.key==='m'||e.key==='M')&&!e.repeat){setMuted(!muted);return;}
  const a=KM[e.key];if(a){e.preventDefault();if(!e.repeat)press(a);}
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const a=KM[e.key];if(a)release(a);});

function bindBtn(id,act){const el=$(id),ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}ids.add(e.pointerId);el.classList.add('on');press(act);});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){el.classList.remove('on');release(act);}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
[['bl','left'],['br','right'],['bg','gas'],['bb','brake'],['bn','nitro'],['bh','horn']].forEach(a=>bindBtn(a[0],a[1]));

const _sh={};
function shade(hex,a){const k=hex+a;if(_sh[k])return _sh[k];const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;
  if(a>=0){r+=(255-r)*a;gg+=(255-gg)*a;b+=(255-b)*a;}else{r*=1+a;gg*=1+a;b*=1+a;}return(_sh[k]='rgb('+(r|0)+','+(gg|0)+','+(b|0)+')');}
function rrp(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fRR(c,x,y,w,h,r,col){rrp(c,x,y,w,h,r);c.fillStyle=col;c.fill();}
function fEl(c,x,y,rx,ry,col){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle=col;c.fill();}
function fPoly(c,pts,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=col;c.fill();}
function shadowE(c,rx,ry){fEl(c,0,2,rx,ry,'rgba(0,0,0,.32)');}
function tire(c,x,y,w,h){fRR(c,x,y,w,h,Math.min(5,w/2),'#15151a');fRR(c,x+w*.2,y+2,w*.22,h-4,2,'#34353d');}
function tail(c,x,y,w,h,on){fRR(c,x,y,w,h,3,'#b3171a');fRR(c,x+1,y+1,w-2,h*.5,2,'#ff4a3d');if(on){fEl(c,x+w/2,y+h/2,w*.9,h*.9,'rgba(255,60,40,.28)');}}

/* ---------- world / projection ---------- */
const F=300,HZ=175,GY=452,LW=150,NL=4,RH=300,SL=220,ZLEN=1000,VIEW=1900;
/* 12 stages: z = visual zone (0 city,1 souk,2 bridge,3 desert); tod/wx forced; mix = traffic weight multipliers */
const STG=[
 {n:'وسط البلد',z:0,d:0},

 {n:'طريق الصحراء',z:3,d:.15,mix:{truck:2,cart:1.5},cross:.06,tint:'255,200,120'},
 {n:'الكورنيش ليلاً',z:2,d:.22,tod:.78,mix:{tuk:1.6,bike:1.4}},
 {n:'شارع الهرم',z:3,d:.3,mix:{bus:2,car:1.5},cross:.06,tint:'255,190,100'},
 {n:'ميدان التحرير',z:0,d:.38,mix:{car:2,bus:1.6,bike:1.8},works:.1},
 {n:'العاصمة الجديدة',z:0,d:.46,mix:{car:2.2,truck:1.5},tint:'120,190,255'},
 {n:'الإسكندرية البحرية',z:2,d:.54,mix:{tuk:1.6,cart:1.4},cross:.05,tint:'80,200,220'},
 {n:'الصعيد',z:3,d:.62,mix:{cart:2.5,truck:1.4},cross:.12,tint:'255,170,80'},
 {n:'رحلة المطر',z:1,d:.72,wx:1,mix:{bus:1.6,bike:1.6},works:.08},
 {n:'سباق الفجر',z:0,d:.85,tod:.08,mix:{car:2,truck:1.8,bike:1.8},works:.08,tint:'255,150,110'}];
const stageNo=m=>Math.floor(Math.max(0,m)/ZLEN)+1;
const stgAt=m=>STG[(stageNo(m)-1)%12];
let G=null,SEED=0;                     // game state
let camX=0,curveAmt=0,fogVis=1750,nightA=0,Lgt=1,sandA=0,rainA=0;
const sc=z=>F/(F+(z<-120?-120:z));
const gyz=z=>HZ+(GY-HZ)*sc(z);
const pxx=(x,z)=>W/2+(x-camX)*sc(z)+(z>0?curveAmt*(z/1800)*(z/1800)*320:0);
const pyy=(y,z)=>gyz(z)-y*sc(z);
const zoneAt=m=>stgAt(m).z;
const ZN=[{n:'وسط البلد',gr:['#9b978c','#928e83'],rd:['#4b4e56','#464951'],sk:[0.0]},
          {n:'السوق',gr:['#bf9f70','#b5956a'],rd:['#51494a','#4b4446']},
          {n:'كوبري النيل',gr:['#2f86c4','#2a7bb8'],rd:['#575b65','#52565f']},
          {n:'طريق الصحراء',gr:['#dcb56b','#d3ab60'],rd:['#5a5953','#55544e']}];
const lightList=[];let nLight=0;
function addLight(x,y,r,col){if(nLight<40){const o=lightList[nLight++];o.x=x;o.y=y;o.r=r;o.c=col;}}
for(let i=0;i<40;i++)lightList.push({x:0,y:0,r:0,c:''});

function quadZ(xa,xb,z0,z1,col){
  const y0=gyz(z0),y1=gyz(z1);
  g.fillStyle=col;g.beginPath();g.moveTo(pxx(xa,z0),y0);g.lineTo(pxx(xb,z0),y0);g.lineTo(pxx(xb,z1),y1);g.lineTo(pxx(xa,z1),y1);g.closePath();g.fill();
}
/* vertical quad on plane x=xw spanning z a..b, y ya..yb */
function sideQ(xw,za,zb,ya,yb,col){
  g.fillStyle=col;g.beginPath();g.moveTo(pxx(xw,za),pyy(ya,za));g.lineTo(pxx(xw,zb),pyy(ya,zb));g.lineTo(pxx(xw,zb),pyy(yb,zb));g.lineTo(pxx(xw,za),pyy(yb,za));g.closePath();g.fill();
}
function frontQ(xa,xb,z,ya,yb,col){
  const s=sc(z),y0=pyy(ya,z),y1=pyy(yb,z);
  g.fillStyle=col;g.fillRect(pxx(xa,z),y1,(xb-xa)*s,y0-y1);
}
function topQ(xa,xb,za,zb,y,col){
  g.fillStyle=col;g.beginPath();g.moveTo(pxx(xa,za),pyy(y,za));g.lineTo(pxx(xb,za),pyy(y,za));g.lineTo(pxx(xb,zb),pyy(y,zb));g.lineTo(pxx(xa,zb),pyy(y,zb));g.closePath();g.fill();
}
/* box: side>0 right. xin is inner x (abs), w width outward */
function box(sd,xin,w,z0,d,h,cF,cS,cT){
  if(z0+d<-100)return;
  const a=sd*xin,b=sd*(xin+w),z1=z0+d,zz=Math.max(z0,-100);
  sideQ(a,zz,z1,0,h,cS);
  frontQ(Math.min(a,b),Math.max(a,b),zz,0,h,cF);
  if(h<280)topQ(Math.min(a,b),Math.max(a,b),zz,z1,h,cT||cF);
}
function mix(c1,c2,t){return[c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];}
const rgb=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const PAL=['#d8c7a0','#e0b98a','#c9a9a0','#a9bfc9','#cfcfc4','#d9a98f','#b8c7a4','#e6d5a8'];

function bb(x,z,fn,o){
  const s=sc(z);if(s<.04)return;

function drawPalm(c,o){

  c.strokeStyle='#7a5a34';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(lean*.4,-90,lean,-170);c.stroke();
  c.strokeStyle='#5a4024';c.lineWidth=2;for(let i=1;i<6;i++){const y=-i*28;c.beginPath();c.moveTo(-5+lean*.2*i/5,y);c.lineTo(5+lean*.2*i/5,y);c.stroke();}c.lineCap='butt';
  const cx=lean,cy=-172,sw=Math.sin((G?G.time:0)*1.6+o.ph)*5;

  for(let i=0;i<8;i++){const a=i/8*TAU+o.ph;const dx=Math.cos(a),dy=Math.sin(a)*.45;
    c.fillStyle=i%2?'#2f8a3a':'#3ea04a';
    c.beginPath();c.moveTo(cx,cy);c.quadraticCurveTo(cx+dx*40,cy+dy*30-26+sw,cx+dx*72,cy+dy*30+14+sw);c.quadraticCurveTo(cx+dx*40,cy+dy*30-8,cx,cy+3);c.fill();}
  fEl(c,cx,cy+3,5,5,'#6b4a2a');
}

/* ---------- scenery per slot ---------- */
function windows3(sd,xw,zr,d,h,n,seed,lit){
  const sz=sc(zr);if(sz<.1)return;
  const nr=Math.max(1,Math.floor((h-34)/46)),nc=3,cw=d/nc;
  for(let i=0;i<nr;i++){const ya=26+i*46,yb=ya+26;
    for(let j=0;j<nc;j++){
      const za=zr+8+j*cw,zb=za+cw*.55,r=hsh(seed+j*31,i*7+sd);
      let col=lit&&r>.55?'#ffd77a':'#2b3b4d';
      if(r<.1)col='#4d7a4f';else if(r>.9&&!lit)col='#d7578a';
      sideQ(xw,za,zb,ya,yb,col);
      if(r>.4&&r<.5)sideQ(xw,za-2,zb+2,ya-3,ya,'#c9c4b6');
    }}
}
function sceneLamp(sd,zr){
  bb(sd*(RH+24),zr,drawLamp,{sd});
  if(Lgt<.7){const z=zr,s=sc(z);addLight(pxx(sd*(RH+24)-sd*44,z),pyy(236,z),30*s+4,'255,225,150');}
}
function sceneCity(sd,n,zr,r1,r2,r3){
  if(r1<.1){ // mosque
    const xin=RH+54;
    box(sd,xin,170,zr+16,168,140,'#e6dcc2','#d6caa8','#efe6cf');
    const cxw=sd*(xin+85),zc=zr+100;
    bb(cxw,zc,(c)=>{fEl(c,0,-142,56,42,'#7fb6a6');fEl(c,-18,-160,22,18,'rgba(255,255,255,.25)');c.fillStyle='#d8b64a';c.fillRect(-2,-190,4,18);fEl(c,0,-192,5,5,'#d8b64a');},0);
    // minaret
    box(sd,xin+8,28,zr+24,28,330,'#eee5cd','#d9cdb0');
    bb(sd*(xin+22),zr+38,(c)=>{fRR(c,-24,-348,48,12,4,'#caa24a');fPoly(c,[-14,-348,14,-348,0,-410],'#7fb6a6');c.fillStyle='#caa24a';c.fillRect(-1.5,-424,3,16);},0);
  }else if(r1<.2){
    const sg=pick2(r2);
    bb(sd*(RH+120+r2*80),zr+80,drawSign,{w:150+r3*80|0,h:30+r2*30,col:sg[1],txt:sg[0],tc:'#fff'});
  }else{
    const h=190+r2*380,xin=RH+46+r3*40,w=150+r2*70,col=PAL[(r1*997|0)%PAL.length];
    const D=SL-26,lit=Lgt<.7;
    box(sd,xin,w,zr+4,D,h,shade(col,-.12),shade(col,-.25),col);
    windows3(sd*xin,sd*xin,zr+4,D,h,n*13+sd,n,lit);
    if(h>150){const zz=Math.max(zr+4,-100),s=sc(zz),X=pxx(sd*xin,zz)+(sd>0?1:-1)*(w*.2)*s,Y=pyy(h,zz);
      if(r3>.5){g.fillStyle='#6d7684';g.fillRect(X,Y-26*s,34*s,26*s);g.fillStyle='#8a94a4';g.fillRect(X,Y-26*s,34*s,6*s);}
      else if(r3>.2){g.fillStyle='#e8e8ea';g.beginPath();g.ellipse(X+10*s,Y-10*s,12*s,9*s,0,0,TAU);g.fill();}}
    // sidewalk palm
    if(r2>.45)bb(sd*(RH+34),zr+120,drawPalm,{lean:sd*-18,ph:r1*9});
  }
  sceneLamp(sd,zr);
}
const SIGNS=[['كشري التحرير','#c0392b'],['عصير قصب','#1e8a4c'],['فول وطعمية','#d98a1a'],['موبايلات الأمل','#2a62c8'],['كوفي شوب','#6a3a8a'],['حلويات القاهرة','#d4457a'],['صيدلية الشفاء','#16866e'],['ترمس وحمص','#a0551f']];
function pick2(r){return SIGNS[Math.floor(r*SIGNS.length)%SIGNS.length];}
const AWN=[['#d9382e','#f6f0e0'],['#1f7fb5','#f6f0e0'],['#2b9a4f','#f6f0e0'],['#e6a41c','#7a2a8a'],['#d9382e','#222']];
function sceneSouk(sd,n,zr,r1,r2,r3){
  // tall back building
  if(r2>.3)box(sd,RH+200,170,zr,SL-6,260+r3*140,shade(PAL[(r1*333|0)%8],-.2),shade(PAL[(r1*333|0)%8],-.35),PAL[(r1*333|0)%8]);
  const xin=RH+36,h=100+r2*80,col=PAL[(r3*555|0)%8],D=SL-8;
  box(sd,xin,120,zr+2,D,h,shade(col,-.12),col,shade(col,.1));
  const xw=sd*xin;
  sideQ(xw,zr+14,zr+D-16,0,62,'#2a1d18');           // opening
  sideQ(xw,zr+14,zr+D-16,38,42,'#3d2c22');
  // upper wall: rug + windows
  const aw=AWN[(r1*77|0)%AWN.length];
  if(sc(zr)>.1){
    const stripes=6,zw=(D-16)/stripes;
    for(let i=0;i<stripes;i++){
      const za=zr+8+i*zw,zb=za+zw;
      g.fillStyle=i%2?aw[1]:aw[0];g.beginPath();
      const xo=xw-sd*38;
      g.moveTo(pxx(xw,za),pyy(86,za));g.lineTo(pxx(xw,zb),pyy(86,zb));g.lineTo(pxx(xo,zb),pyy(60,zb));g.lineTo(pxx(xo,za),pyy(60,za));g.closePath();g.fill();
    }
    if(h>125){sideQ(xw,zr+24,zr+60,98,h-14,['#b8483a','#2f6f9a','#c9983a'][(r2*3|0)]);sideQ(xw,zr+30,zr+54,104,h-20,'#f1e2b8');
      sideQ(xw,zr+110,zr+140,100,h-16,'#2b3b4d');sideQ(xw,zr+110,zr+140,100,106,'#4f8a5a');}
    // goods on the street
    const gc=['#f08a1a','#d63a2a','#6cae3a','#f2cf3a'];
    for(let i=0;i<3;i++){const zb=zr+30+i*52+hsh(n,i)*10;box(sd,RH+8,22,zb,28,20+hsh(n,i+4)*8,gc[(n+i)&3],shade(gc[(n+i)&3],-.25),shade(gc[(n+i)&3],.25));}
  }
  if(r1>.7)sceneLamp(sd,zr);
}
function drawBunting(z,seed){
  if(z<-100||sc(z)<.1)return;
  const N=16,xa=-(RH+36),xb=RH+36;
  g.strokeStyle='#3a2d22';g.lineWidth=Math.max(1,2*sc(z));
  g.beginPath();for(let i=0;i<=N;i++){const t=i/N,x=lerp(xa,xb,t),y=265-34*Math.sin(Math.PI*t);const X=pxx(x,z),Y=pyy(y,z);i?g.lineTo(X,Y):g.moveTo(X,Y);}g.stroke();
  const cols=['#d9382e','#f2c230','#2b9a4f','#2a7fc9','#e46a9a'];const s=sc(z);
  for(let i=1;i<N;i++){const t=i/N,x=lerp(xa,xb,t),y=265-34*Math.sin(Math.PI*t);const X=pxx(x,z),Y=pyy(y,z);
    if(i%4===2){g.save();g.translate(X,Y+4*s);g.scale(s,s);drawFanous(g,0,18,13,cols[(i+Math.floor(seed*9))%5]);g.restore();if(Lgt<.7)addLight(X,Y+22*s,40*s+5,'255,200,110');}
    else{g.fillStyle=cols[(i+Math.floor(seed*9))%5];g.beginPath();g.moveTo(X-7*s,Y);g.lineTo(X+7*s,Y);g.lineTo(X,Y+16*s);g.closePath();g.fill();}}
}
function sceneBridge(sd,n,zr,r1,r2,r3){

  if(n%7===0){

  if(dying){G.dying-=dt;if(G.dying<=0){G.dying=0;endGame();return;}}
  // ----- input -----

  G.wind=sandA*Math.sin(G.time*.9)*55;

  G.lean+=(clamp(G.vx/maxLat,-1,1)-G.lean)*Math.min(1,10*dt);
  // ----- advance -----

  const m=G.scroll/20;

  G.shake=Math.max(0,G.shake-60*dt);G.hit=Math.max(0,G.hit-dt);

  }

      say(pick(SHOUT_PASS),'p','#a8ffb8');flash('+'+tot+' جنيه'+(tip?' (بقشيش '+tip+')':''),'#ffe27a');
      for(let i=0;i<16;i++)addP(W/2,GY-90,rnd(-200,200),rnd(-300,-60),rnd(.5,1),rnd(3,5),'#ffd23c',500);
      G.pass=null;G.fareT=rnd(14,22);
    }
  }
  // ----- weather -----

  else if(G.wxForced){G.wxForced=0;G.wx=0;G.wxT=rnd(25,45);}
  else if(G.wxT<=0){
    if(G.wx===0){const des=zoneAt(G.dist)===3;const r=Math.random();G.wx=des?(r<.65?2:r<.8?1:0):(r<.7?1:r<.8?2:0);G.wxT=G.wx?rnd(20,34):rnd(10,20);
      if(G.wx===1)flash('مطرة! الطريق بقى زلق','#9fd4ff');else if(G.wx===2)flash('عاصفة رملية! الرؤية قليلة','#f0cf8a');}
    else{G.wx=0;G.wxT=rnd(40,70);}
  }
  rainA+=((G.wx===1?1:0)-rainA)*Math.min(1,.8*dt);sandA+=((G.wx===2?1:0)-sandA)*Math.min(1,.8*dt);
  // ----- particles -----
  G.smokeT-=dt;
  if(G.smokeT<=0&&!G.over){G.smokeT=G.boost?.03:.1;const sx=pxx(G.x,0)+(G.boost?0:rnd(-6,6));
    addP(sx+(G.veh.kind==='tuk'?-20:-24),GY-14-G.hopY,rnd(-20,10),rnd(10,40),G.boost?.35:.6,G.boost?4:5,G.boost?'#ffb347':'rgba(200,200,200,.6)',0);}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gr*dt;if(p.t>=p.life){G.parts[i]=G.parts[G.parts.length-1];G.parts.pop();}}
  for(let i=G.bub.length-1;i>=0;i--){const b=G.bub[i];b.t+=dt;if(b.t>b.life)G.bub.splice(i,1);}
  if(G.flashT>0)G.flashT-=dt;
  G.bfx+=((G.boost?1:0)-G.bfx)*Math.min(1,8*dt);

      for(let i=0;i<14;i++)addP(W/2,160,rnd(-220,220),rnd(-200,60),rnd(.5,1),rnd(3,5),pick(['#ffd23c','#7fffd4','#fff']),400);}

  if(!dying)ambTick(dt);

function collide(deadOnly){
  const P=G.P,objs=G.objs;
  for(let i=0;i<objs.length;i++){
    const o=objs[i];if(o.hit||o.gone||o.ty==='ghost')continue;
    const T=TY[o.ty];
    const dx=Math.abs(o.x-G.x);
    const ov=o.z<32&&o.z+o.dep>-30;
    if(T.c){
      if(deadOnly)continue;
      if(o.ty==='fare'){
        if(G.pass||!ov)continue;
        const side=o.side;
        if(Math.sign(G.x)===side&&Math.abs(G.x)>RH-LW*.95&&Math.abs(o.z)<90){
          if(G.v<P.cruise*1.2+60){
            o.gone=1;G.fareOut=0;const D=Math.round(rnd(420,780)+diff()*450);
            const Tm=Math.round(D/21+6);G.pass={D,got:G.dist,T:Tm,tleft:Tm,left:D,late:0};
            SND.fare();say('اتفضل يا باشا!','p','#a8ffb8');flash('زبون! وصّله '+D+' متر','#a8ffb8');
          }else if(!o.warned){o.warned=1;say('هدّي شوية يا أسطى!','p','#ffe27a');}
        }
        continue;
      }
      if(ov&&dx<P.hw+T.hw+(o.ty==='coin'?16:0)){
        o.gone=1;
        if(o.ty==='coin'){bank(1);SND.coin();const sx=pxx(o.x,o.z);for(let k=0;k<4;k++)addP(sx,gyz(o.z)-30,rnd(-80,80),rnd(-140,-30),.4,2.5,'#ffe066',300);}
        else{G.fuel=Math.min(1,G.fuel+.34);G.stall=0;SND.fuel();flash('بنزين! +','#9dffa8');say('الله يكرمك!','p','#9dffa8');}
      }
      continue;
    }
    if(T.s){
      if(deadOnly)continue;
      if(o.ty==='bump'){ if(ov&&!o.bumped){o.bumped=1;SND.bump();G.hopVy=clamp(G.v*.55,150,520);G.hopY=.1;G.v*=.85;G.shake=Math.max(G.shake,7);if(Math.random()<.7)say(pick(SHOUT_BUMP),'p','#fff');} }
      else if(ov&&dx<o.hw+P.hw*.8){
        if(o.ty==='pothole'){o.hit=1;G.v*=.62;G.shake=Math.max(G.shake,12);SND.pothole();G.hopVy=180;G.hopY=.1;if(Math.random()<.6)say(pick(SHOUT_HOLE),'p','#fff');}
        else{o.hit=1;o.spin=(Math.random()<.5?-1:1)*8;o.fvy=380;o.vo=G.v*.6;G.v*=.93;SND.click();}
      }
      continue;
    }
    // hostile
    if(ov&&dx<o.hw+P.hw*.92){
      if(G.inv>0||deadOnly){o.ghost=1;continue;}
      if(!o.ghost){crash(o);continue;}
    }
    if(!o.nm&&o.z<0&&!o.ghost&&!deadOnly){
      o.nm=1;const gap=dx-(o.hw+P.hw*.92);
      if(gap>0&&gap<55&&G.v>380&&G.inv<=0)nearMiss(o);
    }
  }
}

/* ---------- main loop ---------- */
let lastT=performance.now(),accT=0,clockReset=false;
const STEP=1000/60;
function step(dt){
  if(state==='play')updateGame(dt);
  else if(state==='menu'&&G){
    G.scroll+=380*dt;G.time+=dt;G.tod=(G.tod+dt/300)%1;camX+=(0-camX)*.05;
    const m=G.scroll/20;curveAmt=(.8*Math.sin(m*.0014)+.4*Math.sin(m*.0037+2))*.6;G.bgx-=curveAmt*380*dt*.02;fogVis=1750;rainA=0;sandA=0;
  }
}
function frame(t){
  requestAnimationFrame(frame);
  if(clockReset){lastT=t;accT=0;clockReset=false;}
  let d=t-lastT;lastT=t;if(d>100)d=100;if(d<0)d=0;accT+=d;
  let n=0;while(accT>=STEP&&n<6){step(1/60);accT-=STEP;n++;}
  if(n>=6)accT=0;
