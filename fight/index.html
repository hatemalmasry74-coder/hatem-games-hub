/* offline test: render every sound and ambience on an OfflineAudioContext */
function audioSelfTest(){
  const SR=22050,out=[];const jobs=[];
  const run=(name,fn,dur)=>{const oc=new OfflineAudioContext(1,Math.floor(SR*dur),SR),ch=buildChain(oc,false),a={c:oc,out:ch.sb,nb:mkNB(oc),live:false};
    fn(a,ch,oc);return oc.startRendering().then(buf=>{const d=buf.getChannelData(0);let s=0,pk=0;const L=Math.min(d.length,Math.floor(SR*.6));for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;if(i<L)s+=d[i]*d[i];}return {name,rms:Math.sqrt(s/L),peak:pk};});};
  for(const n of Object.keys(S)){const ps=n==='hit'?[{lvl:1},{lvl:2,combo:5},{lvl:3,combo:8}]:(n==='grunt'||n==='charge'||n==='blast'?[{id:0},{id:1},{id:2},{id:3}]:[{}]);
    ps.forEach((p,i)=>jobs.push(run(n+(ps.length>1?i:''),(a)=>S[n](a,.02,p),2.6)));}
  AMBF.forEach((f,i)=>jobs.push(run('amb'+i,(a,ch)=>{f(a,0,2.4,ch.ab);},2.5)));
  return Promise.all(jobs);
}

/* ---------- AI ---------- */
function mkAI(L,sp){return {sp:sp||0,L,cool:30,mt:0,mode:'in',seen:0,rt:0,blk:0,retreat:0,idle:0,jump:0,hv:0};}
function aiInp(f,o,ai){
  const inp={l:0,r:0,u:0,d:0,p:0,k:0,s:0};
  const L=ai.L,dx=o.x-f.x,dist=Math.abs(dx),dr=dx>=0?1:-1;
  if(ai.cool>0)ai.cool--;if(ai.mt>0)ai.mt--;if(ai.blk>0)ai.blk--;if(ai.retreat>0)ai.retreat--;
  if(f.st==='hit'||f.st==='ko'){ai.seen=0;return inp;}
  // threat
  const oa=o.st==='atk'&&o.atk&&!o.hitDone?o.atk:null;let thr=0;
  if(oa&&dist<(oa.reach||90)*o.ch.sc+80)thr=1;
  for(const p of G.projs){if(p.own===f)continue;const d=(f.x-p.x)*Math.sign(p.vx);if(d>0&&d<260){thr=2;ai.pd=d;}}
  if(thr&&!ai.seen){ai.seen=thr;ai.rt=Math.round(16-11*L+rnd(0,9));}
  if(!thr)ai.seen=0;
  if(ai.seen&&ai.rt>0){ai.rt--;if(ai.rt===0){
    const r=Math.random();
    if(r<.2+.55*L){ai.blk=thr===2?Math.ceil((ai.pd||100)/8)+10:(oa?Math.max(8,oa.su+oa.ac+4-o.sf):16);}
    else if(thr===2&&f.ground&&r<.2+.55*L+.25){ai.jump=1;}
    else if(r>.8){ai.retreat=14;}}}
  if(ai.blk>0&&f.ground){
    if(!thr&&ai.blk>10)ai.blk=10;
    inp.d=1;return inp;
  }
  if(ai.jump&&f.ground){inp.u=1;ai.jump=0;inp.r=dr>0?1:0;inp.l=dr<0?1:0;return inp;}
  const sc=o.ch.sc;
  const reachP=(ATK.punch.reach+20)*f.ch.sc,reachK=(ATK.kick.reach+20)*f.ch.sc;
  const edgeBack=(f.x-dr*1<LX+30&&dr>0)||(f.x>RX-30&&dr<0);
  const free=f.st==='free';
  ai.idle++;
  if(free){
    const oStun=o.st==='hit',oRec=o.st==='atk'&&o.atk&&o.sf>=o.atk.su+o.atk.ac;
    // special usage
    if(f.en>=COST&&ai.cool<=0){
      const t=f.ch.sp.t,r=Math.random();
      if(t==='proj'&&dist>190&&r<.025+.03*L+ai.sp){inp.s=1;ai.cool=40;ai.idle=0;return inp;}
      if((t==='dash'||t==='flip')&&dist>110&&dist<330&&r<.02+.03*L+ai.sp){inp.s=1;ai.cool=40;ai.idle=0;return inp;}
      if((oStun||oRec)&&dist<150&&r<.15+.3*L+ai.sp*6){inp.s=1;ai.cool=40;ai.idle=0;return inp;}
    }
    // anti air
    if(!o.ground&&dist<110&&L>.25&&Math.random()<.06+.08*L&&ai.cool<=0){inp.p=1;ai.cool=18;ai.idle=0;return inp;}
    // punish / combo
    if((oStun||oRec)&&dist<reachK&&Math.random()<.25+.55*L){
      if(dist<reachP&&Math.random()<.6){inp.p=1;}else inp.k=1;
      ai.cool=Math.round(rnd(2,10)*(1.6-L));ai.idle=0;return inp;
    }
    if(dist<reachK&&ai.cool<=0&&Math.random()<.05+.08*L){
      if(dist<reachP&&Math.random()<.65)inp.p=1;else inp.k=1;
      ai.cool=Math.round(rnd(16,34)-14*L);ai.idle=0;
      if(Math.random()<.2*(1-L)+.1)ai.retreat=10;
      return inp;
    }
    // defensive guess
    if(dist<reachK+20&&o.st==='free'&&Math.random()<.004+.012*L&&ai.cool<=0){ai.blk=Math.round(rnd(12,34));return inp;}
    // movement mode
    if(ai.mt<=0){
      const r=Math.random();ai.mt=Math.round(rnd(20,50));
      if(r<.5+.2*L)ai.mode='in';else if(r<.72)ai.mode='hold';else if(r<.9)ai.mode='back';else ai.mode='jumpin';
      if(ai.idle>140)ai.mode='in';
    }
    if(ai.retreat>0&&!edgeBack){inp.l=dr>0?1:0;inp.r=dr<0?1:0;}
    else if(ai.mode==='in'){if(dist>reachP-8){inp.r=dr>0?1:0;inp.l=dr<0?1:0;}}
    else if(ai.mode==='hold'){const want=130;if(dist>want+14){inp.r=dr>0?1:0;inp.l=dr<0?1:0;}else if(dist<want-14&&!edgeBack){inp.l=dr>0?1:0;inp.r=dr<0?1:0;}}
    else if(ai.mode==='back'){if(!edgeBack&&dist<260){inp.l=dr>0?1:0;inp.r=dr<0?1:0;}else ai.mt=0;}
    else if(ai.mode==='jumpin'){if(f.ground&&dist>130&&dist<300){inp.u=1;inp.r=dr>0?1:0;inp.l=dr<0?1:0;ai.mode='in';ai.air=1;}else ai.mode='in';}
    if(!f.ground&&ai.air&&dist<95&&Math.random()<.3){inp.k=1;ai.air=0;ai.idle=0;}
    if(f.ground)ai.air=0;
    if(ai.idle>260&&dist<reachK){inp.p=1;ai.idle=0;}
  }else if(f.st==='atk'&&f.hitDone){
    const a=f.atk;
    if(a.name==='punch'&&Math.random()<.04+.12*L&&L>.2)inp.k=1;
    else if(a.name!=='sp'&&f.en>=COST&&Math.random()<.08+.2*L)inp.s=1;
    ai.idle=0;
  }
  return inp;
}

    if(G.pt>=100){G.phase='fight';G.pt=0;NET.rin.a=0;sfx('fight');if(G.round===1&&G.mode!=='2p')cheer('start',1);for(const k in KP)KP[k]=false;}
  }
  const zero={l:0,r:0,u:0,d:0,p:0,k:0,s:0};
  for(let i=0;i<2;i++){
    const f=G.f[i],o=G.f[1-i];
    let inp=zero;
    if(fight)inp=G.ctl[i]==='ai'?aiInp(f,o,G.ai[i]):(G.ctl[i]==='remote'?remoteInp():humanInp(i));
    stepF(f,o,inp);
  }
  // body push-apart
  const a=G.f[0],b=G.f[1];
  if(a.ground&&b.ground&&a.st!=='ko'&&b.st!=='ko'){
    const d=b.x-a.x,min=40*Math.max(a.ch.sc,b.ch.sc);
    if(Math.abs(d)<min){const push=(min-Math.abs(d))/2,s=d>=0?1:-1;
      let ax=a.x-s*push,bx=b.x+s*push;
      if(ax<LX){bx+=LX-ax;ax=LX;}if(ax>RX){bx-=ax-RX;ax=RX;}if(bx<LX){ax+=LX-bx;bx=LX;}if(bx>RX){ax-=bx-RX;bx=RX;}
      a.x=ax;b.x=bx;}
  }
  updateProjs();
  if(fight){
    if(a.st==='ko'||b.st==='ko'){}
    else{G.timer--;if(G.timer>0&&G.timer<=600&&G.timer%60===0)sfx('tick',{last:G.timer<=180});
      if(G.timer<=0){
        const ra=a.hp/a.max,rb=b.hp/b.max;
        G.phase='ko';G.pt=0;G.timeup=true;G.winner=Math.abs(ra-rb)<.0005?-1:(ra>rb?0:1);sfx('ko');G.perfect=false;
      }}
  }
  if(G.phase==='ko'){
    const lim=G.timeup?90:140;
    if(G.pt>=lim)enterEnd();
  }else if(G.phase==='end'&&G.pt>=130){
    const w=G.wins;
    if(w[0]>=2||w[1]>=2)matchOver();
    else{G.round++;newRound();}
  }
}

const NET={ws:null,role:'',code:'',st:'',n:0,ping:-1,peerName:'',myName:'',c:[0,3],ready:[false,false],live:false,guest:false,ev:[],snaps:[],off:null,mask:0,hb:0,iq:0,rin:{m:0,a:0},hi:false,pt:0,ps:0,err:''};
const r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
function netSend(o){try{if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));}catch(e){}}

function inviteURL(){try{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',NET.code);const rp=new URLSearchParams(location.search).get('relay');if(rp)u.searchParams.set('relay',rp);return u.toString();}catch(e){return location.href;}}
function netLeave(){const w=NET.ws;NET.ws=null;clearInterval(NET.pt);NET.pt=0;NET.live=false;NET.guest=false;NET.snaps=[];NET.ev=[];NET.st='';NET.n=0;NET.peerName='';NET.role='';NET.hi=false;NET.ready=[false,false];NET.ping=-1;
  try{if(w)w.close();}catch(e){}}
function netOpen(code,role0){
  netLeave();audioInit();
  let n=($('nm').value||'').trim().slice(0,14);NET.myName=n||getName()||'لاعب';if(n){try{localStorage.setItem('hubPlayerName',n);}catch(e){}}
  NET.code=code;NET.st='connecting';NET.c=[M.c[0],M.c[0]===3?0:3];NET.c[0]=NET.c[1]=M.c[0];
  G.state='lobby';G.mode='online';setOverlay('menu',false);setOverlay('res',false);setOverlay('pm',false);setOverlay('lobby',true);

  lobbyUI();

  NET.ws=ws;
  ws.onmessage=ev=>{if(NET.ws!==ws)return;let m;try{m=JSON.parse(ev.data);}catch(e){return;}try{netMsg(m);}catch(e){window.__errs.push('net:'+(e&&e.stack||e));}};
  ws.onerror=()=>{if(NET.ws!==ws)return;if(NET.st==='connecting'){NET.st='error';lobbyUI();}};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;clearInterval(NET.pt);
    const wasErr=NET.st==='connecting'||NET.st==='error'||NET.st==='full';
    if(NET.st!=='full')NET.st=wasErr?'error':'closed';
    if(!wasErr&&(G.state==='play'||(G.state==='result'&&G.mode==='online'&&NET.live)))netGone('انقطع الاتصال','الاتصال بالخادم اتقطع.');
    lobbyUI();};
  NET.pt=setInterval(()=>{NET.ps=performance.now();netSend({t:'ping'});},2000);
}
function netMsg(m){
  const me=meIdx(),pi=1-me;
  switch(m.t){
   case 'hello':NET.role=m.role;NET.n=m.n;NET.st=m.n>=2?'connected':'waiting';NET.c[meIdx()]=M.c[0];NET.ps=performance.now();netSend({t:'ping'});if(m.n>=2)sendHi();lobbyUI();break;
   case 'peer':{const was=NET.n;NET.n=m.n;
     if(m.n>=2){NET.st='connected';sendHi();}
     else{NET.st='waiting';NET.hi=false;NET.peerName='';NET.ready=[false,false];if(was>=2)netPeerLeft();}
     lobbyUI();break;}
   case 'full':NET.st='full';lobbyUI();break;
   case 'pong':NET.ping=Math.round(performance.now()-NET.ps);lobbyUI();break;
   case 'hi':NET.peerName=String(m.name||'لاعب').slice(0,14);NET.c[pi]=m.c|0;lobbyUI();break;
   case 'sel':NET.c[pi]=m.c|0;NET.ready[pi]=!!m.ready;lobbyUI();if(NET.role==='host')maybeStart();break;
   case 'start':if(NET.role==='guest')guestBegin(m.cfg);break;
   case 'in':if(NET.role==='host'&&NET.live){NET.rin.m=m.m|0;NET.rin.a|=m.a|0;}break;
   case 's':if(NET.guest){const a=performance.now(),smp=a-m.ft*16.667;NET.off=NET.off===null?smp:(smp<NET.off?smp:NET.off+(smp-NET.off)*.02);m.rt=a;NET.snaps.push(m);if(NET.snaps.length>40)NET.snaps.shift();}break;
   case 'over':if(NET.guest)guestOver(m.w);break;
  }
}

function remoteInp(){const m=NET.rin.m,p=NET.rin.a;NET.rin.a=0;return {l:m&1?1:0,r:m&2?1:0,u:m&4?1:0,d:m&8?1:0,p:p&16?1:0,k:p&32?1:0,s:p&64?1:0};}
function sendSnap(){
  const f=G.f.map(x=>[r1(x.x),r1(x.y),x.face,x.st,x.sf,x.hp,r1(x.en),x.flash,x.blkFlash,x.ground?1:0,r2(x.spin),r1(x.koAng),x.blocking?1:0,x.walking?1:0,r2(x.wp),x.atk?(x.atk.name==='punch'?1:x.atk.name==='kick'?2:3):0,x.stun,r1(x.vx),r1(x.vy)]);
  const p=G.projs.map(q=>[r1(q.x),r1(q.y),r1(q.vx),q.pt,q.w,q.h,q.t]);
  netSend({t:'s',ft:G.t,ph:G.phase,pt:G.pt,r:G.round,w:G.wins,tm:G.timer,tu:G.timeup?1:0,wn:G.winner,pf:G.perfect?1:0,cn:G.cn,ct:G.ct,sh:r1(G.shake),f,p,e:NET.ev.splice(0)});
}
function evPush(e){if(NET.role==='host'&&NET.live&&G.mode==='online'&&G.state==='play'){NET.ev.push(e);if(NET.ev.length>40)NET.ev.shift();}}
function applyFighter(F,a,b,al){
  F.x=b?lerp(a[0],b[0],al):a[0];F.y=b?lerp(a[1],b[1],al):a[1];
  F.face=a[2];F.st=a[3];F.sf=a[4];F.hp=a[5];F.en=a[6];F.flash=a[7];F.blkFlash=a[8];F.ground=!!a[9];F.spin=a[10];F.koAng=a[11];F.blocking=!!a[12];F.walking=!!a[13];F.wp=a[14];
  F.atk=a[15]===1?ATK.punch:a[15]===2?ATK.kick:a[15]===3?F.ch.sp:null;F.stun=a[16];F.vx=a[17];F.vy=a[18];
}
function netStepGuest(){
  G.t++;updateParts();
  // input -> host
  const i=humanInp(0);let m=0;
  for(const p of ['p1','p2']){if(KH[p+'l'])m|=1;if(KH[p+'r'])m|=2;if(KH[p+'u'])m|=4;if(KH[p+'d'])m|=8;}
  const pm=(i.p?16:0)|(i.k?32:0)|(i.s?64:0);
  NET.hb++;if(m!==NET.mask||pm||NET.hb>=3){NET.mask=m;NET.hb=0;netSend({t:'in',m,a:pm,q:++NET.iq});}
  const S=NET.snaps;
  if(S.length&&NET.off!==null){
    const rf=(performance.now()-NET.off)/16.667-5.5;
    let ai=-1;for(let k=0;k<S.length;k++){const s=S[k];if(s.ft<=rf){ai=k;if(!s.done){s.done=true;for(const e of s.e){if(e[0]==='k')sparks(e[1],e[2],e[3],e[4],!!e[5]);else sfx(e[0],e[1]||{});}if(s.sh>G.shake)G.shake=s.sh*.9;}}else break;}
    if(ai<0)ai=0;
    const a=S[ai],b=S[ai+1],al=b?clamp((rf-a.ft)/Math.max(1,b.ft-a.ft),0,1):0;
    NET.lastA=a;NET.lastDt=rf-a.ft;
    for(let k=0;k<2;k++)applyFighter(G.f[k],a.f[k],b?b.f[k]:null,al);
    G.phase=a.ph;G.pt=a.pt;G.round=a.r;G.wins=a.w;G.timer=a.tm;G.timeup=!!a.tu;G.winner=a.wn;G.perfect=!!a.pf;G.cn=a.cn;G.ct=a.ct;
    G.projs=a.p.map((q,k)=>{const qb=b&&b.p[k];return {x:qb&&qb[3]===q[3]?lerp(q[0],qb[0],al):q[0],y:q[1],vx:q[2],pt:q[3],w:q[4],h:q[5],t:q[6]};});
    while(S.length>3&&S[2].ft<=rf)S.shift();
  }
  for(const f of G.f){f.t++;const tp=targetPose(f);blend(f.pose,tp[0],tp[1]);f.hpd=f.hpd>f.hp?Math.max(f.hp,f.hpd-.35):f.hp;}
}
function showRes(title,msg,b1,act,hideR2){

  setOverlay('res',true);
}
function netGone(title,msg){

const NSTAT={connecting:'جارٍ الاتصال…',waiting:'بانتظار اللاعب الثاني…',connected:'متصل ✓',closed:'انقطع الاتصال',error:'تعذّر الاتصال بالخادم — تأكد من الإنترنت وجرّب تاني',full:'الغرفة ممتلئة'};

  try{const q=new URLSearchParams(location.search).get('room');if(q){const c=q.toUpperCase().replace(/[^A-Z2-9]/g,'');if(c.length>=4&&c.length<=6){M.mode='online';refreshMenu();$('rc').value=c;setTimeout(()=>netOpen(c),50);}}}catch(e){}
}

/* ---------- loop ---------- */
let lastT=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  try{
    if(!lastT)lastT=ts;let dt=ts-lastT;lastT=ts;if(dt>100)dt=100;acc+=dt;
    if(G.state==='play'||G.state==='result'){while(acc>=16.667){if(NET.guest)netStepGuest();else update();acc-=16.667;}}else acc=0;
    if(G.state==='menu'){G.t++;if(G.t%4===0)menuCards();}else if(G.state==='lobby')G.t++;
    render();
  }catch(e){window.__errs.push('loop:'+(e&&e.stack||e));}
}
