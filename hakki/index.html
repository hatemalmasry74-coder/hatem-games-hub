<style>
:root{--bg:#0b0a10;--ink:#e9e4d6;--dim:#9a96a6;--acc:#f2b84b;--pink:#ff7aa8;--teal:#46d1c2;--panel:rgba(14,12,22,.92);--line:rgba(242,184,75,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,"DejaVu Sans",system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#hud.on{display:block}
#obj{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:68%;text-align:center;font-size:15px;color:#f4e9c6;text-shadow:0 1px 3px #000,0 0 8px #000;background:rgba(0,0,0,.28);padding:4px 14px;border-radius:14px}
body.m-boody #obj{background:rgba(255,255,255,.35);color:#3b2a52;text-shadow:none;font-weight:bold}
#ret{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);transition:all .12s}
#ret.act{width:22px;height:22px;margin:-11px 0 0 -11px;background:transparent;border:2px solid #ffe08a}
#ret.claw{width:26px;height:26px;margin:-13px 0 0 -13px;background:transparent;border:2px dashed #7be0ff}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:19px;color:#fff;text-shadow:0 1px 4px #000,0 0 10px #000;text-align:center;opacity:0;transition:opacity .12s;white-space:nowrap}
#prompt.on{opacity:1}
#prompt kbd{display:inline-block;border:1px solid var(--acc);border-radius:5px;padding:0 8px;margin:0 6px;background:rgba(0,0,0,.55);font:inherit;font-size:16px}
#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);max-width:80%;text-align:center;font-size:18px;color:#fff;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:8px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#subs{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:3px;align-items:center;max-width:84%}
#subs div{background:rgba(0,0,0,.66);color:#f0f0f0;padding:3px 14px;border-radius:5px;font-size:16px;line-height:1.5;text-align:center}
#subs div b{color:var(--acc);margin-inline-end:6px}
#inv{position:absolute;top:calc(44px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-width:40%}
#inv span{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:13px;color:#fff}
body.m-boody #inv span{background:rgba(255,255,255,.55);color:#3b2a52;border-color:#f7a8c8}
#bars{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:150px;margin-left:-75px;height:4px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .3s}
#bars i{display:block;height:100%;background:#9fd4ff;width:100%}
#clawh{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;font-size:13px;color:#cfe;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:10px;direction:rtl}
#hbtn{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;display:flex;gap:6px;pointer-events:auto}
.ib{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.5);color:#fff;border-radius:18px;font:inherit;font-size:14px;padding:4px 12px;min-height:34px}
body.m-boody .ib{background:rgba(255,255,255,.6);color:#3b2a52;border-color:#f7a8c8}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%)}
#hide{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;background:repeating-linear-gradient(90deg,rgba(0,0,0,.92) 0 18px,transparent 18px 34px)}
#hide.on{display:block}
#dmg{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;box-shadow:inset 0 0 160px 40px rgba(120,10,30,.8)}
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-start;flex-direction:column;padding:16px;text-align:center;background:rgba(5,4,10,.86);z-index:20;overflow:auto;touch-action:pan-y}
.scr.on{display:flex}
.scr>*{margin-top:auto;margin-bottom:auto}
.box{max-width:620px;width:100%;padding:22px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,.8)}
h1,h2,h3{margin:.2em 0;font-weight:bold}
h1{font-size:clamp(28px,6vw,52px);color:var(--acc);text-shadow:0 0 20px rgba(242,184,75,.4)}
p{line-height:1.9;margin:.5em 0;font-size:17px}
button.b{cursor:pointer;border:1px solid var(--line);background:#2a2236;color:#fff;border-radius:10px;font:inherit;font-size:18px;padding:10px 22px;margin:5px;min-width:150px}
button.b:hover,button.b:focus{background:#4a3a66;outline:none}
button.b.pri{background:#b8791a;border-color:#ffd37a}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:900px}
.card{flex:1 1 300px;min-width:240px;max-width:420px;border-radius:16px;padding:16px;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.card:hover,.card:focus{transform:translateY(-4px) scale(1.02);outline:none}
.card svg{width:150px;height:150px}
.card img.ph{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.card h2{font-size:32px;margin:.1em}
.card p{font-size:15px;margin:.3em 0}
.card.boody{background:linear-gradient(160deg,#fff4c9,#ffc8e0 60%,#a7e8f0);color:#3b2a52;border-color:#fff}
.card.moody{background:linear-gradient(160deg,#241a14,#0d0a0f 70%,#3a1612);color:#f1e2c0;border-color:#6a4a2a}
.tag{display:inline-block;border-radius:12px;padding:1px 10px;font-size:13px;margin:2px;background:rgba(255,255,255,.4)}
.moody .tag{background:rgba(255,200,120,.15)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:17px}
.row select,.row input[type=range]{background:#1b1626;color:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
.row input[type=checkbox]{width:26px;height:26px;accent-color:#f2b84b}
.warn{border:1px solid #a05a2a;background:rgba(60,28,10,.5);border-radius:8px;padding:8px 12px;margin:10px 0;color:#ffd9a0}
/* puzzle modal */
#pz{position:absolute;inset:0;display:none;z-index:15;align-items:center;justify-content:center;background:rgba(0,0,0,.55);touch-action:none}
#pz.on{display:flex}
#pzb{width:min(96vw,760px);max-height:96vh;overflow:auto;border-radius:16px;padding:12px 14px;text-align:center;position:relative}
#pzb.bright{background:linear-gradient(160deg,#fff7d6,#ffe0ee 60%,#d6f3f8);color:#3b2a52;border:4px solid #fff;box-shadow:0 8px 40px rgba(0,0,0,.45)}
#pzb.dark{background:linear-gradient(160deg,#241c18,#141016);color:#f0e2c0;border:2px solid #6a4a2a;box-shadow:0 0 50px rgba(0,0,0,.9)}
#pzb h3{font-size:22px;margin:0 0 4px}
#pzb .sub{font-size:14px;opacity:.85;margin-bottom:6px;min-height:22px}
#pzb canvas,#pzb svg{touch-action:none;max-width:100%}
#pzb .pb{cursor:pointer;border:2px solid currentColor;background:rgba(255,255,255,.2);color:inherit;border-radius:10px;font:inherit;font-size:16px;padding:6px 14px;margin:3px;min-height:40px}
#pzb .pb:hover{background:rgba(255,255,255,.5)}
#pzx{position:absolute;top:6px;left:6px}
.kp{display:grid;grid-template-columns:repeat(6,56px);gap:5px;justify-content:center;margin:6px auto;direction:ltr}
.kp button{height:44px;font-size:20px}
.disp{font:bold 34px monospace;letter-spacing:10px;direction:ltr;background:#0a1a0a;color:#6f6;border-radius:6px;padding:4px 10px;display:inline-block;min-width:200px}
.cards2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc{height:74px;border-radius:8px;background:#7a5cc9;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;border:2px solid #fff}
.mc.up{background:#fff}
.mc.ok{background:#bdf3c8}
#notebook .box{max-height:92vh;overflow:auto;text-align:right}
#notebook .tabs{display:flex;gap:6px;justify-content:center}
#notebook .tabs button.on{background:#b8791a}
.note{background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:16px;line-height:1.7}
.note b{color:var(--acc)}
@media (max-height:480px){#pzb canvas{width:min(300px,52vh)!important;height:auto!important}.mc{height:46px}#pzb h3{font-size:18px}#pzb{padding:8px 10px}.disp{font-size:26px}}
#touch{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
#touch.on{display:block}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#look{position:absolute;right:0;top:12%;width:50%;bottom:0;pointer-events:auto;touch-action:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);color:#fff;font:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.tb:active{background:rgba(255,200,80,.5)}
</style>

<div id="stage">
<canvas id="cv" tabindex="0"></canvas>
<div id="vig"></div><div id="hide"></div><div id="dmg"></div>
<div id="hud">
 <div id="obj"></div>
 <div id="inv"></div>
 <div id="hbtn"><button class="ib" id="b_pause">⏸ إيقاف</button><button class="ib" id="b_note">📓 مفكرة</button><button class="ib" id="b_hint">💡 تلميح</button></div>
 <div id="ret"></div><div id="prompt"></div><div id="toast"></div><div id="subs"></div><div id="bars"><i></i></div><div id="clawh"></div>
</div>
<div id="touch"><div id="joy"><i></i></div><div id="look"></div>
 <button class="tb" id="t_use" style="right:24px;bottom:100px">تفاعل</button>

 <button class="tb" id="t_light" style="right:172px;bottom:40px;width:54px;height:54px">كشاف</button>
</div>
<div id="pz"><div id="pzb"></div></div>
<div id="fade"></div><div id="flash"></div>
<div class="scr" id="scr_gate"></div><div class="scr" id="scr_title"></div><div class="scr" id="scr_settings"></div>
<div class="scr" id="scr_pause"></div><div class="scr" id="scr_end"></div><div class="scr" id="scr_intro"></div><div class="scr" id="notebook"></div>
</div>
<script>

/* ---- util.js ---- */
/* ===== util: helpers, settings, save ===== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF_SET={quality:'auto',volume:0.8,subs:true,vib:true,lowFear:false,noFlash:false,voice:false,sens:1,invY:false,bloom:true,assist:true};
const Set_=Object.assign({},DEF_SET,LS.get('hakki_settings',{}));
function saveSettings(){LS.set('hakki_settings',Set_)}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function vibrate(p){if(Set_.vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

/* ---- tex.js ---- */
/* ===== procedural canvas textures (albedo + roughness) ===== */
const TexLib=(function(){
  const cache={};
  function cv(w,hh){const c=document.createElement('canvas');c.width=w;c.height=hh||w;return c}
  function noise(g,w,hh,amt,seed){const r=mulberry(seed||7);const id=g.getImageData(0,0,w,hh),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0)}
  function rect(g,x,y,w,hh,c){g.fillStyle=c;g.fillRect(x,y,w,hh)}
  const gen={
    woodplank(g,S,p){ // floor planks
      const r=mulberry(3),n=6;for(let i=0;i<n;i++){const l=40+r()*20;rect(g,0,i*S/n,S,S/n,`hsl(${p.h||28},${p.s||40}%,${l*(p.l||1)}%)`);
        for(let k=0;k<40;k++){g.strokeStyle=`rgba(40,20,5,${0.05+r()*0.1})`;g.beginPath();const y=i*S/n+r()*S/n;g.moveTo(0,y);g.bezierCurveTo(S*.3,y+r()*6-3,S*.6,y+r()*6-3,S,y);g.stroke()}
        g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,i*S/n,S,2);g.fillRect(((i*0.37)%1)*S,i*S/n,2,S/n)}
      noise(g,S,S,16,5)},
    checker(g,S,p){const n=p.n||4,a=p.a||'#e8e0d0',b=p.b||'#3a4a5a';for(let y=0;y<n;y++)for(let x=0;x<n;x++)rect(g,x*S/n,y*S/n,S/n,S/n,(x+y)%2?a:b);
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=2;for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*S/n,0);g.lineTo(i*S/n,S);g.moveTo(0,i*S/n);g.lineTo(S,i*S/n);g.stroke()}noise(g,S,S,14,2);
      const r=mulberry(9);for(let i=0;i<30;i++){g.fillStyle=`rgba(30,25,20,${r()*0.12})`;g.beginPath();g.arc(r()*S,r()*S,r()*30+5,0,7);g.fill()}},
    concrete(g,S,p){rect(g,0,0,S,S,p.c||'#6d6d70');const r=mulberry(11);for(let i=0;i<260;i++){{const k=r()>.5?255:0;g.fillStyle=`rgba(${k},${k},${k},${r()*0.06})`;}g.beginPath();g.arc(r()*S,r()*S,r()*26+2,0,7);g.fill()}
      g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;g.strokeRect(0,0,S,S);noise(g,S,S,12,4)},
    wallpaper(g,S,p){rect(g,0,0,S,S,p.a||'#6b5a4a');g.fillStyle=p.b||'#5a4a3c';for(let x=0;x<S;x+=S/8)g.fillRect(x,0,S/16,S);
      g.fillStyle=p.c||'rgba(230,200,140,.35)';const r=mulberry(5);for(let y=S/16;y<S;y+=S/4)for(let x=S/16;x<S;x+=S/4){star(g,x+(Math.floor(y/(S/4))%2)*S/8,y,S/30,5)}noise(g,S,S,20,6);
      const gr=g.createLinearGradient(0,0,0,S);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=gr;g.fillRect(0,0,S,S)},
    polka(g,S,p){rect(g,0,0,S,S,p.a||'#ffd9e8');g.fillStyle=p.b||'#ffffff';for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.beginPath();g.arc(x*S/4+(y%2)*S/8+S/8,y*S/4+S/8,S/16,0,7);g.fill()}noise(g,S,S,8,3)},
    stripes(g,S,p){const n=p.n||8;for(let i=0;i<n;i++)rect(g,i*S/n,0,S/n,S,i%2?p.a:p.b);noise(g,S,S,10,4)},
    metal(g,S,p){rect(g,0,0,S,S,p.c||'#555c63');const r=mulberry(13);for(let i=0;i<200;i++){g.strokeStyle=`rgba(255,255,255,${r()*0.06})`;g.beginPath();const y=r()*S;g.moveTo(0,y);g.lineTo(S,y+r()*4-2);g.stroke()}
      g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;g.strokeRect(2,2,S-4,S-4);g.fillStyle='rgba(0,0,0,.5)';for(const [x,y] of [[10,10],[S-10,10],[10,S-10],[S-10,S-10]]){g.beginPath();g.arc(x,y,4,0,7);g.fill()}noise(g,S,S,16,8)
      for(let i=0;i<14;i++){g.fillStyle=`rgba(120,60,20,${r()*.25})`;g.beginPath();g.arc(r()*S,r()*S,r()*14+3,0,7);g.fill()}},
    rubber(g,S,p){rect(g,0,0,S,S,'#26262a');g.fillStyle='#34343a';for(let y=0;y<S;y+=16)g.fillRect(0,y,S,6);g.fillStyle=p.a||'#e8b020';for(let i=0;i<4;i++)g.fillRect(0,i*S/4,S,3);noise(g,S,S,14,2)},
    crate(g,S,p){rect(g,0,0,S,S,p.c||'#a67c46');const r=mulberry(21);for(let i=0;i<6;i++){g.fillStyle=`hsl(30,${35+r()*15}%,${38+r()*14}%)`;g.fillRect(4,6+i*S/6,S-8,S/6-6)}g.strokeStyle='rgba(30,12,0,.7)';g.lineWidth=6;g.strokeRect(3,3,S-6,S-6);g.beginPath();g.moveTo(3,3);g.lineTo(S-3,S-3);g.moveTo(S-3,3);g.lineTo(3,S-3);g.stroke();noise(g,S,S,18,3)},
    fabric(g,S,p){rect(g,0,0,S,S,p.c||'#c98a8a');g.strokeStyle='rgba(0,0,0,.12)';for(let i=0;i<S;i+=3){g.beginPath();g.moveTo(i,0);g.lineTo(i,S);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(S,i);g.stroke()}
      if(p.plaid){g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<4;i++){g.fillRect(i*S/4,0,10,S);g.fillRect(0,i*S/4,S,10)}}
      if(p.dots){g.fillStyle=p.dots;for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.beginPath();g.arc(x*S/4+S/8,y*S/4+S/8,S/18,0,7);g.fill()}}noise(g,S,S,22,9)},
    plain(g,S,p){rect(g,0,0,S,S,p.c||'#888');noise(g,S,S,p.n==null?10:p.n,1)},

  const st=idx(si,sj);gs[st]=0;hpush(0,st);const hf=(i,j)=>Math.hypot(i-ti,j-tj);

      const n=idx(ni,nj);if(closed[n])continue;const c=gs[cur]+(di&&dj?1.414:1);if(c<gs[n]){gs[n]=c;from[n]=cur;hpush(c+hf(ni,nj),n)}}}

 gears:{title:'آلة التروس',sub:'اجعل المحرك يدير العمود: ضع التروس بحيث تتعشّق أسنانها من اليسار إلى اليمين.',
  build(api){const pegs=[[94,120],[178,120],[250,120],[94,40],[178,205],[250,40]];const motor={x:40,y:120,r:18},out={x:292,y:120,r:18};
   const defs=[{id:'m',r:36,name:'متوسط'},{id:'b',r:48,name:'كبير'},{id:'s',r:24,name:'صغير'}].filter(d=>d.id!=='b'||api.opts.hasBig);
   const place={};let sel=null;const svgw=h('div');svgw.style.cssText='margin:auto;width:340px;max-width:100%';const tray=h('div');tray.style.cssText='display:flex;gap:10px;justify-content:center;margin:6px';api.body.append(svgw,tray);
   function gearPath(cx,cy,r,teeth,rot,col){let d='';const n=teeth*2;for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n,rr=i%2?r:r+5;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1)}return`<path d="${d}Z" fill="${col}" stroke="#222" stroke-width="2"/>`}
   function meshes(a,b){return Math.abs(Math.hypot(a.x-b.x,a.y-b.y)-(a.r+b.r+4))<8}
   function eval_(){const list=[{x:motor.x,y:motor.y,r:motor.r,spin:1},...pegs.map((p,i)=>place[i]?{x:p[0],y:p[1],r:place[i].r,id:i}:null).filter(Boolean),{x:out.x,y:out.y,r:out.r,isOut:1}];
     // jam check

     const seen=new Set([0]),q=[0];while(q.length){const c=q.pop();list.forEach((o,k)=>{if(!seen.has(k)&&meshes(list[c],o)){seen.add(k);o.spin=-list[c].spin;q.push(k)}})}
     return{ok:seen.has(list.length-1),list,seen}}
   function render(spinT){const ev=eval_();let s='<svg viewBox="0 0 340 250" width="340" style="background:rgba(0,0,0,.12);border-radius:10px">';
     pegs.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#777" stroke="#222" data-p="${i}" style="cursor:pointer"/>`;if(!place[i])s+=`<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="rgba(255,255,255,.18)" data-p="${i}" style="cursor:pointer"/>`});

     s+=gearPath(motor.x,motor.y,motor.r,8,rot,'#e0a030');s+=`<text x="${motor.x}" y="${motor.y+5}" text-anchor="middle" font-size="12" fill="#000">محرك</text>`;
     s+=gearPath(out.x,out.y,out.r,8,ev.ok?-rot:0,'#4fa0e0');s+=`<text x="${out.x}" y="${out.y+5}" text-anchor="middle" font-size="12" fill="#000">عمود</text>`;
     pegs.forEach((p,i)=>{const g=place[i];if(g){const o=ev.list.find(l=>l.id===i);const dir=ev.seen&&o&&o.spin?o.spin:0;s+=`<g data-p="${i}" style="cursor:pointer">${gearPath(p[0],p[1],g.r,Math.round(g.r/4.5),dir*(ev.ok||(ev.seen&&ev.seen.size>1)?rot*(18/g.r):0),g.col)}</g>`}});
     s+='</svg>';svgw.innerHTML=s;svgw.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const i=+e.dataset.p;if(place[i]){const g=place[i];delete place[i];sel=null;A.click();upd();return}if(sel){place[i]=sel;sel=null;A.click();upd();const ev2=eval_();if(ev2.jam){api.msg('التروس متصادمة!');api.bad()}else if(ev2.ok){api.msg('المحرك يدير العمود ✔');api.solve()}}else api.msg('اختر ترساً من الأسفل أولاً')});
     return ev}
   const cols={m:'#c0392b',b:'#2c7a4b',s:'#8e44ad'};
   function upd(){tray.innerHTML='';defs.forEach(d=>{if(Object.values(place).some(p=>p.id===d.id))return;const b=h('button','pb',`ترس ${d.name}`);b.style.borderColor=cols[d.id];if(sel&&sel.id===d.id)b.style.outline='3px solid #ffcf3f';b.onclick=()=>{sel={id:d.id,r:d.r,col:cols[d.id]};A.click();upd()};tray.append(b)});render(Puz.gt||0)}

   Puz.defs.gears.cheat=a=>{place[0]={id:'m',r:36,col:cols.m};place[1]={id:'b',r:48,col:cols.b};place[2]={id:'s',r:24,col:cols.s};upd();a.solve()}}},

 cipher:{title:'قفل الرموز',sub:'اللوحة تعرض ٤ رموز. حوّلها إلى أرقام بجدول الشيفرة ثم أدخل الرمز.',
  build(api){const gl=h('div');gl.style.cssText='display:flex;gap:10px;justify-content:center;margin:4px;direction:ltr';CODE_DIGITS.forEach(d=>gl.append(h('div',null,shapeSVG(GLYPHS[d],null,44))));

       if(s<0){g.fillStyle='#ff5c8a';g.fillRect(-18,28,36,32);g.fillStyle='#ffd23f';g.fillRect(-3,28,6,32);g.fillStyle='#000';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText('؟',0,50)}

 /* ---------- marble maze ---------- */
 maze:{title:'متاهة الكرة',sub:'حرّك الكرة بالسحب (أو الأسهم/WASD) إلى الحفرة الذهبية دون الوقوع في الفخاخ.',
  build(api){const N=8,C=44,S=N*C;const r=mulberry(api.opts.seed||21);const cells=[];for(let i=0;i<N*N;i++)cells.push({n:1,s:1,e:1,w:1,v:0});
   const st=[0];cells[0].v=1;while(st.length){const c=st[st.length-1],x=c%N,y=(c/N)|0;const o=[];if(y>0&&!cells[c-N].v)o.push([c-N,'n','s']);if(y<N-1&&!cells[c+N].v)o.push([c+N,'s','n']);if(x>0&&!cells[c-1].v)o.push([c-1,'w','e']);if(x<N-1&&!cells[c+1].v)o.push([c+1,'e','w']);
     if(!o.length){st.pop();continue}const [nx,a,b]=o[(r()*o.length)|0];cells[c][a]=0;cells[nx][b]=0;cells[nx].v=1;st.push(nx)}
   const cv=document.createElement('canvas');cv.width=cv.height=S;cv.style.cssText='width:352px;max-width:100%;display:block;margin:auto;border:4px solid #fff;border-radius:8px;touch-action:none;background:#f7f0d8';const g=cv.getContext('2d');
   const walls=[];for(let i=0;i<N*N;i++){const x=(i%N)*C,y=((i/N)|0)*C;if(cells[i].n)walls.push([x,y,C,0]);if(cells[i].s)walls.push([x,y+C,C,0]);if(cells[i].w)walls.push([x,y,0,C]);if(cells[i].e)walls.push([x+C,y,0,C])}
   const ball={x:C/2,y:C/2,vx:0,vy:0,r:9};const goal={x:S-C/2,y:S-C/2};let tilt={x:0,y:0},drag=null;
   const holes=[];for(let k=0;k<5;k++){const hx=1+((r()*(N-2))|0),hy=1+((r()*(N-2))|0);if((hx+hy)>2)holes.push({x:hx*C+C/2,y:hy*C+C/2})}
   function step(){ball.vx=(ball.vx+tilt.x*0.5)*0.93;ball.vy=(ball.vy+tilt.y*0.5)*0.93;let nx=ball.x+ball.vx,ny=ball.y+ball.vy;
     for(const [x,y,w,hh] of walls){const cx=clamp(nx,x,x+w),cy=clamp(ny,y,y+hh),dx=nx-cx,dy=ny-cy,d=Math.hypot(dx,dy),R=ball.r+2.5;if(d<R){if(d>1e-6){nx=cx+dx/d*R;ny=cy+dy/d*R;const dot=ball.vx*dx/d+ball.vy*dy/d;ball.vx-=1.5*dot*dx/d;ball.vy-=1.5*dot*dy/d}}}
     ball.x=nx;ball.y=ny;for(const hh of holes)if(Math.hypot(ball.x-hh.x,ball.y-hh.y)<9){ball.x=C/2;ball.y=C/2;ball.vx=ball.vy=0;api.bad();api.msg('وقعت الكرة في ثقب! عادت للبداية.')}
     if(Math.hypot(ball.x-goal.x,ball.y-goal.y)<11)api.solve()}
   function draw(){g.clearRect(0,0,S,S);g.fillStyle='#e8f6c8';g.fillRect(0,0,S,S);for(const hh of holes){g.fillStyle='#2a1a3a';g.beginPath();g.arc(hh.x,hh.y,9,0,7);g.fill()}
     g.fillStyle='#f6c431';g.beginPath();g.arc(goal.x,goal.y,12,0,7);g.fill();g.strokeStyle='#8a5a00';g.lineWidth=3;g.stroke();
     g.strokeStyle='#6a3a8a';g.lineWidth=5;g.lineCap='round';g.beginPath();for(const [x,y,w,hh] of walls){g.moveTo(x,y);g.lineTo(x+w,y+hh)}g.stroke();
     const gr=g.createRadialGradient(ball.x-3,ball.y-3,2,ball.x,ball.y,ball.r);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#e04060');g.fillStyle=gr;g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill()}
   cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);mv(e)};const mv=e=>{if(!drag)return;const q=cv.getBoundingClientRect();tilt.x=clamp(((e.clientX-q.left)/q.width-0.5)*2.4,-1,1);tilt.y=clamp(((e.clientY-q.top)/q.height-0.5)*2.4,-1,1)};cv.onpointermove=mv;cv.onpointerup=cv.onpointercancel=()=>{drag=false;tilt.x=tilt.y=0};
   const kd=()=>{if(drag)return;const K=In.keys;tilt.x=((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0);tilt.y=((K.ArrowDown||K.KeyS)?1:0)-((K.ArrowUp||K.KeyW)?1:0)};
   let af=true;const tick=()=>{if(!af)return;kd();if(!api.solved)step();draw();requestAnimationFrame(tick)};tick();Puz.defs.maze.cleanup=()=>{af=false};api.body.append(cv);Puz.defs.maze.cheat=a=>{ball.x=goal.x;ball.y=goal.y}}},
 /* ---------- pipes ---------- */
 pipes:{title:'أنابيب البخار',sub:'أدِر القطع (بلمسة) لتوصيل البخار من المنبع (يسار-أعلى) إلى المصنع (يمين-أسفل).',
  build(api){const N=4,r=mulberry(api.opts.seed||33);// masks: bit0 N,1 E,2 S,3 W
   const grid=[];for(let i=0;i<N*N;i++)grid.push({m:0});let x=0,y=0;const path=[[0,0]];while(x<N-1||y<N-1){if(x<N-1&&(y===N-1||r()<0.5))x++;else y++;path.push([x,y])}
   const bit={N:1,E:2,S:4,W:8};path.forEach(([px,py],i)=>{const c=grid[py*N+px];if(i===0)c.m|=bit.W;else{const [qx,qy]=path[i-1];if(qx<px)c.m|=bit.W;else if(qx>px)c.m|=bit.E;else if(qy<py)c.m|=bit.N;else c.m|=bit.S}
     if(i===path.length-1)c.m|=bit.E;else{const [qx,qy]=path[i+1];if(qx>px)c.m|=bit.E;else if(qx<px)c.m|=bit.W;else if(qy>py)c.m|=bit.S;else c.m|=bit.N}});
   for(let i=0;i<N*N;i++)if(!grid[i].m){const t=r();grid[i].m=t<0.4?5:t<0.8?3:7}

    if(p.state===4){p.t+=dt;p.g.position.y=6.2+Math.sin(p.t*40)*0.05;if(p.t>=0.4){p.state=1;p.t=0}}

};

  if(G.heldC)P.setHeld(G.heldC,BCOL[G.heldC]);
  const c=CPS[G.cp]||CPS.start;P.reset(c.x,c.z,c.yaw);

  $('ret').className='';UI.inv();UI.obj();

    if(!sv){say(mode==='boody'?'star':'sis',mode==='boody'?'مرحباً بودي! أنا نجمة. خذي قفاز ذراع الشد عن المكتب لنبدأ.':'(لاسلكي) مودي... الكشاف وقفاز الشد على المكتب. أسرع...',5)}
    // restore Hakki if mid-toy
    if(mode==='moody'&&F('toyEnter')&&!F('doorC'))Story.hakkiToyResume();
    if(mode==='moody'&&F('asmPower')&&!F('hakkiDown')){Story.startFinale()}

Game.onPuzzleClose=function(){if(Game.state==='puzzle'){Game.state='play';In.enabled=true}};
Game.hakkiAudio=function(dt){
  if(HK.visible&&(HK.state==='hunt')&&HK.dist<16){Game.hb-=dt;if(Game.hb<=0){Game.hb=lerp(0.45,0.9,clamp(HK.dist/16,0,1));A.heart(0.25*(1-HK.dist/20));vibrate(18)}}};
Game.handleInput=function(dt){
  In.poll();
  if(In.take('pause')){Game.pause(true);return}
  if(In.take('note')){Game.state='pause';In.enabled=false;if(document.pointerLockElement)document.exitPointerLock();UI.notebook('play');return}
  if(In.take('hint')){UI.toast(Story.hint(),7000)}
  if(In.take('use')){if(P.hidden)Story.hide(P.hidden.locker);else if(P.tgtUse&&P.tgtUse.act&&!P.frozen){P.tgtUse.act()}}
  if(In.take('claw'))P.fireClaw();
  if(In.take('drop')&&P.held){const c=P.held,b=Story.batts&&Story.batts[c];if(b){b.it.taken=false;setF('got_batt_'+c,false);b.mesh.visible=true;b.mesh.scale.setScalar(1);b.mesh.position.set(...b.home)}P.setHeld(null);G.heldC=null;UI.inv()}};
Game.hud=function(dt){
  const u=P.tgtUse,c=P.tgtClaw||P.tgtDyn;const pr=$('prompt');
  if(u&&!P.hidden){pr.innerHTML=`<kbd>${isTouch?'تفاعل':'E'}</kbd>${typeof u.label==='function'?u.label():u.label}`;pr.classList.add('on')}
  else if(P.hidden){pr.innerHTML='<kbd>E</kbd>اخرج من الصندوق';pr.classList.add('on')}
  else if(c&&P.hasClaw){pr.innerHTML=`<kbd>${isTouch?'ذراع':'Q'}</kbd>${(P.tgtClaw&&typeof P.tgtClaw.label==='function'&&P.tgtClaw.label())||'اسحب بذراع الشد'}`;pr.classList.add('on')}
  else pr.classList.remove('on');
  $('ret').className=u?'act':c&&P.hasClaw?'claw':'';
  const bars=$('bars');if(W.mode==='moody'){bars.style.opacity=P.stamina<0.98?0.8:0;bars.firstChild.style.width=(P.stamina*100)+'%'}
  $('clawh').textContent=P.hasClaw?(P.held?'🔋 في الذراع: '+({blue:'أزرق',red:'أحمر',green:'أخضر'})[P.held]+' (R لإسقاطها)':'🦾 ذراع الشد جاهز'):'';
  Game.qs=(Game.qs||0)+dt;if(Game.qs>0.4){Game.qs=0;UI.obj();UI.inv()}};
Game.loop=function(ts){
  requestAnimationFrame(Game.loop);Game.frame=(Game.frame||0)+1;
  const now=ts/1000;let dt=Math.min(0.05,now-(Game.last||now));Game.last=now;Game.t=now;
  try{
    if(Game.state==='play'){
      Game.handleInput(dt);
      if(Game.state==='play'){P.update(dt,now);Story.tick(dt,now);W.tick(dt,now);
        // audio env
        const hv=HK.visible&&HK.state!=='off'&&HK.state!=='dead';const tens=hv?clamp(1-HK.dist/22,0,1)*(HK.state==='hunt'?1:0.6):0;
        A.update(dt,{tension:Set_.lowFear?tens*0.6:tens,mactive:hv&&W.mode==='moody',mdist:HK.dist,mpos:{x:HK.x,z:HK.z}});
        R.fx.fear=lerp(R.fx.fear,hv&&HK.state==='hunt'?clamp(1-HK.dist/14,0,1):0,1-Math.exp(-dt*3));R.fx.flash=Math.max(0,R.fx.flash-dt*3);
        Game.hud(dt)}
    }else if(Game.state==='puzzle'||Game.state==='dead'){
      if(Game.state==='dead'){W.tick(dt,now);HK.update(dt,now)}A.update(dt,{tension:0});
    }else if(Game.state==='pause'||Game.state==='title'||Game.state==='intro'||Game.state==='end'){
      if(Game.state==='title'||Game.state==='end'){if(W.scene){Cam.rotation.y+=dt*0.05;W.tick(dt*0.3,now)}}
      A.update(dt,{tension:0})}
    if(R.r&&W.scene&&Game.state!=='boot'){R.resize();R.render(now,dt);R.govern(dt)}
  }catch(e){console.error('LOOP',e&&e.stack||e);Game.err=(Game.err||0)+1;if(Game.err>5){Game.state='crash'}}
};
Game.boot=function(){
  if(!R.init()){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:22px">المتصفح لا يدعم WebGL المطلوب للعبة.</div>';return}
  R.q='medium';addEventListener('resize',()=>R.resize());
  $('b_pause').onclick=()=>Game.pause(true);$('b_note').onclick=()=>{if(Game.state!=='play')return;Game.state='pause';In.enabled=false;if(document.pointerLockElement)document.exitPointerLock();UI.notebook('play')};
  $('b_hint').onclick=()=>UI.toast(Story.hint(),7000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&Game.state==='play')Game.pause(true)});
  Game.state='title';UI.title();requestAnimationFrame(Game.loop)};

/* ---- debug.js ---- */
/* ===== debug hooks (only with ?debug=1) ===== */
if(/debug=1/.test(location.search)){
  window.__hk={G,P,W,HK,Story,Puz,R,Game,A,In,UI,F,setF,
    tp(x,z,yaw){P.pos.set(x,0,z);if(yaw!=null)P.yaw=yaw;P.pitch=0},
    flags(o){Object.assign(G.F,o)},
    wait:ms=>new Promise(r=>setTimeout(r,ms)),
    stats(){return{ms:R.stats.ms,fps:R.stats.fps,calls:R.stats.calls,tris:R.stats.tris,q:R.q}},
    look(x,y,z){const dx=x-Cam.position.x,dy=y-Cam.position.y,dz=z-Cam.position.z;P.yaw=Math.atan2(-dx,-dz);P.pitch=Math.atan2(dy,Math.hypot(dx,dz))},
    cheatPuzzle(){return Puz.cheat()},
    giveAll(){P.hasClaw=P.hasLight=true;setF('claw');setF('light');if(P.vm)P.vm.visible=true;UI.inv()},
    // skip ahead: set flags for a given step id and open matching doors
    skipTo(id){const S={lever:['claw','light','got_claw','got_light'],wires:['power'],tokens:['doorA'],sorter:['allTok','tok_star','tok_moon','tok_heart','tok_circle','memory','drawer'],toy:['keyB'],wind:['toyEnter'],melody:['mbWound','safeReached','grate'],plates:['melodyOk'],gear:['vault'],machine:['gear'],cipher:['liftOk'],batt:['doorC','cipherKey','battOrder'],finale:['asmPower']};
      const order=Object.keys(S);const i=order.indexOf(id);for(let k=0;k<=i;k++)for(const f of S[order[k]])setF(f);
      if(G.F.melodyOk)W.setDoor('doorS',true,true);Story.applyFlags();UI.inv()}
  };
}

Game.boot();
</script>
