<head>
<meta charset="utf-8">

<style>
:root{--bg:#0b0a10;--ink:#e9e4d6;--dim:#9a96a6;--acc:#f2b84b;--pink:#ff7aa8;--teal:#46d1c2;--panel:rgba(14,12,22,.92);--line:rgba(242,184,75,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,"DejaVu Sans",system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#hud.on{display:block}
#obj{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:68%;text-align:center;font-size:15px;color:#f4e9c6;text-shadow:0 1px 3px #000,0 0 8px #000;background:rgba(0,0,0,.28);padding:4px 14px;border-radius:14px}
body.m-boody #obj{background:rgba(255,255,255,.35);color:#3b2a52;text-shadow:none;font-weight:bold}
#ret{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);transition:all .12s}
#ret.act{width:22px;height:22px;margin:-11px 0 0 -11px;background:transparent;border:2px solid #ffe08a}
#ret.claw{width:26px;height:26px;margin:-13px 0 0 -13px;background:transparent;border:2px dashed #7be0ff}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:19px;color:#fff;text-shadow:0 1px 4px #000,0 0 10px #000;text-align:center;opacity:0;transition:opacity .12s;white-space:nowrap}
#prompt.on{opacity:1}
#prompt kbd{display:inline-block;border:1px solid var(--acc);border-radius:5px;padding:0 8px;margin:0 6px;background:rgba(0,0,0,.55);font:inherit;font-size:16px}
#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);max-width:80%;text-align:center;font-size:18px;color:#fff;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:8px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#subs{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:3px;align-items:center;max-width:84%}
#subs div{background:rgba(0,0,0,.66);color:#f0f0f0;padding:3px 14px;border-radius:5px;font-size:16px;line-height:1.5;text-align:center}
#subs div b{color:var(--acc);margin-inline-end:6px}
#inv{position:absolute;top:calc(44px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-width:40%}
#inv span{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:13px;color:#fff}
body.m-boody #inv span{background:rgba(255,255,255,.55);color:#3b2a52;border-color:#f7a8c8}
#bars{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:150px;margin-left:-75px;height:4px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .3s}
#bars i{display:block;height:100%;background:#9fd4ff;width:100%}
#clawh{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;font-size:13px;color:#cfe;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:10px;direction:rtl}
#hbtn{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;display:flex;gap:6px;pointer-events:auto}
.ib{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.5);color:#fff;border-radius:18px;font:inherit;font-size:14px;padding:4px 12px;min-height:34px}
body.m-boody .ib{background:rgba(255,255,255,.6);color:#3b2a52;border-color:#f7a8c8}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%)}
#hide{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;background:repeating-linear-gradient(90deg,rgba(0,0,0,.92) 0 18px,transparent 18px 34px)}
#hide.on{display:block}
#dmg{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;box-shadow:inset 0 0 160px 40px rgba(120,10,30,.8)}
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-start;flex-direction:column;padding:16px;text-align:center;background:rgba(5,4,10,.86);z-index:20;overflow:auto;touch-action:pan-y}
.scr.on{display:flex}
.scr>*{margin-top:auto;margin-bottom:auto}
.box{max-width:620px;width:100%;padding:22px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,.8)}
h1,h2,h3{margin:.2em 0;font-weight:bold}
h1{font-size:clamp(28px,6vw,52px);color:var(--acc);text-shadow:0 0 20px rgba(242,184,75,.4)}
p{line-height:1.9;margin:.5em 0;font-size:17px}
button.b{cursor:pointer;border:1px solid var(--line);background:#2a2236;color:#fff;border-radius:10px;font:inherit;font-size:18px;padding:10px 22px;margin:5px;min-width:150px}
button.b:hover,button.b:focus{background:#4a3a66;outline:none}
button.b.pri{background:#b8791a;border-color:#ffd37a}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:900px}
.card{flex:1 1 300px;min-width:240px;max-width:420px;border-radius:16px;padding:16px;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.card:hover,.card:focus{transform:translateY(-4px) scale(1.02);outline:none}
.card svg{width:150px;height:150px}
.card img.ph{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.card h2{font-size:32px;margin:.1em}
.card p{font-size:15px;margin:.3em 0}
.card.boody{background:linear-gradient(160deg,#fff4c9,#ffc8e0 60%,#a7e8f0);color:#3b2a52;border-color:#fff}
.card.moody{background:linear-gradient(160deg,#241a14,#0d0a0f 70%,#3a1612);color:#f1e2c0;border-color:#6a4a2a}
.tag{display:inline-block;border-radius:12px;padding:1px 10px;font-size:13px;margin:2px;background:rgba(255,255,255,.4)}
.moody .tag{background:rgba(255,200,120,.15)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:17px}
.row select,.row input[type=range]{background:#1b1626;color:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
.row input[type=checkbox]{width:26px;height:26px;accent-color:#f2b84b}
.warn{border:1px solid #a05a2a;background:rgba(60,28,10,.5);border-radius:8px;padding:8px 12px;margin:10px 0;color:#ffd9a0}
/* puzzle modal */
#pz{position:absolute;inset:0;display:none;z-index:15;align-items:center;justify-content:center;background:rgba(0,0,0,.55);touch-action:none}
#pz.on{display:flex}
#pzb{width:min(96vw,760px);max-height:96vh;overflow:auto;border-radius:16px;padding:12px 14px;text-align:center;position:relative}
#pzb.bright{background:linear-gradient(160deg,#fff7d6,#ffe0ee 60%,#d6f3f8);color:#3b2a52;border:4px solid #fff;box-shadow:0 8px 40px rgba(0,0,0,.45)}
#pzb.dark{background:linear-gradient(160deg,#241c18,#141016);color:#f0e2c0;border:2px solid #6a4a2a;box-shadow:0 0 50px rgba(0,0,0,.9)}
#pzb h3{font-size:22px;margin:0 0 4px}
#pzb .sub{font-size:14px;opacity:.85;margin-bottom:6px;min-height:22px;padding:0 104px}
@media (max-width:700px){#pzb .sub{padding:0;margin-top:34px}}
#pzb canvas,#pzb svg{touch-action:none;max-width:100%}
#pzb .pb{cursor:pointer;border:2px solid currentColor;background:rgba(255,255,255,.2);color:inherit;border-radius:10px;font:inherit;font-size:16px;padding:6px 14px;margin:3px;min-height:40px}
#pzb .pb:hover{background:rgba(255,255,255,.5)}
#pzx{position:absolute;top:6px;left:6px}
#pzh{position:absolute;top:6px;right:6px}
.kp{display:grid;grid-template-columns:repeat(6,56px);gap:5px;justify-content:center;margin:6px auto;direction:ltr}
.kp button{height:44px;font-size:20px}
.disp{font:bold 34px monospace;letter-spacing:10px;direction:ltr;background:#0a1a0a;color:#6f6;border-radius:6px;padding:4px 10px;display:inline-block;min-width:200px}
.cards2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc{height:74px;border-radius:8px;background:#7a5cc9;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;border:2px solid #fff}
.mc.up{background:#fff}
.mc.ok{background:#bdf3c8}
#notebook .box{max-height:92vh;overflow:auto;text-align:right}
#notebook .tabs{display:flex;gap:6px;justify-content:center}
#notebook .tabs button.on{background:#b8791a}
.note{background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:16px;line-height:1.7}
.note b{color:var(--acc)}
@media (max-height:480px){#pzb canvas{width:min(300px,52vh)!important;height:auto!important}.mc{height:46px}#pzb h3{font-size:18px}#pzb{padding:8px 10px}.disp{font-size:26px}}
#touch{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
#touch.on{display:block}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#look{position:absolute;right:0;top:12%;width:50%;bottom:0;pointer-events:auto;touch-action:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);color:#fff;font:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.tb:active{background:rgba(255,200,80,.5)}
#scr_brief{background:#07060b;padding:10px;justify-content:flex-start;overflow:auto}
#scr_brief.mo{background:radial-gradient(ellipse at 50% 0,#2a0d12 0,#09070b 60%)}
#scr_brief.bo{background:linear-gradient(160deg,#ffe9f3,#d9f3ff 55%,#fff4c9)}
#scr_brief::before{content:"";position:fixed;inset:-20%;pointer-events:none;opacity:.5;animation:bdrift 18s linear infinite}
#scr_brief.mo::before{background:radial-gradient(circle at 20% 30%,rgba(255,40,60,.18),transparent 30%),radial-gradient(circle at 80% 70%,rgba(40,220,200,.14),transparent 30%)}
#scr_brief.bo::before{background:radial-gradient(circle at 20% 30%,rgba(255,120,180,.35),transparent 30%),radial-gradient(circle at 80% 70%,rgba(80,200,255,.35),transparent 30%)}
@keyframes bdrift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,2%) rotate(3deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes bglow{0%,100%{text-shadow:0 0 12px var(--g1),0 0 30px var(--g1)}50%{text-shadow:0 0 22px var(--g2),0 0 52px var(--g2)}}
.bw{position:relative;max-width:940px;width:100%;margin:auto;text-align:center}
.mo .bw{--g1:#ff2a44;--g2:#27e0cc;color:#f1e2c0}.bo .bw{--g1:#ff4fa0;--g2:#38b6ff;color:#3b2a52}
.bcau{display:inline-block;padding:5px 16px;border-radius:8px;font-size:14px;font-weight:bold;margin-bottom:6px}
.mo .bcau{background:#4a0d14;border:1px solid #ff4a5a;color:#ffd0d0}.bo .bcau{background:#fff;border:2px solid #ff9ac6;color:#c2336f}
.bt{font-size:clamp(28px,7vw,56px);font-weight:900;margin:2px 0;animation:bglow 3.5s ease-in-out infinite}
.mo .bt{color:#ff6070}.bo .bt{color:#ff4fa0}
.bsub{font-size:clamp(15px,3.2vw,22px);margin:0 0 8px;opacity:.9}.mo .bsub{color:#7ff0e2}.bo .bsub{color:#1b86c8}
.bst,.bc{border-radius:14px;padding:10px 16px;text-align:right}
.mo .bst,.mo .bc{background:rgba(20,12,18,.8);border:1px solid rgba(255,70,90,.45);box-shadow:0 0 22px rgba(255,40,60,.15)}
.bo .bst,.bo .bc{background:rgba(255,255,255,.75);border:2px solid #fff;box-shadow:0 6px 20px rgba(120,80,180,.2)}
.bst p{margin:.25em 0;font-size:clamp(14px,2.6vw,17px);line-height:1.8}
.bst b,.bc b{padding:0 4px;border-radius:4px}.mo .bst b{color:#ffcf5a}.bo .bst b{color:#d6246e;background:#fff0a8}
.brow{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.brow .bc{flex:1 1 260px}
.bc h3{margin:0 0 4px;font-size:18px}.mo .bc.dg h3{color:#ff5a6a}.mo .bc h3{color:#7ff0e2}.bo .bc h3{color:#e0408a}
.bc p{margin:.2em 0;font-size:14px;line-height:1.7}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{padding:4px 12px;border-radius:999px;font-size:13px}.chip kbd{font:inherit;font-weight:bold;margin-inline-start:5px;padding:0 6px;border-radius:5px}
.mo .chip{background:#1b1620;border:1px solid #3a3040}.mo .chip kbd{background:#2a2030;color:#ffcf5a;border:1px solid #ffcf5a}
.bo .chip{background:#fff;border:2px solid #ffc4de}.bo .chip kbd{background:#ffe27a;color:#3b2a52}
.bgo{font:inherit;font-size:clamp(20px,4vw,28px);font-weight:900;padding:10px 46px;margin:6px;border-radius:14px;cursor:pointer;color:#fff;border:0}
.mo .bgo{background:linear-gradient(180deg,#e0243c,#8a0f20);box-shadow:0 0 26px rgba(255,40,70,.6)}.bo .bgo{background:linear-gradient(180deg,#ff7ab8,#ff4fa0);box-shadow:0 6px 22px rgba(255,79,160,.5)}
.bgo:hover,.bgo:focus{filter:brightness(1.2);outline:3px solid #ffd37a}
.bsm{font:inherit;font-size:16px;padding:9px 18px;margin:6px;border-radius:12px;cursor:pointer}
.mo .bsm{background:#1b1620;color:#e9e4d6;border:1px solid #5a4a60}.bo .bsm{background:#fff;color:#3b2a52;border:2px solid #ffc4de}
.bsm:focus,.bsm:hover{outline:3px solid #ffd37a}
@media (max-height:600px){.bst p{line-height:1.55}.bw{zoom:.93}}
@media (max-height:480px){.bt{font-size:26px}.bst p{font-size:13px;line-height:1.5}.bc p{font-size:12px;line-height:1.4}.bc h3{font-size:15px}.brow{margin:5px 0}.chip{font-size:11px;padding:2px 8px}.bgo{padding:6px 34px;font-size:19px}}
#blackout{position:absolute;inset:0;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}
#blackout.on{opacity:1}
#subs div.cue{background:rgba(10,30,50,.72);color:#9fd4ff;font-size:14px;font-style:italic}
body.m-boody #subs div.cue{background:rgba(255,255,255,.7);color:#3b2a52}
.chs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.chb{cursor:pointer;border:2px solid var(--line);background:#1b1626;color:#e9e4d6;border-radius:12px;font:inherit;font-size:16px;padding:8px 16px}
.chb.on{background:#b8791a;border-color:#ffd37a;color:#fff}
.chb:hover{filter:brightness(1.2)}
#ecap{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:min(86vw,720px);text-align:center;font-size:clamp(18px,3.2vw,28px);line-height:1.8;color:#fff;text-shadow:0 2px 6px #000,0 0 18px #000;background:rgba(0,0,0,.45);padding:10px 22px;border-radius:14px;opacity:0;transition:opacity .7s;pointer-events:none;z-index:12}
body.m-boody #ecap{background:rgba(255,255,255,.55);color:#3b2a52;text-shadow:none}
#eskip{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:13;display:none}
.credits{max-width:640px;height:min(88vh,620px);display:flex;flex-direction:column;overflow:hidden}
.crwrap{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.crroll{position:absolute;left:0;right:0;top:100%;animation:crup 30s linear forwards}
.crroll p{font-size:clamp(16px,2.8vw,22px);margin:.2em 0}.crroll p:first-child{font-size:clamp(26px,5vw,40px);color:var(--acc);font-weight:900}.crroll p.gap{height:18px}
@keyframes crup{from{transform:translateY(0)}to{transform:translateY(-130%)}}
.crbtns{opacity:0;max-height:0;overflow:hidden;transition:opacity 1s,max-height .6s}.crbtns.show{opacity:1;max-height:420px}
.crbtns .b{min-width:200px;margin:4px}
</style>

<script>

/* ===== lock: family password gate (photos are AES-GCM encrypted; the game boots only after unlock) ===== */
const Lock=(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function tryPw(pw){
    const L=window.__ENC;if(!L)return true;pw=pw.normalize('NFC').trim().toLowerCase();
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    for(const E of L){try{
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));
      window.__PHOTO=JSON.parse(new TextDecoder().decode(pt));return true;}catch(e){}}
    throw new Error('bad');
  }
  function run(go){
    if(!window.__ENC||!(window.crypto&&crypto.subtle)){go();return}
    const st=document.createElement('style');st.textContent='#lk{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#07060b;color:#e9e4d6;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl}#lk .bx{width:min(92vw,380px);text-align:center;padding:26px;border:1px solid rgba(242,184,75,.4);border-radius:16px;background:#12101b}#lk h2{margin:0 0 6px;color:#f2b84b}#lk p{margin:6px 0 14px;color:#9a96a6;font-size:15px}#lk input{width:100%;padding:12px;font-size:20px;text-align:center;border-radius:10px;border:1px solid #4a4360;background:#0b0a10;color:#fff;direction:ltr}#lk button{margin-top:12px;width:100%;padding:12px;font-size:18px;font-weight:bold;border:0;border-radius:10px;background:#f2b84b;color:#1a1306}#lk .er{min-height:22px;color:#ff7a7a;margin-top:8px;font-size:14px}';
    document.head.appendChild(st);
    const d=document.createElement('div');d.id='lk';d.innerHTML='<div class="bx"><h2>🔒 مودي بودي هاكي واكي</h2><p>اكتب كلمة السر للدخول</p><input id="lkp" type="password" autocomplete="off" autocapitalize="off" placeholder="كلمة السر"><button id="lkb">دخول</button><div class="er" id="lke"></div></div>';
    document.body.appendChild(d);
    const inp=d.querySelector('#lkp'),er=d.querySelector('#lke'),btn=d.querySelector('#lkb');
    let busy=false;
    async function submit(pw,remember){
      if(busy||!pw)return;busy=true;er.textContent='جارٍ التحقق…';
      try{await tryPw(pw);try{if(remember!==false)localStorage.setItem('hakki_pw',pw)}catch(e){}d.remove();st.remove();go();}
      catch(e){er.textContent='كلمة السر غير صحيحة';try{localStorage.removeItem('hakki_pw')}catch(_){}}
      busy=false;
    }
    btn.onclick=()=>submit(inp.value.trim());
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit(inp.value.trim());e.stopPropagation()});
    inp.addEventListener('keyup',e=>e.stopPropagation());
    let saved=null;try{saved=localStorage.getItem('hakki_pw')}catch(e){}
    if(saved)submit(saved,false);else setTimeout(()=>inp.focus(),50);
  }
  return {run};
})();

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF_SET={quality:'auto',volume:0.8,subs:true,vib:true,lowFear:false,noFlash:false,voice:false,sens:1,invY:false,bloom:true,assist:true,cues:true};

  const x=g.x0+(ix+0.5)*g.cs,z=g.z0+(iz+0.5)*g.cs;for(const s of W.doorSolids){if(s.disabled)continue;const cx=clamp(x,s.x0,s.x1),cz=clamp(z,s.z0,s.z1);if((x-cx)*(x-cx)+(z-cz)*(z-cz)<0.4)return true}return false};

    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(W.cellBlocked(ni,nj))continue;if(di&&dj&&(W.cellBlocked(ci+di,cj)||W.cellBlocked(ci,cj+dj)))continue;

  build(api){const pegs=[[94,120],[178,120],[250,120],[94,40],[178,205],[250,40]];const motor={x:40,y:120,r:18},out={x:292,y:120,r:18};

P2.SOKO=['#######','#  .# #','# $$  #','#  @ .#','#  #  #','#######'];
P2.sokoParse=function(){const rows=P2.SOKO,H=rows.length,Wd=rows[0].length;const walls=new Set(),tg=[],cr=[];let p=null;
  rows.forEach((r,y)=>[...r].forEach((c,x)=>{const k=y*Wd+x;if(c==='#')walls.add(k);if(c==='.'||c==='*')tg.push(k);if(c==='$'||c==='*')cr.push(k);if(c==='@')p=k}));return{W:Wd,H,walls,tg,cr,p}};
P2.sokoSolve=function(lv,pos,crates){ // BFS -> string of moves 'udlr' or null
  const Wd=lv.W,key=(p,c)=>p+'|'+c.slice().sort((a,b)=>a-b).join(','),D={u:-Wd,d:Wd,l:-1,r:1};const tgt=new Set(lv.tg);
  const start={p:pos,c:crates.slice(),m:''},seen=new Set([key(pos,crates)]),q=[start];
  while(q.length){const s=q.shift();if(s.c.every(c=>tgt.has(c)))return s.m;if(s.m.length>60)continue;
    for(const d in D){const np=s.p+D[d];if(lv.walls.has(np)||(d==='l'&&s.p%Wd===0)||(d==='r'&&s.p%Wd===Wd-1))continue;let c=s.c;const ci=c.indexOf(np);
      if(ci>=0){const nc=np+D[d];if(lv.walls.has(nc)||c.includes(nc))continue;c=c.slice();c[ci]=nc}
      const k=key(np,c);if(seen.has(k))continue;seen.add(k);q.push({p:np,c,m:s.m+d})}}
  return null};

  const M=P2.MIR,pts=[],fix={};M.fixed.forEach(f=>fix[f.c+','+f.r]=f.t);let x=-1,y=M.start.r,dx=1,dy=0;pts.push([x,y]);let hit=false;

P2.weaveMake=function(seed){const r=mulberry(seed||5),T=P2.WEAVE_T[(seed||0)%P2.WEAVE_T.length].slice();const sol=new Set();while(sol.size<5)sol.add((r()*16)|0);const g=T.slice();sol.forEach(i=>P2.weaveClick(g,i));if(g.every((v,i)=>v===T[i]))return P2.weaveMake((seed||5)+1);return{target:T,init:g,sol:[...sol]}};

P2.shape=function(s,x,y,w,hh,fill,stroke,dash){const st=`fill="${fill}" stroke="${stroke}" stroke-width="2.5"${dash?' stroke-dasharray="5 4"':''}`;
  const L=x-w/2,T=y-hh/2;
  switch(s){case 'ell':return `<ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${hh/2}" ${st}/>`;case 'circ':return `<circle cx="${x}" cy="${y}" r="${w/2}" ${st}/>`;
   case 'rect':return `<rect x="${L}" y="${T}" width="${w}" height="${hh}" ${st}/>`;case 'rrect':return `<rect x="${L}" y="${T}" width="${w}" height="${hh}" rx="10" ${st}/>`;
   case 'tri':return `<polygon points="${x+w/2},${T} ${x+w/2},${T+hh} ${L},${y}" ${st}/>`;
   case 'star':{let p='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?w*0.22:w*0.5;p+=(x+Math.cos(a)*r).toFixed(1)+','+(y+Math.sin(a)*r).toFixed(1)+' '}return `<polygon points="${p}" ${st}/>`}
   case 'coil':{let d='';for(let i=0;i<=8;i++)d+=(i?'L':'M')+(L+i*w/8)+','+(i%2?T:T+hh);return `<path d="${d}" fill="none" stroke="${dash?stroke:fill}" stroke-width="5" ${dash?'stroke-dasharray="5 4"':''}/>`}
   case 'key':return `<ellipse cx="${x-w*0.25}" cy="${y}" rx="${w*0.24}" ry="${hh/2}" ${st}/><ellipse cx="${x+w*0.25}" cy="${y}" rx="${w*0.24}" ry="${hh/2}" ${st}/><rect x="${x-4}" y="${y}" width="8" height="${hh*0.7}" ${st}/>`;
   case 'legs':{let o='';for(let i=0;i<3;i++){const lx=x-w/2+w*(i+0.5)/3;o+=`<rect x="${lx-18}" y="${T}" width="36" height="${hh}" rx="4" ${st} transform="rotate(${(i-1)*12} ${lx} ${y})"/>`}return o}
   case 'arms':return `<rect x="${L}" y="${T}" width="${w*0.2}" height="${hh}" rx="6" ${st}/><rect x="${L+w*0.8}" y="${T}" width="${w*0.2}" height="${hh}" rx="6" ${st}/>`;
   case 'ant':return `<rect x="${x-2}" y="${T+8}" width="4" height="${hh-8}" ${st}/><circle cx="${x}" cy="${T+6}" r="7" ${st}/>`}
  return ''};

  build(api){const lv=P2.sokoParse(),C=52,Wd=lv.W,Hh=lv.H;let pos=lv.p,cr=lv.cr.slice(),hist=[],moves=0;const cv=document.createElement('canvas');cv.width=Wd*C;cv.height=Hh*C;cv.style.cssText='display:block;margin:6px auto;border-radius:8px;border:3px solid '+(api.theme==='bright'?'#fff':'#6a4a2a');api.body.append(cv);const g=cv.getContext('2d');
   const info=h('div','sub','الحركات: 0');api.body.append(info);
   function draw(){const B=api.theme==='bright';g.fillStyle=B?'#f6e8c8':'#22201e';g.fillRect(0,0,cv.width,cv.height);
    for(let y=0;y<Hh;y++)for(let x=0;x<Wd;x++){const k=y*Wd+x,px=x*C,py=y*C;

      else{g.fillStyle=(x+y)%2?(B?'#fff3d4':'#2b2826'):(B?'#ffe9b8':'#262322');g.fillRect(px,py,C,C)}
      if(lv.tg.includes(k)){g.strokeStyle='#ffcf3f';g.lineWidth=4;g.strokeRect(px+8,py+8,C-16,C-16);g.beginPath();g.moveTo(px+8,py+8);g.lineTo(px+C-8,py+C-8);g.moveTo(px+C-8,py+8);g.lineTo(px+8,py+C-8);g.stroke();g.lineWidth=1}}
    for(const c of cr){const x=(c%Wd)*C,y=((c/Wd)|0)*C,on=lv.tg.includes(c);g.fillStyle=on?'#6fcf5a':'#b07a3a';g.fillRect(x+5,y+5,C-10,C-10);g.strokeStyle='#4a2a0a';g.lineWidth=3;g.strokeRect(x+5,y+5,C-10,C-10);g.beginPath();g.moveTo(x+5,y+5);g.lineTo(x+C-5,y+C-5);g.moveTo(x+C-5,y+5);g.lineTo(x+5,y+C-5);g.stroke();g.lineWidth=1}
    const px=(pos%Wd)*C+C/2,py=((pos/Wd)|0)*C+C/2;g.fillStyle=B?'#ff6f9c':'#d8a040';g.beginPath();g.arc(px,py,16,0,7);g.fill();g.strokeStyle='#000';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.fillRect(px-8,py-5,6,6);g.fillRect(px+2,py-5,6,6);g.fillStyle='#000';g.fillRect(px-6,py-3,3,3);g.fillRect(px+4,py-3,3,3);g.lineWidth=1}
   const D={u:-Wd,d:Wd,l:-1,r:1};
   function move(d,rec){if(api.solved)return false;const np=pos+D[d];if(lv.walls.has(np)||(d==='l'&&pos%Wd===0)||(d==='r'&&pos%Wd===Wd-1)){return false}const ci=cr.indexOf(np);let prev={pos,cr:cr.slice()};
     if(ci>=0){const nc=np+D[d];if(lv.walls.has(nc)||cr.includes(nc)){api.bad();return false}cr[ci]=nc;A.thud(null,0.12)}else A.click();
     if(rec!==false)hist.push(prev);pos=np;moves++;info.textContent='الحركات: '+moves;draw();if(cr.every(c=>lv.tg.includes(c))){draw();api.solve()}return true}
   function undo(){const p=hist.pop();if(!p)return;pos=p.pos;cr=p.cr;moves=Math.max(0,moves-1);info.textContent='الحركات: '+moves;draw()}

   [['',''],['↑','u'],['',''],['←','l'],['↓','d'],['→','r']].forEach(([t,d])=>{if(!t){pad.append(h('span'));return}const b=h('button','pb',t);b.onclick=()=>move(d);pad.append(b)});
   const row=h('div');const ub=h('button','pb','↶ تراجع'),rb=h('button','pb','⟲ إعادة');ub.onclick=undo;rb.onclick=reset;row.append(ub,rb);api.body.append(pad,row);
   const kd=e=>{if(!Puz.active||Puz.active.id!=='crates')return;const m={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[e.code];if(m){move(m);e.preventDefault()}else if(e.code==='KeyZ')undo()};

 mirrors:{title:'مرايا الضوء',sub:'اضغط على المرآة لتبديل اتجاهها (/ أو \\) حتى يصل شعاع المصباح إلى العدسة على اليمين.',
  hint(api){const M=P2.MIR;const wrong=M.mirrors.filter(m=>!m.decoy&&api.state.ori[m.c+','+m.r]!==m.sol)[0];return wrong?`تلميح: المرآة في العمود ${wrong.c+1} والصف ${wrong.r+1} ليست في الوضع الصحيح.`:'كل المرايا الأساسية صحيحة.'},
  build(api){const M=P2.MIR,C=44,Wd=M.cols*C+80,Hh=M.rows*C+8;const ori={};M.mirrors.forEach(m=>ori[m.c+','+m.r]=m.init);
   const cv=document.createElement('canvas');cv.width=Wd;cv.height=Hh;cv.style.cssText='display:block;margin:6px auto;border-radius:8px;background:'+(api.theme==='bright'?'#fff6dc':'#14110f')+';width:'+Wd+'px;max-width:100%;cursor:pointer';api.body.append(cv);const g=cv.getContext('2d'),ox=40,oy=4;
   function draw(){const B=api.theme==='bright';g.clearRect(0,0,Wd,Hh);g.fillStyle=B?'#fff6dc':'#14110f';g.fillRect(0,0,Wd,Hh);
    for(let y=0;y<M.rows;y++)for(let x=0;x<M.cols;x++){g.strokeStyle=B?'rgba(120,80,40,.2)':'rgba(255,255,255,.08)';g.strokeRect(ox+x*C+0.5,oy+y*C+0.5,C-1,C-1)}
    // lamp + lens
    g.fillStyle='#ffcf3f';g.beginPath();g.arc(ox-18,oy+M.start.r*C+C/2,13,0,7);g.fill();g.strokeStyle='#8a5a00';g.lineWidth=3;g.stroke();
    const tr=P2.mirTrace(ori);g.fillStyle=tr.hit?'#9bff9b':(B?'#c9b79a':'#3a3a3a');g.beginPath();g.arc(ox+M.cols*C+18,oy+M.target.r*C+C/2,14,0,7);g.fill();g.strokeStyle=tr.hit?'#fff':'#777';g.stroke();g.lineWidth=1;
    for(const f of M.fixed){const x=ox+f.c*C,y=oy+f.r*C;if(f.t==='#'){g.fillStyle=B?'#b8a0d8':'#4a4440';g.fillRect(x+3,y+3,C-6,C-6)}else mirrorDraw(x,y,f.t,true)}
    function mirrorDraw(x,y,t,fixed){g.strokeStyle=fixed?'#8a8a8a':'#7fe0ff';g.lineWidth=fixed?5:7;g.lineCap='round';g.beginPath();if(t==='/'){g.moveTo(x+8,y+C-8);g.lineTo(x+C-8,y+8)}else{g.moveTo(x+8,y+8);g.lineTo(x+C-8,y+C-8)}g.stroke();g.lineWidth=1}
    for(const m of M.mirrors){const x=ox+m.c*C,y=oy+m.r*C;g.fillStyle=B?'rgba(120,200,255,.25)':'rgba(120,200,255,.12)';g.fillRect(x+2,y+2,C-4,C-4);mirrorDraw(x,y,ori[m.c+','+m.r],false)}
    // beam
    g.strokeStyle='rgba(255,230,120,.35)';g.lineWidth=11;g.lineJoin='round';g.beginPath();tr.pts.forEach((p,i)=>{const px=ox+(p[0]+0.5)*C,py=oy+(p[1]+0.5)*C;i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
    g.strokeStyle='#fff7c0';g.lineWidth=3;g.beginPath();tr.pts.forEach((p,i)=>{const px=ox+(p[0]+0.5)*C,py=oy+(p[1]+0.5)*C;i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();g.lineWidth=1;return tr.hit}
   cv.onclick=e=>{if(api.solved)return;const q=cv.getBoundingClientRect(),px=(e.clientX-q.left)*Wd/q.width-ox,py=(e.clientY-q.top)*Hh/q.height-oy,c=Math.floor(px/C),r=Math.floor(py/C);const k=c+','+r;if(ori[k]){ori[k]=ori[k]==='/'?'\\':'/';A.click();if(draw()){api.solve()}}};
   api.state={ori,toggle(c,r){const k=c+','+r;if(ori[k]){ori[k]=ori[k]==='/'?'\\':'/';if(draw())api.solve()}},trace:()=>P2.mirTrace(ori),cellPos(c,r){const q=cv.getBoundingClientRect();return[q.left+(ox+(c+0.5)*C)*q.width/Wd,q.top+(oy+(r+0.5)*C)*q.height/Hh]}};draw();
   Puz.defs.mirrors.cheat=a=>{M.mirrors.forEach(m=>ori[m.c+','+m.r]=m.sol);draw();a.solve()}}},
 /* ---------- pneumatic tubes ---------- */
 tubes:{title:'الأنبوب الهوائي',sub:'أرسل الكبسولات الأربع بالترتيب الصحيح حسب المفاتيح المكتوبة. اضغط الكبسولة لتدخل الأنبوب، واضغط خانة لإعادتها.',

 valves:{title:'صمامات الغلاية',sub:'ثلاثة صمامات (٠–٤). كل عدّاد يجمع صمامين. اضبط الصمامات حتى تصل الإبر إلى العلامات الخضراء الثلاث.',
  hint(api){const[a,b,c]=api.state.sol;return `الصمام ١ = (العدّاد١ + العدّاد٣ − العدّاد٢) ÷ ٢. جرّب القيمة ${a} للأول.`},
  build(api){const V=P2.valveMake(api.opts.seed||3);const val=[0,0,0];const names=['الصمام ١','الصمام ٢','الصمام ٣'],pairs=[[0,1],[1,2],[0,2]],gl=['١+٢','٢+٣','١+٣'];
   const wrap=h('div');wrap.style.cssText='display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0;direction:ltr';
   const gauges=pairs.map((p,i)=>{const d=h('div');d.style.cssText='width:112px';d.innerHTML='<svg viewBox="0 0 120 90" width="112"><path d="M10 80A50 50 0 0 1 110 80" fill="none" stroke="#777" stroke-width="10"/><path id="gz'+i+'" fill="none" stroke="#3ccf5a" stroke-width="10"/><line id="gn'+i+'" x1="60" y1="80" x2="60" y2="38" stroke="#e33" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="80" r="6" fill="#333"/><text x="60" y="88" text-anchor="middle" font-size="11" fill="currentColor">'+gl[i]+'</text></svg><div class="sub" id="gt'+i+'"></div>';wrap.append(d);return d});
   const vrow=h('div');vrow.style.cssText='display:flex;gap:14px;justify-content:center;margin:6px;direction:ltr';
   const vEls=[0,1,2].map(i=>{const d=h('div');d.innerHTML=`<div style="font-size:13px">${names[i]}</div>`;const w=h('button','pb','');w.style.cssText+=';width:78px;height:78px;border-radius:50%;font-size:24px;background:radial-gradient(#c0a050,#6a4a1a);color:#fff;transition:transform .2s';const m=h('button','pb','−');m.style.minWidth='34px';const p=h('button','pb','+');p.style.minWidth='34px';
     const set=(v)=>{val[i]=(v+5)%5;w.textContent=val[i];w.style.transform=`rotate(${val[i]*72}deg)`;w.firstChild&&0;A.click();upd()};w.onclick=()=>set(val[i]+1);p.onclick=()=>set(val[i]+1);m.onclick=()=>set(val[i]-1);w.textContent='0';d.append(m,w,p);vrow.append(d);return{set,w}});
   function ang(v){return -Math.PI+Math.min(1,v/8)*Math.PI}
   function upd(){let ok=true;pairs.forEach((p,i)=>{const v=val[p[0]]+val[p[1]],t=V.tg[i];const needle=document.getElementById('gn'+i);if(needle){const a=ang(v);needle.setAttribute('x2',60+Math.cos(a)*42);needle.setAttribute('y2',80+Math.sin(a)*42)}
      const z=document.getElementById('gz'+i);if(z){const a0=ang(t-0.5),a1=ang(t+0.5),r=50;z.setAttribute('d',`M${60+Math.cos(a0)*r} ${80+Math.sin(a0)*r}A50 50 0 0 1 ${60+Math.cos(a1)*r} ${80+Math.sin(a1)*r}`)}
      const gt=document.getElementById('gt'+i);if(gt)gt.textContent=`الهدف ${t} · الآن ${v}`;if(v!==t)ok=false});
     if(ok&&!api.solved)api.solve()}
   api.body.append(wrap,vrow);setTimeout(upd,20);api.state={sol:V.sol,tg:V.tg,val,vEls,set:(i,v)=>vEls[i].set(v)};Puz.defs.valves.cheat=a=>{V.sol.forEach((v,i)=>{val[i]=v});upd()}}},
 /* ---------- morse (flash code) ---------- */
 morse:{title:'شفرة الوميض',sub:'شاهد المصباح: كل مجموعة ومضات تمثّل رقماً (عدد الومضات). أدخل الأرقام الثلاثة بالترتيب.',

   const tally=h('div','sub','—');tally.style.fontSize='22px';const disp=h('div','disp','---');disp.style.fontSize='28px';const kp=h('div');kp.style.cssText='display:flex;gap:6px;justify-content:center;margin:6px;direction:ltr';

   function cycle(){if(!alive)return;let t=0;tally.textContent='—';code.forEach((n,gi_)=>{T(()=>{tally.textContent='المجموعة '+(gi_+1)+': '},t);for(let k=0;k<n;k++){T(()=>{lamp.style.background=B?'#ffe45e':'#ffb347';lamp.style.boxShadow='0 0 40px '+(B?'#ffe45e':'#ffb347');A.blip();tally.textContent='المجموعة '+(gi_+1)+': '+'● '.repeat(k+1)},t+k*650);T(()=>{lamp.style.background='#3a3a3a';lamp.style.boxShadow='none'},t+k*650+340)}t+=n*650+900});T(cycle,t+1800)}
   for(let d=1;d<=5;d++){const b=h('button','pb',String(d));b.onclick=()=>{if(api.solved||ent.length>=3)return;ent.push(d);A.click();upd()};kp.append(b)}

 /* ---------- weave (thread knots) ---------- */
 weave:{title:'نول الخيط',sub:'اضغط على خلية لقلب «فوق/تحت» لها ولجاراتها الأربع حتى يطابق النسيج النموذج الصغير.',
  hint(api){const left=api.state.sol.filter(i=>!api.state.done.has(i));return left.length?`جرّب الضغط على الخلية رقم ${left[0]+1} (يمين-أعلى = ١، تعدّ لليمين ثم لأسفل).`:'اقتربت!'},
  build(api){const W_=P2.weaveMake(api.opts.seed||0),g=W_.init.slice(),B=api.theme==='bright',done=new Set();const area=h('div');area.style.cssText='display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px';
   const mk=(cls)=>{const c=document.createElement('canvas');c.width=c.height=cls?100:260;c.style.cssText=`border-radius:8px;border:3px solid ${B?'#fff':'#6a4a2a'};background:${B?'#fff':'#1a1512'};${cls?'':'cursor:pointer'}`;return c};
   const cv=mk(0),mini=mk(1);const lab=h('div');lab.append(mini,h('div','sub','النموذج'));area.append(cv,lab);api.body.append(area);
   function paint(c,grid,S){const x=c.getContext('2d'),n=S/4;x.clearRect(0,0,S,S);for(let i=0;i<16;i++){const px=(i%4)*n,py=((i/4)|0)*n;x.fillStyle=B?'#fffaf0':'#241d18';x.fillRect(px,py,n,n);
     const over=grid[i];const c1=B?'#ff6f9c':'#c0392b',c2=B?'#4dd0c4':'#2a7a86';x.fillStyle=over?c1:c2;if(over){x.fillRect(px+2,py+n*0.2,n-4,n*0.6);x.fillStyle=c2;x.fillRect(px+n*0.38,py,n*0.24,n*0.2);x.fillRect(px+n*0.38,py+n*0.8,n*0.24,n*0.2)}else{x.fillRect(px+n*0.2,py+2,n*0.6,n-4);x.fillStyle=c1;x.fillRect(px,py+n*0.38,n*0.2,n*0.24);x.fillRect(px+n*0.8,py+n*0.38,n*0.2,n*0.24)}
     x.strokeStyle='rgba(0,0,0,.35)';x.strokeRect(px+0.5,py+0.5,n-1,n-1)}}

   function click(i){if(api.solved)return;P2.weaveClick(g,i);if(done.has(i))done.delete(i);else done.add(i);A.click();draw();if(g.every((v,k)=>v===W_.target[k]))api.solve()}
   cv.onclick=e=>{const q=cv.getBoundingClientRect(),x=Math.floor((e.clientX-q.left)/q.width*4),y=Math.floor((e.clientY-q.top)/q.height*4);click(y*4+x)};

 /* ---------- assemble ---------- */
 assemble:{title:'ورشة التركيب',sub:'',
  hint(api){const A_=api.state.def;const s=A_.slots.find(s=>!api.state.filled.has(s.id)&&(s.needs||[]).every(n=>api.state.filled.has(n)));return s?`القطعة التالية: «${s.n}».`:''},
  build(api){const D=P2.ASM[api.opts.kind||'decoy'];const dark=api.theme==='dark';const cols=D.col.dark||D.col.bright;const filled=new Set();let sel=null;
   const hd=api.body.parentNode.querySelector('h3');if(hd)hd.textContent=D.title;api.msg(D.sub);
   const svg=h('div');svg.style.cssText='margin:auto;width:'+D.W+'px;max-width:100%';const tray=h('div');tray.style.cssText='display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px';api.body.append(svg,tray);
   const parts=D.slots.slice().sort((a,b)=>a.id>b.id?1:-1);
   function render(){let s=`<svg viewBox="0 0 ${D.W} ${D.H}" width="${D.W}" style="background:${dark?'rgba(255,255,255,.04)':'rgba(255,255,255,.55)'};border-radius:10px">`;
     for(const sl of D.slots){const f=filled.has(sl.id);s+=`<g data-s="${sl.id}" style="cursor:pointer">${P2.shape(sl.s,sl.x,sl.y,sl.w,sl.h,f?cols[sl.i]:'rgba(255,255,255,.08)',f?'#222':(dark?'#c8a060':'#3b2a52'),!f)}</g>`}
     if(filled.has('head')&&D.slots.some(s=>s.id==='head')){const hs=D.slots.find(s=>s.id==='head');s+=`<circle cx="${hs.x+8}" cy="${hs.y-4}" r="4" fill="${dark?'#ff4a2a':'#fff'}"/><circle cx="${hs.x+8}" cy="${hs.y-4}" r="1.8" fill="#000"/>`}
     if(filled.has('head')&&D.slots.some(s=>s.id==='feet')){const hs=D.slots.find(s=>s.id==='head');s+=`<circle cx="${hs.x-12}" cy="${hs.y}" r="5" fill="#fff"/><circle cx="${hs.x+12}" cy="${hs.y}" r="5" fill="#fff"/><circle cx="${hs.x-12}" cy="${hs.y}" r="2" fill="#000"/><circle cx="${hs.x+12}" cy="${hs.y}" r="2" fill="#000"/><path d="M${hs.x-10} ${hs.y+14}q10 8 20 0" stroke="#000" stroke-width="2.5" fill="none"/>`}
     svg.innerHTML=s+'</svg>';svg.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>put(e.dataset.s));
     tray.innerHTML='';parts.forEach(p=>{if(filled.has(p.id))return;const b=h('button','pb',`<svg width="54" height="40" viewBox="${p.x-p.w/2-6} ${p.y-p.h/2-6} ${p.w+12} ${p.h+12}">${P2.shape(p.s,p.x,p.y,p.w,p.h,cols[p.i],'#222')}</svg><div style="font-size:12px">${p.n}</div>`);if(sel===p.id)b.style.outline='3px solid #ffcf3f';b.dataset.p=p.id;b.onclick=()=>{sel=p.id;A.click();render()};tray.append(b)})}
   function put(id){if(api.solved)return;if(!sel)return api.msg('اختر قطعة من الأسفل أولاً.');const sl=D.slots.find(s=>s.id===id);if(sel!==id){api.bad();api.msg('هذه القطعة لا تُركَّب هنا.');return}
     if((sl.needs||[]).some(n=>!filled.has(n))){api.bad();api.msg('ركّب «'+D.slots.find(s=>s.id===sl.needs.find(n=>!filled.has(n))).n+'» أولاً.');return}
     filled.add(id);sel=null;A.click();api.msg(D.sub);render();if(filled.size===D.slots.length)api.solve()}
   api.state={def:D,filled,select:id=>{sel=id;render()},put,fill(id){sel=id;put(id)}};render();Puz.defs.assemble.cheat=a=>{D.slots.forEach(s=>filled.add(s.id));render();a.solve()}}},
 /* ---------- wind (spring winding) ---------- */
 wind:{title:'لفّ الزنبرك',sub:'اضغط «لُفّ» عندما يكون المؤشر داخل المنطقة الخضراء. أربع لفّات ناجحة تكفي.',
  hint(){return 'انتظر حتى يصل المؤشر إلى منتصف المنطقة الخضراء ثم اضغط.'},
  build(api){let turns=0,pos=0,dirn=1,speed=0.9,af=true;const zone=[0.4,0.6];const B=api.theme==='bright';const bar=h('div');bar.style.cssText='position:relative;width:340px;max-width:92%;height:34px;margin:14px auto;border-radius:17px;background:'+(B?'#fff':'#2a2420')+';border:3px solid '+(B?'#fff':'#6a4a2a');
   const zn=h('div');zn.style.cssText=`position:absolute;top:2px;bottom:2px;left:${zone[0]*100}%;width:${(zone[1]-zone[0])*100}%;background:#3ccf5a;border-radius:12px;opacity:.8`;const mk=h('div');mk.style.cssText='position:absolute;top:-4px;width:8px;height:38px;background:#e33;border-radius:4px';bar.append(zn,mk);
   const key=h('div','sub','لفّات: 0 / 4');key.style.fontSize='20px';const btn=h('button','pb','🔧 لُفّ');btn.style.cssText+=';font-size:22px;padding:10px 40px';
   const spr=h('div');spr.style.cssText='font-size:34px;letter-spacing:2px;margin:4px;direction:ltr';
   function attempt(){if(api.solved)return;if(pos>=zone[0]&&pos<=zone[1]){turns++;speed+=0.25;A.clank(null,0.05);api.ok()}else{turns=Math.max(0,turns-1);api.bad()}key.textContent='لفّات: '+turns+' / 4';spr.textContent='〰'.repeat(Math.max(1,6-turns))+'⚙'.repeat(0);if(turns>=4)api.solve()}
   btn.onclick=attempt;const kd=e=>{if(Puz.active&&Puz.active.id==='wind'&&e.code==='Space'){attempt();e.preventDefault()}};addEventListener('keydown',kd);
   let last=performance.now();const tick=()=>{if(!af)return;const n=performance.now(),dt=(n-last)/1000;last=n;pos+=dirn*speed*dt;if(pos>=1){pos=1;dirn=-1}if(pos<=0){pos=0;dirn=1}mk.style.left=(pos*98)+'%';requestAnimationFrame(tick)};tick();
   spr.textContent='〰〰〰〰〰〰';api.body.append(bar,spr,key,btn);api.state={zone,setPos(v){pos=v;dirn=0;mk.style.left=(pos*98)+'%'},attempt,get turns(){return turns}};
   Puz.defs.wind.cleanup=()=>{af=false;removeEventListener('keydown',kd)};Puz.defs.wind.cheat=a=>{turns=4;a.solve()}}},
 /* ---------- jigsaw (swap tiles) ---------- */
 jigsaw:{title:'ملصق الورشة',sub:'اضغط قطعتين لتبديل مكانيهما حتى تكتمل صورة الملصق.',
  hint(api){const p=api.state.perm;const i=p.findIndex((v,k)=>v!==k);return i<0?'':`القطعة في الموضع ${i+1} ليست مكانها.`},
  build(api){const N=6,TW=110,TH=100;const cv=document.createElement('canvas');cv.width=TW*3;cv.height=TH*2;const g=cv.getContext('2d');
   const sky=g.createLinearGradient(0,0,0,TH*2);sky.addColorStop(0,'#8fd3ff');sky.addColorStop(1,'#ffe9b8');g.fillStyle=sky;g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#6bbf59';g.fillRect(0,TH*1.5,cv.width,TH*0.5);
   g.fillStyle='#ffd23f';TexLib.star(g,TW*1.5,TH*0.7,60,5);g.fillStyle='#ff7aa8';g.fillRect(40,TH*1.1,90,70);g.fillStyle='#fff';g.fillRect(60,TH*1.35,24,35);g.fillStyle='#e8441a';g.beginPath();g.moveTo(30,TH*1.1);g.lineTo(85,TH*0.7);g.lineTo(140,TH*1.1);g.fill();
   g.fillStyle='#4dd0c4';g.beginPath();g.arc(TW*2.4,TH*1.3,38,0,7);g.fill();g.fillStyle='#fff';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText('ورشة النجمة',TW*1.5,TH*1.88);
   const r=mulberry(api.opts.seed||4);let perm=[0,1,2,3,4,5];do{perm.sort(()=>r()-0.5)}while(perm.every((v,i)=>v===i));let sel=-1;

   function pick(pos){if(api.solved)return;A.click();if(sel<0){sel=pos;render();return}[perm[sel],perm[pos]]=[perm[pos],perm[sel]];sel=-1;render();if(perm.every((v,i)=>v===i))api.solve()}

 /* ---------- paint ---------- */
 paint:{title:'ورشة الدهان',sub:'اخلط الأحمر والأصفر والأزرق حتى يطابق لون الدمية اللون النموذجي. (±٨)',
  hint(api){return `الأصفر قريب من ${api.state.tg[1]}، الأحمر ${api.state.tg[0]}، الأزرق ${api.state.tg[2]}.`},
  build(api){const r=mulberry(api.opts.seed||6);let tg;do{tg=[20+((r()*60)|0),20+((r()*60)|0),20+((r()*60)|0)]}while(Math.max(...tg.map(v=>Math.abs(v-50)))<22);const cur=[50,50,50];

Story.tick=function(dt,t){
  if(Game.chapter>=2)return CHS().tick(dt,t);
  G.time+=dt;
  for(let i=Story.anims.length-1;i>=0;i--)if(Story.anims[i](dt)===true)Story.anims.splice(i,1);
  const rk=P.roomName;if(rk!==Story.lastRoom){const pr=Story.lastRoom;Story.lastRoom=rk;Story.onRoom(rk,pr)}
  // cameo trigger: after door B opened, standing near the north end of gal
  if(MOODY()&&F('keyB')&&!F('cameo')&&rk==='gal'&&P.pos.z<-11)Story.cameo();
  // plates
  if(F('toyEnter')&&!F('vault')){const FX=Story.fx;const onA=Math.abs(P.pos.x-2)<1&&Math.abs(P.pos.z+34)<1;let onB=false;for(const o of W.dyn)if(o.name==='crate'&&Math.abs(o.body.position.x-6)<0.8&&Math.abs(o.body.position.z+34)<0.8&&o.body.position.y<1)onB=true;
    FX.plateA.material.emissiveIntensity=onA?2:0.6;FX.plateB.material.emissiveIntensity=onB?2:0.6;FX.plateA.position.y=onA?0.01:0.03;
    if(onA&&onB){setF('vault');W.setDoor('vault',true);say(MOODY()?'sis':'star','الخزنة تنفتح! ابحث عن الترس.',3);UI.save()}}
  // conveyors
  if(F('asmPower')&&Story.fx.convTex)Story.fx.convTex.offset.y-=dt*0.6;
  // presses
  if(Story.fx.press){for(let k=0;k<3;k++){const p=Story.fx.press[k];p.cd=Math.max(0,p.cd-dt);
    if(p.armed>0){p.armed-=dt;if(p.state===0&&HK.visible&&HK.state!=='stun'&&HK.state!=='dead'&&HK.state!=='off'&&Math.abs(HK.x-p.x)<1.7&&Math.abs(HK.z+54)<1.3){p.state=4;p.t=0;p.armed=0;A.clank({x:p.x,y:5,z:-54},0.15);A.whoosh({x:p.x,y:4,z:-54})}}
    if(p.state===4){p.t+=dt;p.g.position.y=6.2+Math.sin(p.t*40)*0.05;if(p.t>=0.4){p.state=1;p.t=0}}
    else if(p.state===1){p.t+=dt;p.g.position.y=lerp(6.2,0.75,smooth(p.t/0.16));if(p.t>=0.16){p.state=2;p.t=0;A.thud({x:p.x,y:0.5,z:-54},0.9);A.clank({x:p.x,y:1,z:-54},0.2);P.shake=Math.max(P.shake,0.5);
        if(HK.visible&&Math.abs(HK.x-p.x)<2.3&&Math.abs(HK.z+54)<2.7){if(HK.hit()){G.hakkiHits++;say('hakki','آآخ! ...',1.5);if(HK.hp<=0)Story.onHakkiDown()}}
        if(MOODY()&&!Set_.lowFear&&Math.abs(P.pos.x-p.x)<1.5&&Math.abs(P.pos.z+54)<1.9&&!P.dead){Game.caught('press')}p.cd=6}}
    else if(p.state===2){p.t+=dt;if(p.t>0.5)p.state=3}
    else if(p.state===3){p.g.position.y=Math.min(6.2,p.g.position.y+dt*3);if(p.g.position.y>=6.2){p.state=0}}}}
  // finale sequence lamps (boody)
  if(W.mode==='boody'&&F('pipesOk')&&!F('finaleOk')&&Story.fx.seqLamps){Story.tmr.seq=(Story.tmr.seq||0)+dt;const c=Story.tmr.seq%9;const idx=Math.floor(c/1.1);const on=idx<4&&(c%1.1)<0.6?SEQ[idx]:-1;Story.fx.seqLamps.forEach((l,i)=>l.material.emissiveIntensity=i===on?3:0.1)}
  // ending trigger
  if(F('exitOpen')&&P.pos.z<-70.3&&!Game.ended){Game.ending()}
  // moody ambience: flicker + occasional radio
  if(MOODY()){Story.tmr.fl=(Story.tmr.fl||rnd(25,45))-dt;if(Story.tmr.fl<=0&&!Set_.noFlash&&!P.hidden){Story.tmr.fl=rnd(30,60);W.flick={until:t+rnd(0.3,0.9),rooms:[rk]}}}
  // Hakki
  HK.update(dt,t);
  if(HK.state==='dead'&&HK.t>3.5&&Story.finale)Story.onHakkiDown();
};

Story2.jet=function(x,y,z,dx,dz,tag){const n=46,geo=new THREE.BufferGeometry(),pos=new Float32Array(n*3),age=new Float32Array(n);for(let i=0;i<n;i++)age[i]=Math.random();

  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=4;
  const pos=[],uv=[],nor=[];const quad=(cx,cy,cz,nx,nz,k)=>{const w=1.1,hh=1.38,ux=-nz,uz=nx;const u0=(k%cols)/cols,v0=1-(((k/cols)|0)+1)/rows,du=1/cols,dv=1/rows;

Story3.tick=function(dt,t){
  G.time+=dt;
  for(let i=Story.anims.length-1;i>=0;i--)if(Story.anims[i](dt)===true)Story.anims.splice(i,1);
  const rk=P.roomName;if(rk!==Story3.lastRoom){const pr=Story3.lastRoom;Story3.lastRoom=rk;Story3.onRoom(rk,pr)}
  const M=MOODY();
  if(W.noises.length){for(const n of W.noises)n.life-=dt;W.noises=W.noises.filter(n=>n.life>0)}
  Kit.glowStations(Story3,t);Kit.tickZones(dt);
  // carousel spin + bobbing horses + calliope music (positional)
  const c=Story3.car;if(c){if(Story3.carStop)c.w=Math.max(0,c.w-0.35*dt);c.rot.rotation.y+=c.w*dt;c.ph+=c.w*dt*5;c.mA.position.y=Math.sin(c.ph)*0.25;c.mB.position.y=-Math.sin(c.ph)*0.25;
    if(c.w>0.02&&['gate','carou','ghost'].includes(rk)){Story3.calT-=dt;if(Story3.calT<=0){Story3.calT=M?0.46:0.34;A.calliope({x:0,y:3,z:-28.5},Story3.calStep++,M)}}}
  // distant laugh at the very beginning (moody)
  if(M&&rk==='gate'&&!F('gateLaugh')&&G.time>7){setF('gateLaugh');A.jangleLaugh({x:0,y:2,z:-30},1.1);UI.cue('ضحكة صندوق موسيقي بعيدة أمامك','jgfar');Story3.setCP('start')}
  // cart rails: reaching the station plate
  if(Story3.cart&&!F('p_cart')&&Story3.cart.body.position.z<-66.9&&F('p_switches'))Story3.cartDone();
  // cans: knocked off the table?
  Story3.tmr.cans=(Story3.tmr.cans||0)-dt;if(Story3.tmr.cans<=0&&Story3.cans.length&&!F('p_cans')){Story3.tmr.cans=0.4;let n=0;for(const o of Story3.cans){const p=o.body.position;if(p.y<0.95||Math.hypot(p.x-o.home.x,p.z-o.home.z)>0.5||Math.abs(p.y-o.home.y)>0.18)n++}if(n>=4)Story3.cansDone();
    const b=Story3.ball.body;if(b.position.y<0.5&&!F('p_cans')){Story3.tmr.ballT=(Story3.tmr.ballT||0)+0.4;if(Story3.tmr.ballT>3){Story3.tmr.ballT=0;b.position.set(Story3.ball.home.x,Story3.ball.home.y,Story3.ball.home.z);b.velocity.set(0,0,0);toast('عادت الكرة إلى بداية الطاولة')}}}
  // trapdoors + audience + marionette (moody)
  if(M&&Story3.traps.length){for(const T of Story3.traps){T.open=lerp(T.open,T.target,1-Math.exp(-dt*7));T.hinge.rotation.x=-T.open*1.45;T.mk.material.opacity=T.armed>Game.t?1:0.45;T.mk.visible=true;
      if(T.target&&Game.t>T.closeAt)T.target=0;
      if(T.armed>Game.t&&JG.visible&&JG.state!=='fall'&&JG.state!=='off'&&Math.hypot(JG.x-T.d.x,JG.z-T.d.z)<1.35){T.armed=0;T.target=1;T.closeAt=Game.t+3;A.trapOpen({x:T.d.x,y:0.3,z:T.d.z});JG.x=T.d.x;JG.z=T.d.z;JG.fall()}}
    if(Story3.dolls){if(Story3.audienceTurn){Story3.audienceTurn+=dt;Story3.dolls.position.y=Math.abs(Math.sin(Story3.audienceTurn*18))*0.1*Math.max(0,1-Story3.audienceTurn/2);if(Story3.audienceTurn>2.2){Story3.dolls.position.y=0;Story3.audienceTurn=0}}}
    if(Story3.marionette&&HK.g){const w=Story3.marionetteWake,g=HK.g,R=HK.rig;g.position.set(0,2.2+Math.sin(t*0.9)*0.05,-189.5);g.rotation.y=w?lerp(g.rotation.y,Math.atan2(P.pos.x,P.pos.z+189.5),1-Math.exp(-dt*3)):Math.sin(t*0.3)*0.15;g.rotation.z=Math.sin(t*0.7)*0.03;
      R.head.rotation.x=w?lerp(R.head.rotation.x,-0.05,1-Math.exp(-dt*3)):0.55;R.neck.rotation.z=w?0:0.3;R.aL.sh.rotation.x=Math.sin(t*0.8)*0.1;R.aR.sh.rotation.x=w?lerp(R.aR.sh.rotation.x,-1.6,1-Math.exp(-dt*2)):Math.sin(t*0.9+1)*0.1;R.eyeGlow.color.setRGB(w?2.2:0.5,w?1.4:0.3,0.3);if(R.eyeLight)R.eyeLight.intensity=w?0.8:0.15;
      const hy=2.2,pos=Story3.strings.geometry.attributes.position,S=[[0,hy+3.15,0,0,10.8],[-0.55,hy+1.2,0.0,-0.55,10.8],[0.55,hy+1.2,0.0,0.55,10.8],[-0.26,hy+0.9,0,-0.26,10.8],[0.26,hy+0.9,0,0.26,10.8],[0,hy+2.2,0.2,0,10.8]];S.forEach((s,i)=>{pos.setXYZ(i*2,s[0]+g.position.x*0,s[1],-189.5+s[2]);pos.setXYZ(i*2+1,s[3],s[4],-189.5)});pos.needsUpdate=true}}
  // bright: friendly toys + confetti
  if(!M){for(const f of Story3.toys)f(dt)}
  if(Story3.confetti&&!Story3.confP){Story3.confP=Kit.confetti(0,9,-184,20,10)}if(Story3.confP)Kit.tickConfetti(Story3.confP,dt);
  // Jangle
  if(M){JG.update(dt,t);
    if(JG.visible&&JG.state==='chase'&&JG.dist<8&&!Story3.firstChase){Story3.firstChase=true}
    // beetle shell prop sways its legs like it is flickering
  }
  Story3.rideTick(dt);
  if(M){Story.tmr.fl=(Story.tmr.fl||rnd(25,45))-dt;if(Story.tmr.fl<=0&&!Set_.noFlash&&!P.hidden){Story.tmr.fl=rnd(30,60);W.flick={until:t+rnd(0.3,0.9),rooms:[rk]}}}
};

 1:{btn:'الفصل ١: المدخل وغرفة الألعاب',sub:'الفصل الأول: المدخل وغرفة الألعاب — مصنع ألعاب النجمة',bd:'<b>مغامرة ألغاز مرحة</b> في مصنع ألعاب نهاري ملوّن — بلا وحوش ولا رعب ولا أصوات مخيفة.',bt:['١٥ لغزاً','مناسبة للجميع','تلميحات'],md:'<b>رعب في المصنع المظلم</b>: دمية مخيطة طويلة تتعقبك، مطاردات، فتحات تهوية، وألغاز بذراع الشد. <b>١٣+</b>',mt:['١٠ ألغاز','مطاردات','١٣+']},
 2:{btn:'الفصل ٢: المصنع السفلي',sub:'الفصل الثاني: المصنع السفلي — مصعد البضائع، الغلايات، قاعة الأقنعة',bd:'<b>ورشة الألعاب السفلية</b>: ١٤ لغز بناء وتركيب (روبوت، خنفساء، قطار...) في غرف نهارية بلا وحوش ولا رعب.',bt:['١٤ لغز بناء','بلا وحوش','تلميحات'],md:'<b>خرخوش</b> الخنفساء الحديدية تُسمَع قبل أن تُرى، وهاكي واكي يعود، و<b>الخيّاط الأعمى</b> في النهاية. ٩ ألغاز. <b>١٣+</b>',mt:['٩ ألغاز','تسلل وصوت','١٣+']},
 3:{btn:'الفصل ٣: مدينة الملاهي المنسية',sub:'الفصل الثالث: مدينة الملاهي المنسية — دوّار الخيل، قطار الأشباح، متاهة المرايا، الدولاب الكبير، المسرح',bd:'<b>ورشة الكرنفال المشرقة</b>: ١٣ لغزاً بين الدوّار والقطار والمرايا والألعاب والدولاب والمسرح — بلا وحوش ولا رعب.',bt:['١٣ لغزاً','فيزياء ممتعة','بلا وحوش'],md:'<b>جلجل</b>، المهرّج الأجوف الواقف على كرة: تعرفه بضحكة صندوق موسيقي وكرة تتدحرج. ١٠ ألغاز، فيزياء، وفخاخ مسرح. <b>١٣+</b>',mt:['١٠ ألغاز','تسلل وفيزياء','١٣+']},
 4:{btn:'الفصل ٤: قلب المصنع',sub:'الفصل الرابع والأخير: قلب المصنع — السيور، التروس، غرفة التحكم، الغلاية، برج الساعة',bd:'<b>إعادة المصنع للحياة</b>: ١٠ ألغاز احتفالية تنتهي بعرض أنوار وخاتمة سعيدة وسرّ صغير. بلا رعب.',bt:['١٠ ألغاز','خاتمة سعيدة','تلميحات'],md:'<b>المواجهة الأخيرة مع هاكي واكي</b>: ٨ ألغاز، سيور وتروس وبخار، ثم لحن يهدّئه... لا دماء ولا تقطيع. <b>١٣+</b>',mt:['٨ ألغاز','مواجهة أخيرة','١٣+']}};
UI.title=function(ch0){
  Game.state='title';In.enabled=false;if(document.pointerLockElement)document.exitPointerLock();$('hud').classList.remove('on');$('touch').classList.remove('on');document.body.className='';$('blackout').classList.remove('on');
  const ch=ch0||UI.chapter();LS.set('hakki_chapter',ch);
  const sb=UI.loadSave('boody',ch),sm=UI.loadSave('moody',ch);
  const T=CHINFO[ch];
  const chbtns=[1,2,3,4].map(c=>`<button class="chb${ch===c?' on':''}" data-c="${c}" id="ch_${c}">${CHINFO[c].btn}${(UI.loadSave('boody',c)||UI.loadSave('moody',c))?' ●':''}</button>`).join('');
  const e=$('scr_title');e.innerHTML=`<div style="max-width:980px;width:100%"><h1>مودي بودي هاكي واكي</h1><div class="chs" id="chsel">${chbtns}</div><p style="margin:0 0 6px;color:var(--dim)">${T.sub}</p><h2 style="margin:10px 0">اختر من تلعب؟</h2>
  <div class="cards">
  <div class="card boody" id="c_boody" tabindex="0" role="button"><div>${avatar('boody')}</div><h2>بودي</h2><p>${T.bd}</p><div>${T.bt.map(x=>`<span class="tag">${x}</span>`).join('')}</div>${sb?`<button class="b pri" id="c_boody_cont" style="color:#fff">متابعة</button>`:''}<button class="b" id="c_boody_new" style="color:#3b2a52;background:#fff">${sb?'لعبة جديدة':'ابدأ اللعب'}</button></div>
  <div class="card moody" id="c_moody" tabindex="0" role="button"><div>${avatar('moody')}</div><h2>مودي</h2><p>${T.md}</p><div>${T.mt.map(x=>`<span class="tag">${x}</span>`).join('')}</div>${sm?`<button class="b pri" id="c_moody_cont">متابعة</button>`:''}<button class="b" id="c_moody_new">${sm?'لعبة جديدة':'ابدأ اللعب'}</button></div></div>
  <div style="margin-top:14px"><button class="b" id="t_set">⚙ الإعدادات</button><button class="b" id="t_how">❓ طريقة اللعب</button></div><p style="font-size:12px;color:var(--dim);margin:6px 0 0">● = يوجد تقدّم محفوظ في هذا الفصل · لكل فصل ولكل مسار حفظ مستقل · الفصول الأربعة مفتوحة من البداية</p></div>`;
  UI.show('scr_title');
  const go=(m,cont)=>{A.resume();const brief=()=>UI.brief(m,ch,cont,()=>Game.start(m,cont,ch),()=>UI.title(ch));if(m==='moody'&&!LS.get('hakki_age13',false))UI.gate(m,cont,ch);else brief()};
  for(const c of [1,2,3,4])$('ch_'+c).onclick=()=>UI.title(c);
  $('c_boody_new').onclick=ev=>{ev.stopPropagation();go('boody',false)};$('c_moody_new').onclick=ev=>{ev.stopPropagation();go('moody',false)};
  if(sb)$('c_boody_cont').onclick=ev=>{ev.stopPropagation();go('boody',true)};if(sm)$('c_moody_cont').onclick=ev=>{ev.stopPropagation();go('moody',true)};
  $('c_boody').onclick=()=>go('boody',!!sb);$('c_moody').onclick=()=>go('moody',!!sm);
  $('t_set').onclick=()=>UI.settings('title');$('t_how').onclick=UI.how};
UI.brief=function(m,ch,cont,onStart,onBack){const mo=m==='moody',e=$('scr_brief');UI.show('scr_brief');e.classList.remove('mo','bo');e.classList.add(mo?'mo':'bo');const touch=isTouch||/touch=1/.test(location.search);
  const S={
   '1m':{sub:'الفصل الأول: المدخل وغرفة الألعاب',story:['ليلة الإغلاق في <b>مصنع ألعاب النجمة</b>. اختفت أختك الصغيرة <b>بودي</b> بين الرفوف.','دمية خرق طويلة مخيطة اسمها <b>هاكي واكي</b> تتجول في العتمة وتتبع صوت <b>الصندوق الموسيقي</b>.','مهمتك: أعد الكهرباء، حلّ ألغاز الأبواب، واهرب من الدمية إلى <b>الخروج</b>.']},
   '1b':{sub:'الفصل الأول: المدخل وغرفة الألعاب',story:['أهلاً بك في <b>مصنع ألعاب النجمة</b> المشرق! دعتك الدمية الودودة <b>نجمة</b> للّعب.','في كل غرفة <b>ألغاز</b> ممتعة: أسلاك، بطاقات، تروس وموسيقى.','لا وحوش ولا مفاجآت مخيفة. اجمع <b>٣ نجوم ذهبية</b> وافتح باب الخروج!']},
   '2m':{sub:'الفصل الثاني: المصنع السفلي',story:['هبطتَ إلى <b>الطابق السفلي</b> وانغلقت البوابة العليا خلفك. صوت <b>بودي</b> يصلك واهناً من اللاسلكي.','<b>خرخوش</b>، خنفساء حديدية بزنبرك، تُسمَع قبل أن تُرى. و<b>هاكي واكي</b> يطوف حول الغلايات.','في العمق ينتظر <b>الخيّاط الأعمى</b>: لا يرى... لكنه يسمع كل شيء.','مهمتك: <b>اصمت، اسمع، واعبر</b> المصعد والغلايات وقاعة الأقنعة.']},
   '2b':{sub:'الفصل الثاني: المصنع السفلي',story:['خلف الباب الأخير سلّم إلى <b>ورشة الألعاب السفلية</b>.','هنا <b>تبنين</b> الألعاب: روبوت وخنفساء و<b>قطار النجمة الذهبي</b>.','١٤ لغز بناء وتركيب، كل واحد يمنحك <b>قطعة</b>. بلا وحوش ولا رعب!']},
   '3m':{sub:'الفصل الثالث: مدينة الملاهي المنسية',story:['هبط بك المصعد إلى <b>مدينة ملاهي كاملة</b> مدفونة تحت المصنع: دوّار خيل، قطار أشباح، متاهة مرايا، دولاب كبير ومسرح.','في العتمة يتدحرج <b>جلجل</b>، المهرّج الأجوف: دمية بلا داخل تقف على كرة، وفي صدرها صندوق موسيقي يضحك. <b>تسمع ضحكته وكرته تتدحرج</b> قبل أن تراه.','هاكي واكي وبقية الألعاب القديمة تظهر هنا بأدوار جديدة... وبودي تركت لك أثراً: تذكرة مثقوبة.','مهمتك: <b>اعبر البوابة بتذكرة صحيحة</b>، أوقف الدولاب، وانزل عبر خشبة المسرح.']},
   '3b':{sub:'الفصل الثالث: مدينة الملاهي المنسية',story:['أهلاً بك في <b>مدينة الملاهي</b> التي استيقظت بعد نوم طويل! دعتك <b>نجمة</b> لإعادة تشغيل كل لعبة.','دوّار الخيل، قطار الأشباح الودود، متاهة المرايا، بسطات الألعاب، الدولاب الكبير والمسرح.','<b>١٣ لغزاً مرحاً</b> (فيزياء وألوان وأرقام وأنغام). كل لعبة تعمل تُضيء أنوار المدينة. بلا وحوش ولا مفاجآت مخيفة!']},
   '4m':{sub:'الفصل الرابع والأخير: قلب المصنع',story:['آخر مصعد يهبط بك إلى <b>قلب المصنع</b>: سيور، تروس بحجم الأبنية، غرفة تحكم، غلاية كبرى وبرج ساعة.','هنا ينتظرك <b>هاكي واكي</b> وجهاً لوجه، وهنا السرّ الذي لم يخبرك به أحد.','لا تُهزم الدمية بالقوة: <b>اسمع، افهم، ورتّل اللحن</b> الذي يهدّئ القلب.','مهمتك: شغّل الآلات، افتح الغرف، وأنهِ ليلة المصنع الطويلة.']},
   '4b':{sub:'الفصل الرابع والأخير: قلب المصنع',story:['تهانينا! وصلتِ <b>قلب المصنع</b>، حيث الساعة الكبرى التي تُدير كل الألعاب.','أصلحي السيور والتروس والغلاية وغرفة التحكم لتعود الأنوار والموسيقى إلى المصنع كله.','<b>١٠ ألغاز احتفالية</b> ثم عرض أنوار كبير مع كل أصدقاء الألعاب. بلا وحوش ولا رعب!']}};
  const d=S[ch+(mo?'m':'b')];
  const chips=(touch?[['عصا يسار','حركة'],['اسحب يمين','نظر'],['ذراع','الأداة'],['تفاعل','E'],['ركض','Shift']]:[['WASD / الأسهم','حركة'],['الفأرة','نظر'],['Q / نقر','الأداة'],['E','تفاعل'],['Shift','ركض']]).map(c=>`<span class="chip">${c[1]}<kbd>${c[0]}</kbd></span>`).join('');
  const tool=`<div class="bc"><h3>🦾 ذراع الشد</h3><p>قفاز بنابض يمدّ ذراعك حتى <b>٩–١٤ متراً</b>: يسحب المقابض والحبال، ويلتقط الأشياء الصغيرة، ويجرّ الصناديق.</p><p>صوّب نحو الهدف ثم اضغط <b>${touch?'زر «ذراع»':'Q أو زر الفأرة'}</b>.${mo?' (صوت الشدّ يُسمَع!)':''}</p></div>`;
  const side=mo?`<div class="bc dg"><h3>⚠ احذر</h3><p>${ch===4?'<b>هاكي واكي</b>: دندنة صندوق موسيقي وأزرار عيون مضيئة. اسمع، اختبئ، ولا تدعه يقترب من الأجراس.':ch===3?'<b>ضحكة صندوق موسيقي</b> + <b>كرة تتدحرج</b> = <b>جلجل</b>. سريع في الخط المستقيم، بطيء في المنعطفات: اجعله يصطدم بالأعمدة!':ch===2?'تكتكة معدنية سريعة = <b>خرخوش</b>. قصّ المقص المتباعد = <b>الخيّاط</b>.':'تسمع <b>دندنة صندوق موسيقي</b> وتلمع <b>أزرار عينين</b> في العتمة؟ هاكي قريب.'}</p><p>خفقان القلب يعني خطراً. لا تركض بلا داعٍ (<b>Shift</b>) واختبئ في الصناديق. وضع «خفيف» متاح من الإعدادات.</p></div>`:`<div class="bc"><h3>💡 تلميح</h3><p>تعلق؟ اضغط <b>H</b> أو زر «تلميح»: ثلاثة مستويات، من إشارة خفيفة إلى الحل.</p><p>للألغاز زر 💡 داخلها أيضاً. خذ وقتك فلا مؤقتات.</p></div>`;
  e.innerHTML=`<div class="bw"><div class="bcau">${mo?'تحذير: منطقة مصنع الألعاب المهجور — للكبار فقط 13+':'مرحباً بالمغامرين الصغار! منطقة ألعاب آمنة ومرحة ★'}</div><div class="bt">مودي بودي هاكي واكي</div><div class="bsub">${d.sub} — ${mo?'مودي':'بودي'}</div>
   <div class="bst">${d.story.map(l=>`<p>${l}</p>`).join('')}</div><div class="brow">${tool}${side}</div><div class="chips">${chips}</div>
   <div><button class="bgo" id="b_go">ابدأ اللعب</button><button class="bsm" id="b_snd">${Set_.volume>0?'🔊 الصوت: يعمل':'🔇 الصوت: مكتوم'}</button><button class="bsm" id="b_back">رجوع</button></div></div>`;
  $('b_go').onclick=()=>{UI.hideAll();A.resume();onStart()};$('b_back').onclick=()=>{onBack()};
  $('b_snd').onclick=()=>{if(Set_.volume>0){UI._vol=Set_.volume;Set_.volume=0}else Set_.volume=UI._vol||0.8;saveSettings();A.applyVol();$('b_snd').textContent=Set_.volume>0?'🔊 الصوت: يعمل':'🔇 الصوت: مكتوم'};
  $('b_go').focus({preventScroll:true});setTimeout(()=>{if($('scr_brief').classList.contains('on'))$('b_go').focus({preventScroll:true})},120)};
UI.gate=function(m,cont,ch){const e=$('scr_gate');e.innerHTML=`<div class="box"><h2>⚠ تنبيه: لعبة رعب</h2><p>مسار «مودي» يحتوي على أجواء مظلمة ومطاردات ومفاجآت صوتية وبصرية. لا دماء ولا تقطيع، لكن الخوف حاضر. مناسبة لعمر <b>١٣ سنة فأكثر</b>.</p>
   <div class="warn">إن كنت حساساً للومضات أو الخوف، فعّل «وضع خفيف» و«إيقاف الوميض» من الإعدادات.</div>
   <div class="row"><span>وضع خفيف (أقل رعباً)</span><input type="checkbox" id="g_lf"${Set_.lowFear?' checked':''}></div><div class="row"><span>إيقاف الوميض</span><input type="checkbox" id="g_nf"${Set_.noFlash?' checked':''}></div>
   <button class="b pri" id="g_ok">عمري ١٣+ — ابدأ</button><button class="b" id="g_no">رجوع</button></div>`;UI.show('scr_gate');
  $('g_ok').onclick=()=>{Set_.lowFear=$('g_lf').checked;Set_.noFlash=$('g_nf').checked;saveSettings();LS.set('hakki_age13',true);UI.brief(m,ch,cont,()=>Game.start(m,cont,ch),()=>UI.title(ch))};$('g_no').onclick=()=>UI.title(ch)};
UI.how=function(){const e=$('scr_settings');e.innerHTML=`<div class="box" style="text-align:right"><h2>طريقة اللعب</h2><p><b>الحركة:</b> W A S D أو الأسهم · <b>النظر:</b> الفأرة (انقر الشاشة لقفل المؤشر) · <b>ركض:</b> Shift · <b>انحناء:</b> C</p><p><b>تفاعل:</b> E أو Space · <b>ذراع الشد:</b> زر الفأرة الأيسر أو Q (يسحب الأشياء من بعيد) · <b>كشاف:</b> F · <b>إطلاق الخنفساء المموِّهة (الفصل ٢):</b> R · <b>مفكرة:</b> N أو Tab · <b>تلميح:</b> H · <b>إيقاف:</b> Esc</p>
   <p><b>الجوال:</b> عصا افتراضية يسارًا، اسحب يمين الشاشة للنظر، وأزرار «تفاعل/ذراع/ركض/انحناء/كشاف».</p><p><b>يد التحكم:</b> العصا اليسرى حركة، اليمنى نظر، A تفاعل، RT ذراع الشد، X كشاف، Y تلميح، B انحناء، Start إيقاف.</p><p>الألغاز تتوقف فيها اللعبة ويمكن لعبها بالفأرة أو اللمس.</p><button class="b" id="s_back">رجوع</button></div>`;UI.show('scr_settings');$('s_back').onclick=()=>UI.back()};
UI.back=function(){if(UI.from==='pause')UI.pauseScreen();else UI.title()};
UI.settings=function(from){UI.from=from;const e=$('scr_settings');
  const sel=(k,opts)=>`<select id="s_${k}">${opts.map(o=>`<option value="${o[0]}"${String(Set_[k])===String(o[0])?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  const chk=(k)=>`<input type="checkbox" id="s_${k}"${Set_[k]?' checked':''}>`;
  e.innerHTML=`<div class="box" style="text-align:right"><h2>الإعدادات</h2>
  <div class="row"><span>جودة الرسم</span>${sel('quality',[['auto','تلقائي'],['low','منخفضة'],['medium','متوسطة'],['high','عالية']])}</div>
  <div class="row"><span>مستوى الصوت</span><input type="range" id="s_volume" min="0" max="1" step="0.05" value="${Set_.volume}"></div>
  <div class="row"><span>حساسية النظر</span><input type="range" id="s_sens" min="0.4" max="2.5" step="0.1" value="${Set_.sens}"></div>
  <div class="row"><span>الترجمة النصية</span>${chk('subs')}</div><div class="row"><span>وصف الأصوات (تكتكة، قصّ...)</span>${chk('cues')}</div><div class="row"><span>تلميحات داخل الألغاز</span>${chk('assist')}</div><div class="row"><span>الاهتزاز (الجوال)</span>${chk('vib')}</div>
  <div class="row"><span>إشعاع/توهّج (Bloom)</span>${chk('bloom')}</div>
  <div class="row"><span>وضع خفيف (أقل رعباً)</span>${chk('lowFear')}</div><div class="row"><span>إيقاف الوميض</span>${chk('noFlash')}</div>
  <div class="row"><span>قراءة الحوار بصوت (متصفح)</span>${chk('voice')}</div><div class="row"><span>عكس المحور الرأسي</span>${chk('invY')}</div>
  <button class="b pri" id="s_ok">حفظ ورجوع</button></div>`;UI.show('scr_settings');
  $('s_ok').onclick=()=>{for(const k of ['quality'])Set_[k]=$('s_'+k).value;Set_.volume=+$('s_volume').value;Set_.sens=+$('s_sens').value;for(const k of ['subs','cues','assist','vib','bloom','lowFear','noFlash','voice','invY'])Set_[k]=$('s_'+k).checked;saveSettings();A.applyVol();

Game.loop=function(ts){
  requestAnimationFrame(Game.loop);Game.frame=(Game.frame||0)+1;

  try{
    if(Game.state==='play'){
      Game.handleInput(dt);
      if(Game.state==='play'){P.update(dt,now);Story.tick(dt,now);W.tick(dt,now);
        // audio env
        const hv=HK.visible&&HK.state!=='off'&&HK.state!=='dead';let tens=hv?clamp(1-HK.dist/22,0,1)*(HK.state==='hunt'?1:0.6):0,fearT=hv&&HK.state==='hunt'?clamp(1-HK.dist/14,0,1):0;

        A.update(dt,{tension:Set_.lowFear?tens*0.6:tens,mactive:hv&&W.mode==='moody',mdist:HK.dist,mpos:{x:HK.x,z:HK.z}});
        R.fx.fear=lerp(R.fx.fear,fearT,1-Math.exp(-dt*3));R.fx.flash=Math.max(0,R.fx.flash-dt*3);
        Game.hud(dt)}
    }else if(Game.state==='puzzle'||Game.state==='dead'){
      if(Game.state==='dead'){W.tick(dt,now);HK.update(dt,now)}A.update(dt,{tension:0});
    }else if(Game.state==='pause'||Game.state==='title'||Game.state==='intro'||Game.state==='end'){
      if(Game.state==='end'&&Ending.on){if(W.scene){W.tick(dt,now);Story4.tick(dt,now);Ending.tick(dt,now)}}
      else if(Game.state==='title'||Game.state==='end'){if(W.scene){Cam.rotation.y+=dt*0.05;W.tick(dt*0.3,now)}}
      A.update(dt,{tension:0})}
    if(R.r&&W.scene&&Game.state!=='boot'){R.resize();R.render(now,dt);R.govern(dt)}
  }catch(e){console.error('LOOP',e&&e.stack||e);Game.err=(Game.err||0)+1;if(Game.err>5){Game.state='crash'}}
};
Game.boot=function(){
  if(!R.init()){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:22px">المتصفح لا يدعم WebGL المطلوب للعبة.</div>';return}
  R.q='medium';addEventListener('resize',()=>R.resize());
  $('b_pause').onclick=()=>Game.pause(true);$('b_note').onclick=()=>{if(Game.state!=='play')return;Game.state='pause';In.enabled=false;if(document.pointerLockElement)document.exitPointerLock();UI.notebook('play')};
  $('b_hint').onclick=()=>UI.toast(Story.hint(),7000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&Game.state==='play')Game.pause(true)});
  Game.state='title';UI.title();requestAnimationFrame(Game.loop)};

/* ---- debug.js ---- */
/* ===== debug hooks (only with ?debug=1) ===== */
if(/debug=1/.test(location.search)){
  window.__hk={G,P,W,HK,Story,Puz,R,Game,A,In,UI,F,setF,BT,TL,DECOY,Story2,P2,ROOMS,STEPS2,Set_,JG,Kit,P3,P4,Story3,Story4,STEPS3,STEPS4,CPS3,CPS4,Ending,Cam,
    skipTo3(id){Story3.skipTo(id)},skipTo4(id){Story4.skipTo&&Story4.skipTo(id)},
    tp(x,z,yaw){P.pos.set(x,0,z);if(yaw!=null)P.yaw=yaw;P.pitch=0},
    flags(o){Object.assign(G.F,o)},
    wait:ms=>new Promise(r=>setTimeout(r,ms)),
    stats(){return{ms:R.stats.ms,fps:R.stats.fps,calls:R.stats.calls,tris:R.stats.tris,q:R.q}},
    look(x,y,z){const dx=x-Cam.position.x,dy=y-Cam.position.y,dz=z-Cam.position.z;P.yaw=Math.atan2(-dx,-dz);P.pitch=Math.atan2(dy,Math.hypot(dx,dz))},
    cheatPuzzle(){return Puz.cheat()},
    skipTo2(id){Story2.skipTo(id)},
    giveAll(){P.hasClaw=P.hasLight=true;setF('claw');setF('light');if(P.vm)P.vm.visible=true;UI.inv()},
    // skip ahead: set flags for a given step id and open matching doors
    skipTo(id){const S={lever:['claw','light','got_claw','got_light'],wires:['power'],tokens:['doorA'],sorter:['allTok','tok_star','tok_moon','tok_heart','tok_circle','memory','drawer'],toy:['keyB'],wind:['toyEnter'],melody:['mbWound','safeReached','grate'],plates:['melodyOk'],gear:['vault'],machine:['gear'],cipher:['liftOk'],batt:['doorC','cipherKey','battOrder'],finale:['asmPower']};
      const order=Object.keys(S);const i=order.indexOf(id);for(let k=0;k<=i;k++)for(const f of S[order[k]])setF(f);
      if(G.F.melodyOk)W.setDoor('doorS',true,true);Story.applyFlags();UI.inv()}
  };
}

Lock.run(()=>Game.boot());
</script>
